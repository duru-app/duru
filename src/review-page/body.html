</style>
</head>
<body>
<header>
  <h1>duru 리뷰</h1>
  <span class="views"><button id="view-list">목록</button><button id="view-flow">흐름</button><button id="view-story">스토리</button></span>
  <span class="meta" id="meta"></span>
  <span class="baseline" id="baseline" hidden></span>
  <span class="author" id="author"></span>
  <span class="error" id="end-error"></span>
  <button id="end-review" title="코멘트를 다 남겼으면 눌러 주세요. 작업 목록이 리뷰 페이지를 띄운 터미널로 넘어갑니다">리뷰 끝</button>
</header>
<main>
  <div id="flow-bar" class="flowbar" hidden></div>
  <div id="flow" hidden></div>
  <section id="left"></section>
  <section id="center"><div id="center-head"></div><div id="center-body"></div></section>
  <section id="right"><div id="right-app" hidden></div><div id="right-info"></div><div id="right-dock"></div></section>
  <section id="gaps" hidden></section>
  <div class="sash" id="sash-left"></div>
  <div class="sash" id="sash-right"></div>
</main>
<p id="failed" class="error" hidden></p>
<dialog id="shot-view" closedby="any" aria-label="화면 그림">
  <button class="close" title="닫습니다" aria-label="닫기">✕</button>
  <img alt="">
</dialog>
<dialog id="replay-view" closedby="any" aria-label="단계 재생">
  <div class="replay-head">
    <span class="replay-count muted" title="몇 번째 단계인지"></span>
    <ul class="replay-line"></ul>
    <button class="close" title="닫습니다" aria-label="닫기">✕</button>
  </div>
  <div class="replay-shot"><img alt=""><p class="no-shot muted">화면 그림 없음</p></div>
  <div class="replay-acts">
    <button class="back" title="앞 단계로 돌아갑니다" aria-label="이전 단계로">이전</button>
    <button class="pause"></button>
    <button class="next" title="다음 단계로 넘어갑니다" aria-label="다음 단계로">다음</button>
  </div>
</dialog>
<dialog id="reason-ask" closedby="none" aria-labelledby="reason-ask-title">
  <h2 id="reason-ask-title"></h2>
  <div class="subject"></div>
  <textarea rows="4"></textarea>
  <p class="error" hidden></p>
  <div class="actions">
    <span class="muted hint"></span>
    <button class="cancel">취소</button>
    <button class="discard"></button>
  </div>
</dialog>
<dialog id="accept-ask" closedby="none" aria-labelledby="accept-ask-title">
  <h2 id="accept-ask-title">ID 와 이름을 정해 스토리로 받습니다</h2>
  <p class="candidate"></p>
  <label class="field"><span>ID</span><input type="text" id="accept-id"><small class="invalid" hidden></small></label>
  <label class="field"><span>이름</span><input type="text" id="accept-name"></label>
  <p class="error" hidden></p>
  <div class="actions">
    <button class="cancel">취소</button>
    <button class="accept">스토리로 받기</button>
  </div>
</dialog>
