const kindChip = (k) => h('span', { class: `chip kind-${k}` }, KIND_LABEL[k]);
const mixedChip = () => h('span', { class: 'chip kind-mixed' }, MIXED_KINDS);
const isRestricted = (id) => Boolean(state.data.map.screens.find((x) => x.id === id)?.access.restricted);
const LONG_GUARD = 80;
const rememberOpen = (set, key) => (e) => { if (e.currentTarget.open) set.add(key); else set.delete(key); };
const guardCode = (text, scope = null, opened = state.openLong) => {
  if (text.length <= LONG_GUARD) return h('code', {}, text);
  const key = `${scope}\n${text}`;
  const kept = scope === null ? {} : { open: opened.has(key), ontoggle: rememberOpen(opened, key) };
  return h('details', { class: 'long-guard', ...kept },
    h('summary', {}, h('code', { class: 'head' }, `${text.slice(0, LONG_GUARD)}…`)), h('code', { class: 'full' }, text));
};
const accessGuard = (g, scope, opened = state.openLong) => h('div', { class: 'guard' },
  guardCode(g.via ? inheritedText(g.guard, g.via) : g.guard, scope, opened), ' ', g.kinds.map(kindChip));

// 맵에 링크가 어떤 순서로 적혀 있든 같은 순서로 나온다.
// 같은 조건식도 파일마다 뜻이 다를 수 있어 묶는 기준에는 조건식이 풀린 결과를 함께 넣는다.
function linkGroups(links) {
  const byText = (a, b) => (a < b ? -1 : a > b ? 1 : 0);
  const meaning = (g) => JSON.stringify([g.guard, g.kinds, g.roles ?? null, g.settings ?? null, g.settingsReason ?? null]);
  const groups = new Map();
  for (const l of links) {
    const guards = [...new Map(l.guards.map((g) => [g.guard, g])).values()].sort((a, b) => byText(a.guard, b.guard));
    const key = guards.map(meaning).join('\n');
    if (!groups.has(key)) groups.set(key, { key, text: guards.map((g) => g.guard).join('\n'), guards, links: [] });
    groups.get(key).links.push(l);
  }
  for (const g of groups.values()) g.links.sort((a, b) => byText(a.from, b.from) || byText(a.file, b.file) || a.line - b.line);
  return [...groups.values()].sort((a, b) => (b.guards.length === 0) - (a.guards.length === 0) || b.links.length - a.links.length || byText(a.text, b.text) || byText(a.key, b.key));
}

function linkGroup({ key, guards, links }) {
  const { lines, bare } = openNeeds({ access: linkAccess(guards) });
  const words = [...lines.map((l) => (l.flag ? `${l.text} (${l.flag})` : l.text)), bare].filter(Boolean);
  return h('details', { class: 'link-group', open: state.openGroups.has(key), ontoggle: rememberOpen(state.openGroups, key) },
    h('summary', {}, h('span', { class: 'cond' }, guards.length ? words.join(' · ') : '조건 없음'), ' ', h('span', { class: 'count muted' }, `링크 ${links.length}`)),
    h('ul', { class: 'plain' }, links.map((l) => h('li', {},
      h('code', { class: 'from' }, l.from), ' ', h('span', { class: 'muted mono' }, `${l.file}:${l.line}`),
      l.guards.map((g) => accessGuard(g, `${key}\n${l.from} ${l.file}:${l.line}`)),
      l.fromKinds.length || isRestricted(l.from)
        ? h('div', { class: 'from-kinds muted' }, '링크를 건 화면에 필요한 것 ', l.fromKinds.length ? l.fromKinds.map(kindChip) : mixedChip())
        : null))));
}

function openSummary(s) {
  const { lines, tips, bare } = openNeeds(s);
  return h('div', { class: 'open-needs' },
    h('h2', {}, '이 화면을 열려면'),
    s.access.restricted ? [...lines.map(needLine), bare ? bareLine(bare) : null] : h('p', { class: 'muted' }, '설정이나 역할 없이 열립니다.'),
    tips.length ? h('ul', { class: 'plain tips muted' }, tips.map((t) => h('li', {}, t))) : null,
    s.access.route.length ? h('div', { class: 'route' }, h('h3', {}, '라우트에서 막는 조건'), s.access.route.map((g) => accessGuard(g, 'route'))) : null);
}

const inScreenGuards = ({ routeGuards, access }) => {
  const blocking = new Set(access.route.map((g) => g.guard));
  return routeGuards.filter((g) => !blocking.has(g));
};

function accessDetails(s) {
  const { links } = s.access;
  const inScreen = inScreenGuards(s);
  return h('div', { class: 'access' },
    h('h2', {}, `들어오는 링크 ${links.length}`),
    links.length ? linkGroups(links).map(linkGroup) : h('p', { class: 'muted' }, '없음'),
    inScreen.length ? h('div', { class: 'in-screen' },
      h('h2', {}, '화면 안 조건 — 화면을 여는 것은 막지 않습니다'),
      inScreen.map((g) => h('div', { class: 'guard' }, guardCode(g, 'in-screen')))) : null);
}

function screenDetails(s) {
  return [
    accessDetails(s),
    h('h2', {}, '소스 위치'),
    h('ul', { class: 'plain' },
      h('li', {}, '라우트 ', h('code', {}, `${state.data.routesFile}:${s.line}`)),
      h('li', {}, '컴포넌트 ', s.componentFile ? h('code', {}, s.componentFile) : h('span', { class: 'muted' }, '찾지 못함'))),
    h('h2', {}, `나가는 링크 ${s.links.length}`),
    s.links.length ? h('ul', { class: 'plain' }, s.links.map((l) => h('li', {},
      h('code', {}, l.to), ' ', h('span', { class: 'muted mono' }, `${l.file}:${l.line}`), h('div', {}, guardList(l))))) : h('p', { class: 'muted' }, '없음'),
    h('h2', {}, `읽는 설정값 ${s.settingReads.length}`),
    s.settingReads.length ? h('ul', { class: 'plain' }, s.settingReads.map((r) => h('li', {},
      h('code', {}, r.key), ' ', h('span', { class: 'muted mono' }, `${r.file}:${r.line}`)))) : h('p', { class: 'muted' }, '없음'),
  ];
}

const shownTarget = () => (state.side === 'stories' ? { story: state.story } : state.target);
const isShown = (target) => {
  const shown = shownTarget();
  return !!shown && keyOf(shown) === keyOf(target);
};

function showSaveError(reason, target) {
  state.error = isShown(target) ? `저장하지 못했습니다: ${reason}` : `「${targetName(target)}」 표시를 저장하지 못했습니다: ${reason}`;
  if (!state.ended) renderRight();
}

async function saveMark(target, draftKey) {
  state.error = null;
  const draft = state[draftKey];
  try {
    const res = await fetch('/api/marks', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ target, status: draft.status, note: draft.note }),
    });
    if (!res.ok) throw new Error(await res.text());
  } catch (err) {
    return showSaveError(err.message, target);
  }
  const owner = draftKey === 'storyDraft' ? { story: state.story } : state.target;
  const untouched = !!owner && keyOf(owner) === keyOf(target) && !unsaved(target, state[draftKey]);
  if (state[draftKey] === draft || untouched) state[draftKey] = null;
  try {
    await load();
  } catch (err) {
    state.error = isShown(target) ? `저장했지만 다시 읽지 못했습니다: ${err.message}` : `「${targetName(target)}」 표시는 저장했지만 다시 읽지 못했습니다: ${err.message}`;
  }
  render();
}

async function postJudgment(judgment) {
  try {
    const res = await fetch('/api/judgments', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(judgment) });
    if (!res.ok) throw new Error(await res.text());
  } catch (err) {
    return `저장하지 못했습니다: ${err.message}`;
  }
  return null;
}

const judgmentsInFlight = new Set();

async function postAndReload(judgment, key) {
  judgmentsInFlight.add(key);
  try {
    const failure = await postJudgment(judgment);
    if (failure) return { failure, reloadError: null };
    try {
      await load();
    } catch (err) {
      return { failure: null, reloadError: `저장했지만 다시 읽지 못했습니다: ${err.message}` };
    }
    return { failure: null, reloadError: null };
  } finally {
    judgmentsInFlight.delete(key);
  }
}

async function saveJudgment(judgment, key) {
  if (judgmentsInFlight.has(key)) return;
  state.judgmentError = null;
  const { failure, reloadError } = await postAndReload(judgment, key);
  if (failure ?? reloadError) state.judgmentError = { key, message: failure ?? reloadError };
  renderKeepingJudgeRowFocus();
}

async function saveBulk(t, bulk, kind, reason) {
  const chosen = pickedPairs(t, bulk);
  bulk.error = null;
  state.bulkBusy = true;
  render();
  const names = (list) => list.map((p) => screenLabel(p.id)).join(', ');
  const saved = [];
  let failure = null;
  for (const p of chosen) {
    failure = await postJudgment({ test: t.ref, node: p.id, kind, reason });
    if (failure) break;
    saved.push(p);
    bulk.picked.delete(p.id);
  }
  let reloadError = null;
  try {
    await load();
  } catch (err) {
    reloadError = `${saved.length ? '저장했지만 ' : ''}다시 읽지 못했습니다: ${err.message}`;
  }
  state.bulkBusy = false;
  bulk.error = failure
    ? [failure, `저장한 짝 ${saved.length}: ${names(saved) || '없음'}. 저장하지 못한 짝 ${chosen.length - saved.length}: ${names(chosen.slice(saved.length))}.`, reloadError].filter(Boolean).join('\n')
    : reloadError;
  return failure ? bulk.error : null;
}

const GAP = 12, COL_GAP = 50, CELL_GAP = 24, CALL_INDENT = 16, GROUP_SPACE = 24, GROUP_HEAD_H = 28;
const STUB = 10, BADGE_GAP = 6, LANE_PAD = 4, LANE_CURVE = 32, UNDER_GAP = 6;

function svg(tag, attrs, ...children) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const [k, v] of Object.entries(attrs ?? {})) el.setAttribute(k, v);
  for (const c of children) el.append(c instanceof Node ? c : String(c));
  return el;
}

const screensIn = (roots) => roots.flatMap((n) => [n, ...screensIn(n.children)]);
function expandAll(roots) {
  for (const n of screensIn(roots)) {
    state.collapsed.delete(n.id);
    if (n.calls.length) state.openCalls.add(n.id);
  }
}
function resetBranch(roots) {
  for (const n of screensIn(roots)) {
    state.collapsed.delete(n.id);
    state.openCalls.delete(n.id);
  }
}
function collapseAll(roots) {
  for (const n of screensIn(roots)) {
    if (n.children.length) state.collapsed.add(n.id);
    state.openCalls.delete(n.id);
  }
}
// 접힌 상자는 하위 상자까지 합친 결과로 색이 정해져 자기 빈틈이 가려지므로, 자기와 하위 어디에도 빈틈이 없는 가지만 접는다.
const isGap = (c) => c.fail > 0 || c.pass + c.fail + c.pending === 0;
function openGapsOnly(roots) {
  const walk = (n) => {
    const below = n.children.map(walk).some(Boolean);
    const callGap = n.calls.some((c) => isGap(c.counts));
    const any = below || callGap || isGap(n.counts);
    if (any) state.collapsed.delete(n.id); else if (n.children.length) state.collapsed.add(n.id);
    if (callGap) state.openCalls.add(n.id); else state.openCalls.delete(n.id);
    return any;
  };
  roots.forEach(walk);
}
const flowTrees = () => {
  const st = pathStoryOf();
  if (st) {
    const { roots, unreached } = storyTrees(state.data.flow, st);
    return [...roots, ...unreached];
  }
  return state.focus ? state.focus.roots : [...state.data.flow.roots, ...state.data.flow.unreached];
};

const pathStories = () => (state.data.stories.stale ? [] : state.data.stories.list);
const pathStoryOf = () => (state.storyPath && pathStories().find((st) => st.id === state.storyPath.id)) ?? null;

function showStoryPath(id) {
  if (!state.storyPath) state.storyPath = { saved: { collapsed: state.collapsed, openCalls: state.openCalls, focus: state.focus } };
  Object.assign(state.storyPath, { id, ring: null });
  Object.assign(state, { collapsed: new Set(), openCalls: new Set(), focus: null });
  focusRequest = null;
}

function leaveStoryPath({ whole = false } = {}) {
  const { saved } = state.storyPath;
  state.storyPath = null;
  Object.assign(state, { collapsed: saved.collapsed, openCalls: saved.openCalls, focus: whole ? null : saved.focus });
}

function storyTrees(flow, st) {
  const parentOf = new Map();
  const walk = (n, parent) => {
    parentOf.set(n.id, parent);
    n.children.forEach((c) => walk(c, n.id));
  };
  [...flow.roots, ...flow.unreached].forEach((r) => walk(r, null));
  const keep = new Set();
  for (const step of st.steps) {
    for (let id = step.onMap ? step.screen : null; id != null && !keep.has(id); id = parentOf.get(id)) keep.add(id);
  }
  const hidden = new Map();
  const prune = (n) => {
    const kids = n.children.filter((c) => keep.has(c.id));
    if (kids.length < n.children.length) hidden.set(n.id, n.children.length - kids.length);
    return { ...n, children: kids.map(prune), whole: n };
  };
  const cut = (trees) => trees.filter((r) => keep.has(r.id)).map(prune);
  return { roots: cut(flow.roots), unreached: cut(flow.unreached), hidden, parentOf };
}

let focusRequest = null;
async function branchRoots(id) {
  const res = await fetch(`/api/flow?from=${encodeURIComponent(id)}`);
  if (!res.ok) throw new Error(await res.text());
  return (await res.json()).roots;
}

async function focusOn(id) {
  focusRequest = id;
  state.flowError = null;
  try {
    const roots = await branchRoots(id);
    if (focusRequest !== id) return;
    if (state.storyPath) leaveStoryPath();
    state.focus = { id, roots };
  } catch (err) {
    if (focusRequest !== id) return;
    state.flowError = `이 가지를 불러오지 못했습니다: ${err.message}`;
  }
  renderFlow();
  if (!state.flowError) document.getElementById('flow').scrollTop = 0;
}

const addCounts = (a, b) => ({ pass: a.pass + b.pass, fail: a.fail + b.fail, pending: a.pending + b.pending });
function subtreeCounts(root) {
  const calls = new Map();
  let total = { pass: 0, fail: 0, pending: 0 };
  let imported = 0;
  let passed = 0;
  const walk = (n) => {
    total = addCounts(total, n.counts);
    imported += n.imported;
    passed += n.passed;
    for (const c of n.calls) calls.set(c.id, c.counts);
    n.children.forEach(walk);
  };
  walk(root);
  for (const c of calls.values()) total = addCounts(total, c);
  return { ...total, imported, passed };
}
const NO_TESTS = '테스트 없음';
const statusOf = (c) => (c.fail ? 's-fail' : c.pending ? 's-pending' : c.pass ? 's-pass' : 's-none');
const countText = (c) => (c.pass + c.fail + c.pending
  ? [c.pass ? h('span', { class: 'ok' }, `✓${c.pass} `) : null, c.fail ? h('span', { class: 'ng' }, `✕${c.fail} `) : null, c.pending ? h('span', { class: 'wait' }, `○${c.pending}`) : null]
  : NO_TESTS);
const guardText = (alternatives) => alternatives.map((alt) => alt.map((g) => g.guard).join(' & ')).join(' 또는 ');

// 전체 경로는 상자의 title 에 있다.
const needText = (n, { short = false } = {}) => {
  const path = (short ? n.path.slice(-2) : n.path).join('.');
  if (n.need === 'includes') return short ? `${quoted(n.value)} (${path} 에)` : `${path} 에 ${quoted(n.value)}`;
  if (n.need === 'equals') return short ? `${quoted(n.value)} (${path})` : `${path} = ${quoted(n.value)}`;
  return `${path} ${{ on: '켬', off: '끔', present: '있음' }[n.need]}`;
};

const withMore = (items) => (items.length > 1 ? `${items[0]} 외 ${items.length - 1}` : items[0]);
const overlap = (lists) => lists.reduce((left, values) => left.filter((v) => values.includes(v)));
const unreadText = (u) => `${u.guard} (${u.reason})`;
const unreadRolesTip = (guards) => `읽지 못한 역할 조건: ${guards.join(', ')}`;
const unsettledTip = (text) => `정하지 못한 설정 조건: ${text}`;

// bare 는 문구 한 줄로 적지 못한 종류(「설정 필요」, 「링크마다 다름」)다.
function openNeeds({ access }) {
  const { roleValues, unreadableRoleGuards = [], settings, kinds = [], restricted = false } = access;
  const lines = [];
  const tips = [];
  if (roleValues !== undefined) {
    const unread = unreadableRoleGuards.length ? `미확인 ${unreadableRoleGuards.length}` : null;
    if (roleValues) {
      lines.push({ kind: 'role', text: `역할 ${withMore(roleValues)}`, flag: unread });
      tips.push(`필요한 역할: ${roleValues.join(', ')}`);
    } else {
      lines.push({ kind: 'role', text: '역할 미확인' });
      tips.push('필요한 역할: 미확인');
    }
    if (unread) tips.push(unreadRolesTip(unreadableRoleGuards));
  }
  if (settings) {
    const hasValue = (x) => x.need === 'includes' || x.need === 'equals';
    const needs = [...new Map(settings.flatMap((x) => x.needs).map((x) => [needText(x), x]))]
      .sort(([, a], [, b]) => hasValue(b) - hasValue(a));
    const unread = [...new Set(settings.flatMap((x) => x.unreadable).map(unreadText))];
    const flag = unread.length ? `미확인 ${unread.length}` : null;
    if (needs.length || unread.length) lines.push({ kind: 'setting', text: needs.length ? `설정 ${withMore(needs.map(([, x]) => needText(x, { short: true })))}` : '설정 미확인', flag });
    tips.push(...needs.map(([full]) => `필요한 설정: ${full}`));
    tips.push(...unread.map(unsettledTip));
  }
  const bareKinds = kinds.filter((k) => !lines.some((l) => l.kind === k));
  const bare = bareKinds.length ? `${bareKinds.map((k) => KIND_LABEL[k]).join('·')} 필요` : !kinds.length && restricted ? MIXED_KINDS : null;
  return { lines, tips, bare };
}

// 한 링크나 라우트의 조건은 모두 맞아야 하므로 역할 값은 겹치는 것만 남는다. 겹치는 값이 없으면 빈 목록이다.
function guardsAccess(guards) {
  const roleGuards = guards.filter((g) => g.kinds.includes('role'));
  const readable = roleGuards.filter((g) => g.roles);
  const settingGuards = guards.filter((g) => g.kinds.includes('setting'));
  return {
    restricted: guards.length > 0,
    kinds: ['setting', 'role'].filter((k) => guards.some((g) => g.kinds.includes(k))),
    ...(roleGuards.length ? { roleValues: readable.length ? overlap(readable.map((g) => g.roles)) : null, unreadableRoleGuards: roleGuards.filter((g) => !g.roles).map((g) => g.guard) } : {}),
    ...(settingGuards.length ? { settings: [{ needs: settingGuards.flatMap((g) => g.settings ?? []), unreadable: settingGuards.filter((g) => !g.settings).map((g) => ({ guard: g.guard, reason: g.settingsReason })) }] } : {}),
  };
}

// 화면 칸은 맵처럼 겹치는 역할이 없는 링크도 「역할 미확인」으로 적는다.
function linkAccess(guards) {
  const access = guardsAccess(guards);
  return access.roleValues?.length === 0 ? { ...access, roleValues: null } : access;
}

// 링크의 조건 목록에는 핸들러를 쓰는 곳마다의 조건(via)이 한데 섞여 와서, 어느 곳의 조건인지 알 수 없다.
// 링크 자신의 조건이 없고 물려받은 조건이 하나뿐일 때만 핸들러를 쓰는 곳이 하나여서 그 조건이 꼭 필요하다. 그 밖의 물려받은 조건은 정할 수 없다.
function heldGuards(guards) {
  const own = guards.filter((g) => !g.via);
  const inherited = guards.filter((g) => g.via);
  return !own.length && inherited.length === 1 ? { sure: inherited, undecided: [] } : { sure: own, undecided: inherited };
}

// roles 는 역할을 묻지 않으면 undefined, 묻지만 값을 하나도 읽지 못했으면 null 이다.
function wayNeeds(guards) {
  const { sure, undecided } = heldGuards(guards);
  const access = guardsAccess(sure);
  const [setting = { needs: [], unreadable: [] }] = access.settings ?? [];
  const roleDoubt = undecided.some((g) => g.kinds.includes('role'));
  return {
    roles: access.roleValues === undefined && roleDoubt ? null : access.roleValues,
    unreadRoles: access.unreadableRoleGuards ?? [],
    roleDoubt,
    settings: setting.needs,
    unsettled: setting.unreadable.map(unreadText),
    undecided,
  };
}

// 같은 줄에서 같은 화면으로 가는 링크가 여럿이면 맵에 적힌 순서대로 짝짓는다.
function wayGuards(r) {
  const rows = screenOf(r.to).access.links.filter((l) => l.from === r.from);
  const taken = new Map();
  return r.ways.map((w) => {
    const place = `${w.file}:${w.line}`;
    const nth = taken.get(place) ?? 0;
    taken.set(place, nth + 1);
    return rows.filter((l) => l.file === w.file && l.line === w.line)[nth]?.guards ?? [];
  });
}

// 사용자의 역할은 하나뿐이라 어느 길이든 허락하면 지나가므로 역할은 길마다 허락하는 값을 합친다.
// 합친 값은 모든 길의 역할을 읽었을 때만 지나는 역할을 빠짐없이 담고(bound), 그중 역할을 다 읽은 길이 허락하는 값만 확실하다.
// 확실하지 않은 값이 모든 길에 걸린 읽지 못한 역할 조건 때문이 아니면 partial 이다.
function wayRoles(ways) {
  if (ways.some((w) => w.roles === undefined)) return { roles: undefined, unreadRoles: [], bound: false, partial: false };
  const read = ways.filter((w) => w.roles);
  const unreadRoles = ways[0].unreadRoles.filter((u) => ways.every((w) => w.unreadRoles.includes(u)));
  const sure = new Set(read.filter((w) => !w.unreadRoles.length && !w.roleDoubt).flatMap((w) => w.roles));
  const bound = read.length === ways.length;
  const exact = bound && read.every((w) => w.roles.every((v) => sure.has(v)));
  const explained = bound && ways.every((w) => !w.roleDoubt && w.unreadRoles.every((u) => unreadRoles.includes(u)));
  return { roles: read.length ? [...new Set(read.flatMap((w) => w.roles))].sort() : null, unreadRoles, bound, partial: read.length > 0 && !exact && !explained };
}

const settingKey = (x) => `${x.root}\n${needText(x)}`;
const roleKey = (roles) => (roles === undefined ? '' : roles === null ? '?' : `=${[...roles].sort().join(',')}`);
const restKey = (n) => [...new Set([...n.settings.map(settingKey), ...n.unsettled])].sort().join('\n');
const commonSettings = (ways) => ({
  settings: ways[0].settings.filter((x) => ways.every((w) => w.settings.some((y) => settingKey(y) === settingKey(x)))),
  unsettled: ways[0].unsettled.filter((u) => ways.every((w) => w.unsettled.includes(u))),
});
const NO_NEEDS = { roles: undefined, unreadRoles: [], bound: false, partial: false, settings: [], unsettled: [], undecided: [], bare: null };

// 링크 단계는 링크 하나만 지나면 되므로 모든 링크가 함께 요구하는 것만 단계의 요구로 남긴다.
// 함께 요구하는 것만으로 지나가는 링크가 없고 설정 요구가 링크마다 다르면 나머지는 「링크마다 다름」이다.
// 정할 수 없는 물려받은 조건이나 읽지 못한 역할 조건이 걸린 링크는 더 요구할 수 있어, 함께 요구하는 것만으로 지나간다는 근거가 되지 못한다.
function waysNeeds(ways) {
  if (ways.some((w) => w.roles === undefined && !restKey(w) && !w.undecided.length)) return NO_NEEDS;
  const common = { ...wayRoles(ways), ...commonSettings(ways), undecided: ways.flatMap((w) => w.undecided) };
  const sameRest = (w) => restKey(w) === restKey(common);
  const exact = ways.every(sameRest)
    || ways.some((w) => sameRest(w) && !w.undecided.length && !w.unreadRoles.length && roleKey(w.roles) === roleKey(common.roles));
  return { ...common, bare: exact ? null : MIXED_KINDS };
}

// 맵은 링크마다의 설정 요구를 들어오는 링크와 같은 순서로 적되, 설정 요구가 없는 링크는 건너뛴다.
// 링크 자신에 설정 조건이 없으면 그 요구는 링크를 건 화면에서 물려받은 것이다.
function inheritedSources(access) {
  const sources = (access.settings ?? []).filter((x) => x.from !== 'route');
  let next = 0;
  return access.links.map((row) => {
    const source = sources[next];
    const own = row.guards.some((g) => g.kinds.includes('setting'));
    if (!source || source.from !== row.from || source.file !== row.file || source.line !== row.line || !(own || source.inherited)) return null;
    next += 1;
    return own ? null : source;
  });
}

// 역할은 맵이 같은 규칙으로 정한 값을 쓴다. 맵은 물려받은 조건을 모두 세므로, 정할 수 없는 물려받은 역할 조건이 있으면 그 값은 지나는 역할을 빠짐없이 담지 못한다.
function startNeeds(r) {
  const { id, access } = screenOf(r.screen);
  const route = wayNeeds(access.route);
  const blocked = !state.data.map.entries.some((e) => e.screen === id) && access.links.length > 0
    && access.links.every((l) => l.guards.length || isRestricted(l.from));
  const inherited = inheritedSources(access);
  const ways = blocked ? access.links.map((row, i) => {
    const way = wayNeeds(row.guards);
    return inherited[i] ? { ...way, settings: inherited[i].needs, unsettled: inherited[i].unreadable.map(unreadText) } : way;
  }) : [];
  const links = ways.length ? commonSettings(ways) : { settings: [], unsettled: [] };
  const undecided = ways.flatMap((w) => w.undecided);
  const roleDoubt = ways.some((w) => w.roleDoubt);
  const settings = [...new Map([...route.settings, ...links.settings].map((x) => [settingKey(x), x])).values()];
  const unsettled = [...new Set([...route.unsettled, ...links.unsettled])];
  const shown = {
    setting: settings.length || unsettled.length || undecided.some((g) => g.kinds.includes('setting')),
    role: access.roleValues !== undefined || roleDoubt,
  };
  const missing = access.kinds.filter((k) => !shown[k]);
  const exact = access.kinds.length && ways.every((w) => restKey(w) === restKey(links));
  return {
    roles: access.roleValues,
    unreadRoles: access.unreadableRoleGuards ?? [],
    bound: Boolean(access.roleValues) && !roleDoubt,
    partial: Boolean(access.roleValues) && roleDoubt,
    settings,
    unsettled,
    undecided,
    bare: !exact ? MIXED_KINDS : missing.length ? `${missing.map((k) => KIND_LABEL[k]).join('·')} 필요` : null,
  };
}

function stepNeeds(r) {
  if (r.kind === 'start') return startNeeds(r);
  return waysNeeds(r.kind === 'route' ? [wayNeeds(r.guards)] : wayGuards(r).map(wayNeeds));
}

// 같음은 느슨한 비교(==)로 읽혔을 수도 있어 종류가 같은 두 값만 어긋난다고 보고, 켬과 거짓인 값의 같음도("0" == 0) 어긋난다고 보지 않는다.
const offClash = (off, x) => off.need === 'off' && (['on', 'present', 'includes'].includes(x.need) || (x.need === 'equals' && Boolean(x.value)));
const settingClash = (a, b) => offClash(a, b) || offClash(b, a)
  || (a.need === 'equals' && b.need === 'equals' && typeof a.value === typeof b.value && a.value !== b.value);

// 지나는 역할을 빠짐없이 담은 단계가 있으면 그 단계들로만 겹치는 값을 구해야, 겹치는 값이 없을 때 지나는 역할이 없다고 말할 수 있다.
function storyNeeds(reach) {
  const steps = reach.map((r) => ({ label: stepLabel(r), ...stepNeeds(r) }));
  const read = steps.filter((s) => s.roles);
  const bound = read.filter((s) => s.bound);
  const roles = (bound.length ? bound : read).map((s) => s.roles);
  const allowed = roles.length ? overlap(roles) : [];
  const unreadRoles = [...new Set(steps.flatMap((s) => s.unreadRoles))];
  const roleNotes = [
    ...steps.filter((s) => s.roles === null && !s.unreadRoles.length).map((s) => `역할 미확인 (${s.label})`),
    ...steps.filter((s) => s.partial).map((s) => `역할 일부만 읽음 (${s.label})`),
  ];
  const settings = [...new Map(steps.flatMap((s) => s.settings).map((x) => [settingKey(x), x])).values()];
  const pathKey = (x) => JSON.stringify([x.root, x.path]);
  const clashing = settings.filter((x) => settings.some((y) => pathKey(x) === pathKey(y) && settingClash(x, y)));
  const handlers = new Map();
  for (const g of steps.flatMap((s) => s.undecided)) handlers.set(g.via, [...new Set([...(handlers.get(g.via) ?? []), g.guard])]);
  return {
    roles: allowed.length || bound.length ? allowed : undefined,
    roleSteps: bound,
    roleFlag: unreadRoles.length + roleNotes.length,
    settings: settings.filter((x) => !clashing.includes(x)),
    clashes: [...new Set(clashing.map(pathKey))].map((key) => clashing.filter((x) => pathKey(x) === key)),
    withRoot: new Set(settings.map((x) => x.root)).size > 1,
    bare: steps.filter((s) => s.bare).map((s) => `${s.label} ${s.bare}`),
    leftOut: [
      ...roleNotes,
      ...(unreadRoles.length ? [unreadRolesTip(unreadRoles)] : []),
      ...[...new Set(steps.flatMap((s) => s.unsettled))].map(unsettledTip),
      ...[...handlers].map(([via, guards]) => `${via} 를 쓰는 곳에 따라 다른 조건: ${guards.join(', ')}`),
    ],
  };
}

const rolesText = (roles) => (roles.length ? `역할 ${roles.join(' 또는 ')}` : '지나는 역할 없음');

function storySummary(reach) {
  const n = storyNeeds(reach);
  const settingText = (x) => (n.withRoot ? `${x.root}.${needText(x)}` : needText(x));
  const lines = [
    n.roles === undefined ? null
      : n.roles.length ? needLine({ text: rolesText(n.roles), flag: n.roleFlag ? `미확인 ${n.roleFlag}` : null })
        : [bareLine('모든 단계를 지나는 역할 없음'), h('ul', { class: 'plain step-roles' }, n.roleSteps.map((s) => h('li', {}, `${s.label}: ${rolesText(s.roles)}`)))],
    ...n.settings.map((x) => needLine({ text: `설정 ${settingText(x)}` })),
    ...n.clashes.map((same) => bareLine(`서로 어긋나는 설정: ${same.map(settingText).join(' / ')}`)),
    ...n.bare.map(bareLine),
  ].flat().filter(Boolean);
  return h('div', { class: 'reach-summary' },
    lines,
    !lines.length && !n.leftOut.length ? h('p', { class: 'muted none' }, '설정이나 역할로 막는 조건 없음') : null,
    n.leftOut.length ? h('div', { class: 'left-out' }, h('div', {}, '요약에 넣지 못한 조건'), h('ul', { class: 'plain' }, n.leftOut.map((t) => h('li', {}, t)))) : null);
}

const needLine = (l) => h('div', { class: 'need' }, h('span', { class: 'text' }, l.text), l.flag ? h('span', { class: 'flag' }, l.flag) : null);
const bareLine = (text) => h('div', { class: 'need bare' }, text);

const callKey = (screen, call) => `${screen.id}>${call.id}`;
const isFolded = (node, collapsed) => node.kind === 'screen' && collapsed.has(node.id) && node.children.length > 0;
function shownKids(node, collapsed, openCalls) {
  if (node.kind !== 'screen' || isFolded(node, collapsed)) return [];
  return [
    ...node.children.map((n) => ({ key: n.id, node: n })),
    ...(openCalls.has(node.id) ? node.calls.map((c) => ({ key: callKey(node, c), node: c })) : []),
  ];
}

function flowBoxes(roots, { collapsed = [], openCalls = [] }) {
  const folded = new Set(collapsed);
  const open = new Set(openCalls);
  const out = [];
  const walk = (key, node, parent) => {
    out.push({ key, node, parent, collapsed: isFolded(node, folded) });
    for (const k of shownKids(node, folded, open)) walk(k.key, k.node, key);
  };
  for (const r of roots) walk(r.id, r, null);
  return out;
}

// 칸 폭은 모은 화면 상자만으로 정하므로 API 호출을 펼쳐도 칸이 움직이지 않는다. 높이는 이 결과로 폭이 정해진 뒤에 재므로 sizes[key].height 는 아직 없어도 된다.
const cellsPerRow = (count, cellW, width) => Math.max(1, Math.min(count, Math.floor((width + CELL_GAP) / (cellW + CELL_GAP))));

// marks 는 상자 곁에 붙일 스토리 단계 표시다.
function flowColumns(roots, sizes, { collapsed = [], openCalls = [], group = false, width = 0, marks = [] } = {}) {
  const folded = new Set(collapsed);
  const open = new Set(openCalls);
  const gathered = group ? roots.filter((r) => !r.children.length) : [];
  const trees = group ? roots.filter((r) => r.children.length) : roots;
  const depths = new Map();
  const walk = (key, node, depth) => {
    depths.set(key, depth);
    for (const k of shownKids(node, folded, open)) walk(k.key, k.node, depth + 1);
  };
  for (const r of trees) walk(r.id, r, 0);
  const colWidths = [];
  for (const [key, d] of depths) colWidths[d] = Math.max(colWidths[d] ?? 0, sizes[key].width);
  const exitW = colWidths.map(() => 0);
  const entryW = colWidths.map(() => 0);
  for (const m of marks) {
    const d = depths.get(m.key);
    if (d === undefined || m.kind === 'hidden') continue;
    const lane = m.side === 'exit' ? exitW : entryW;
    lane[d] = Math.max(lane[d], laneWidth(m));
  }
  const xs = colWidths.map(() => entryW[0] ?? 0);
  for (let d = 1; d < colWidths.length; d += 1) xs[d] = xs[d - 1] + colWidths[d - 1] + Math.max(COL_GAP, exitW[d - 1] + LANE_CURVE + entryW[d]);
  const cellW = Math.max(0, ...gathered.map((r) => sizes[r.id].width));
  const per = cellsPerRow(gathered.length, cellW, width);
  const sized = {};
  for (const [key, d] of depths) sized[key] = colWidths[d];
  const grid = gathered.map((r) => ({ screen: r, calls: shownKids(r, folded, open) }));
  for (const { screen, calls } of grid) {
    sized[screen.id] = cellW;
    for (const k of calls) sized[k.key] = cellW - CALL_INDENT;
  }
  return {
    widths: sized,
    grouped: new Set(grid.flatMap(({ screen, calls }) => [screen.id, ...calls.map((k) => k.key)])),
    trees, depths, xs, grid, cellW, per, exitW, entryW,
    span: colWidths.length ? xs[colWidths.length - 1] + colWidths[colWidths.length - 1] + exitW[colWidths.length - 1] : 0,
  };
}

// 칸 사이의 왼쪽 가장자리는 나가는 표시가, 오른쪽 가장자리는 들어오는 표시가 쓰고, 선은 그 가운데에서만 굽는다.
const laneWidth = (m) => m.width + (m.kind === 'badge' ? BADGE_GAP : STUB) + LANE_PAD;

function laneMarks(placed, edges, cols, marks) {
  const byKey = new Map(placed.map((b) => [b.key, b]));
  const lanes = new Map();
  const lane = (d, side) => {
    const k = `${d} ${side}`;
    if (!lanes.has(k)) lanes.set(k, { lines: [], taken: [] });
    return lanes.get(k);
  };
  for (const e of edges) {
    if (e.grouped) continue;
    lane(cols.depths.get(e.from), 'exit').lines.push(e.y1);
    lane(cols.depths.get(e.to), 'entry').lines.push(e.y2);
  }
  const clear = (l, y, height) => !l.taken.some(([top, bottom]) => y < bottom + 3 && y + height > top - 3)
    && !l.lines.some((line) => line > y - 5 && line < y + height + 5);
  // 번호는 상자 위쪽 모서리 곁에 있어야 어느 상자의 것인지 읽히므로 위로도 조금 찾아본다.
  const BADGE_TRIES = [0, -2, -4, -6, -8, -10];
  const KIND_ORDER = { tag: 0, badge: 1, chip: 2 };
  const order = marks.map((m, i) => i).filter((i) => marks[i].kind !== 'hidden')
    .sort((a, b) => KIND_ORDER[marks[a].kind] - KIND_ORDER[marks[b].kind] || byKey.get(marks[a].key).y - byKey.get(marks[b].key).y || a - b);
  const spots = marks.map((m) => {
    const b = byKey.get(m.key);
    return m.kind === 'hidden' ? { x: b.x + 8, y: b.y + b.height + UNDER_GAP } : null;
  });
  for (const i of order) {
    const m = marks[i];
    const b = byKey.get(m.key);
    const l = lane(cols.depths.get(m.key), m.side);
    let y = m.kind === 'tag' ? b.y + b.height / 2 - m.height / 2 : b.y + 2;
    if (m.kind !== 'tag') {
      const start = y;
      const tries = m.kind === 'badge' ? BADGE_TRIES : [];
      for (let k = 0; ; k += 1) {
        y = k < tries.length ? start + tries[k] : start + 2 * (k - tries.length + 1);
        if (clear(l, y, m.height)) break;
      }
    }
    l.taken.push([y, y + m.height]);
    spots[i] = { x: m.side === 'exit' ? b.x + b.width + STUB : b.x - m.width - (m.kind === 'badge' ? BADGE_GAP : STUB), y };
  }
  return spots;
}

// sizes[key] 는 { width: 본래 폭, height: flowColumns 가 정한 폭으로 그려 잰 높이 } 이다. cols 는 같은 sizes 와 view 로 이미 구한 flowColumns 결과다.
// 모은 상자의 API 호출은 칸이 넓어지지 않도록 오른쪽이 아니라 상자 아래에 들여 쌓는다.
function layoutFlow(roots, sizes, view = {}, cols = flowColumns(roots, sizes, view)) {
  const { collapsed = [], openCalls = [], marks } = view;
  const folded = new Set(collapsed);
  const open = new Set(openCalls);
  const middle = (b) => b.y + b.height / 2;
  const below = new Map((marks ?? []).filter((m) => m.kind === 'hidden').map((m) => [m.key, UNDER_GAP + m.height]));
  const placed = [];
  let cursor = 0;
  const lower = (from, by) => {
    for (const b of placed.slice(from)) b.y += by;
    cursor += by;
  };
  const place = (key, node, parent) => {
    const { height } = sizes[key];
    const top = cursor;
    const from = placed.length;
    const kids = shownKids(node, folded, open).map((k) => place(k.key, k.node, key));
    let y = top;
    if (kids.length) {
      y = (middle(kids[0]) + middle(kids[kids.length - 1])) / 2 - height / 2;
      if (y < top) {
        lower(from, top - y);
        y = top;
      }
    }
    const self = { key, node, parent, x: cols.xs[cols.depths.get(key)], y, width: cols.widths[key], height, grouped: false };
    placed.push(self);
    cursor = Math.max(cursor, y + height + (below.get(key) ?? 0) + GAP);
    return self;
  };
  for (const r of cols.trees) place(r.id, r, null);
  let height = cursor;
  let span = cols.span;
  let heading = null;
  if (cols.grid.length) {
    const { grid, cellW, per } = cols;
    const top = cols.trees.length ? cursor + GROUP_SPACE : 0;
    let rowY = top + GROUP_HEAD_H;
    for (let i = 0; i < grid.length; i += per) {
      let rowBottom = rowY;
      grid.slice(i, i + per).forEach(({ screen, calls }, j) => {
        const x = j * (cellW + CELL_GAP);
        let y = rowY + sizes[screen.id].height;
        placed.push({ key: screen.id, node: screen, parent: null, x, y: rowY, width: cellW, height: sizes[screen.id].height, grouped: true });
        for (const k of calls) {
          placed.push({ key: k.key, node: k.node, parent: screen.id, x: x + CALL_INDENT, y: y + GAP, width: cols.widths[k.key], height: sizes[k.key].height, grouped: true });
          y += GAP + sizes[k.key].height;
        }
        rowBottom = Math.max(rowBottom, y);
      });
      rowY = rowBottom + GAP;
    }
    height = rowY;
    span = Math.max(span, per * cellW + (per - 1) * CELL_GAP);
    heading = { x: 0, y: top, height: GROUP_HEAD_H, count: grid.length };
  }
  const byKey = new Map(placed.map((b) => [b.key, b]));
  const edges = placed.filter((b) => b.parent !== null).map((b) => {
    const from = byKey.get(b.parent);
    const guards = b.node.kind === 'screen' ? b.node.guards : [];
    return b.grouped
      ? { from: b.parent, to: b.key, x1: from.x + CALL_INDENT / 2, y1: from.y + from.height, x2: b.x, y2: middle(b), guards, grouped: true }
      : { from: b.parent, to: b.key, x1: from.x + from.width, y1: middle(from), x2: b.x, y2: middle(b), guards, grouped: false };
  });
  if (marks) {
    for (const e of edges) {
      if (e.grouped) continue;
      e.ex = e.x1 + cols.exitW[cols.depths.get(e.from)];
      e.nx = e.x2 - cols.entryW[cols.depths.get(e.to)];
    }
  }
  const spots = marks && laneMarks(placed, edges, cols, marks);
  const lift = spots ? Math.max(0, ...spots.map((s) => -s.y)) : 0;
  if (lift) {
    for (const b of placed) b.y += lift;
    for (const e of edges) Object.assign(e, { y1: e.y1 + lift, y2: e.y2 + lift });
    for (const s of spots) s.y += lift;
    if (heading) heading.y += lift;
    height += lift;
  }
  marks?.forEach((m, i) => {
    height = Math.max(height, spots[i].y + m.height + GAP);
    span = Math.max(span, spots[i].x + m.width);
  });
  return {
    boxes: placed.map((b) => ({ key: b.key, x: b.x, y: b.y, width: b.width, height: b.height, grouped: b.grouped })),
    edges,
    group: heading,
    width: span,
    height,
    ...(marks && { marks: spots }),
  };
}

// 주소는 「/」 앞에서만 줄이 바뀌도록 조각마다 묶는다.
const pathText = (path) => path.split(/(?=\/)/).flatMap((seg, i) => [i ? h('wbr') : null, h('span', { class: 'seg' }, seg)]);

function screenBox(b) {
  const n = b.node;
  const hasKids = n.children.length > 0;
  const callsOpen = state.openCalls.has(n.id);
  const counts = b.collapsed ? subtreeCounts(n.whole ?? n) : n.counts;
  const imported = b.collapsed ? counts.imported : n.imported;
  const passed = b.collapsed ? counts.passed : n.passed;
  const showCalls = n.calls.length > 0 && !b.collapsed;
  const guardLabel = n.guards.length ? guardText(n.guards) : null;
  const l3text = [guardLabel ? `조건 ${guardLabel}` : null, ...n.jumps.map((j) => `→ ${j.label}`)].filter(Boolean).join(' · ');
  const needs = openNeeds({ access: { ...n.access, kinds: n.kinds, restricted: n.restricted } });
  const badges = [n.dead ? '죽은 화면' : null, needs.bare].filter(Boolean).join(' · ');
  return h('div', {
    class: `box screen ${statusOf(counts)}`,
    title: [n.id, guardLabel ? `이 링크의 조건: ${guardLabel}` : '', ...needs.tips, ...n.jumps.map((j) => `→ ${j.label}${j.guards.length ? ` (${guardText(j.guards)})` : ''}`), '누르면 목록에서 이 화면을 엽니다'].filter(Boolean).join('\n'),
    onclick: () => { state.view = 'list'; openScreen(n.id); },
  },
    h('div', { class: 'l1' },
      h('span', { class: 'text' }, pathText(n.label), ' ', h('span', { class: 'muted component' }, n.component))),
    hasKids || n.calls.length ? h('div', { class: 'acts' },
      hasKids ? h('button', { class: 'toggle', title: b.collapsed ? '이 화면에 딸린 것을 접기 전 모습대로 다시 보입니다' : '이 화면에 딸린 것을 숨깁니다', onclick: (e) => {
        e.stopPropagation();
        if (state.collapsed.has(n.id)) state.collapsed.delete(n.id); else state.collapsed.add(n.id);
        renderFlow();
      } }, b.collapsed ? '펼치기' : '접기') : null,
      h('button', { class: 'toggle', title: '이 가지 전부 펼치기(화면과 API 호출)', onclick: (e) => {
        e.stopPropagation();
        expandAll([n]);
        renderFlow();
      } }, '전부 펼치기'),
      h('button', { class: 'toggle', title: '이 가지의 화면은 모두 펼치고 API 호출은 접기', onclick: (e) => {
        e.stopPropagation();
        resetBranch([n]);
        renderFlow();
      } }, '처음으로'),
      hasKids && state.focus?.id !== n.id ? h('button', { class: 'toggle', title: '이 가지만 보기', onclick: (e) => {
        e.stopPropagation();
        focusOn(n.id);
      } }, '이 가지만') : null) : null,
    h('div', { class: 'l2' }, countText(counts), b.collapsed ? h('span', {}, ' (하위 합)') : null, imported ? ` · 불러옴 ${imported}` : '', passed ? ` · 지나감 ${passed}` : '', badges ? ` · ${badges}` : ''),
    needs.lines.map(needLine),
    l3text || showCalls
      ? h('div', { class: 'l3' },
        h('span', { class: 'text' }, l3text),
        showCalls ? h('button', { class: 'calls', title: callsOpen ? 'API 호출 접기' : 'API 호출 펼치기', onclick: (e) => {
          e.stopPropagation();
          if (callsOpen) state.openCalls.delete(n.id); else state.openCalls.add(n.id);
          renderFlow();
        } }, `API ${n.calls.length} ${callsOpen ? '▾' : '▸'}`) : null)
      : null);
}

function callBox(b) {
  const c = b.node;
  return h('div', { class: `box call ${statusOf(c.counts)}`, title: c.id },
    h('div', { class: 'l1 mono' }, pathText(c.label)),
    h('div', { class: 'l2' }, countText(c.counts), c.passed ? ` · 호출함 ${c.passed}` : '', ` · ${serverText(c.server)}`));
}

const PATH_TAG = { conditioned: LINK_VERDICT.conditioned, broken: LINK_VERDICT.broken, unknown: LINK_VERDICT.unknown, 'off-map': '맵에 없는 화면' };
const hopTitle = (l, i) => [`단계 ${i + 1} → ${i + 2}`, PATH_TAG[l.verdict] ?? LINK_VERDICT[l.verdict], LINK_VERDICT_TITLE[l.verdict]].filter(Boolean).join(' · ');
const pathChip = (tag, attrs, verdict, end, ...text) => h(tag, { ...attrs, class: `story-chip ${end} l-${verdict}` }, verdict === 'broken' ? h('b', {}, '✕') : null, ...text);

function storyMarks({ st, hidden, ring }, boxes, els) {
  const parentOf = new Map(boxes.map((b) => [b.key, b.parent]));
  const marks = [];
  const edges = new Map();
  const mark = (key, side, kind, el) => {
    el.classList.add('mark');
    el.dataset.at = key;
    el.style.visibility = 'hidden';
    marks.push({ key, side, kind, el });
  };
  const numbers = new Map();
  st.steps.forEach((s, i) => {
    if (s.onMap && els.has(s.screen)) numbers.set(s.screen, [...(numbers.get(s.screen) ?? []), i + 1]);
  });
  for (const [id, nums] of numbers) {
    els.get(id).classList.add('on-story');
    if (ring !== null && st.steps[ring].screen === id) els.get(id).classList.add('story-ring');
    mark(id, 'entry', 'badge', h('span', { class: 'story-badge' }, nums.join('·')));
  }
  const hover = (i, on) => () => {
    for (const c of document.querySelectorAll(`#flow .story-chip[data-hop="${i}"]`)) c.classList.toggle('hovered', on);
  };
  st.links.forEach((l, i) => {
    const from = st.steps[i].onMap && els.has(l.from) ? l.from : null;
    const to = st.steps[i + 1].onMap && els.has(l.to) ? l.to : null;
    const tag = PATH_TAG[l.verdict];
    if (from && to && parentOf.get(to) === from) {
      const key = `${from}\n${to}`;
      if (!edges.has(key) && tag) mark(to, 'entry', 'tag', h('span', { class: `story-tag l-${l.verdict}`, title: hopTitle(l, i) }, tag));
      edges.set(key, l.verdict);
      return;
    }
    const chip = (end, other, ...text) => pathChip('button', {
      type: 'button', title: hopTitle(l, i), 'data-hop': i,
      onclick: () => ringStep(other), onmouseenter: hover(i, true), onmouseleave: hover(i, false), onfocus: hover(i, true), onblur: hover(i, false),
    }, l.verdict, end, ...text);
    if (from) mark(from, 'exit', 'chip', chip('exit', i + 1, `→ ${i + 2}`, tag ? h('small', {}, tag) : null));
    if (to) mark(to, 'entry', 'chip', chip('entry', i, `${i + 1} →`));
  });
  for (const [id, n] of hidden) if (els.has(id)) mark(id, 'exit', 'hidden', h('span', { class: 'story-hidden' }, `다른 화면 ${n} 숨김`));
  return { marks, edges };
}

function pathLegend() {
  const line = (verdict) => svg('svg', { viewBox: '0 0 40 8', 'aria-hidden': 'true' }, svg('path', { class: `story-edge l-${verdict}`, d: 'M2 4H38' }));
  const row = (sample, name) => h('li', {}, h('span', { class: 'sample', 'aria-hidden': 'true' }, sample), h('span', {}, name));
  return [
    row(h('span', { class: 'story-badge' }, '3'), '단계 번호'),
    row(line('open'), `${LINK_VERDICT.open} · ${LINK_VERDICT.configured}`),
    row([line('conditioned'), h('span', { class: 'story-tag l-conditioned' }, PATH_TAG.conditioned)], PATH_TAG.conditioned),
    row(pathChip('span', {}, 'open', 'exit', '→ 5'), '5단계로 감'),
    row(pathChip('span', {}, 'open', 'entry', '4 →'), '4단계에서 옴'),
    row(pathChip('span', {}, 'broken', 'exit', '→ 6', h('small', {}, PATH_TAG.broken)), PATH_TAG.broken),
    row(pathChip('span', {}, 'off-map', 'exit', '→ 8', h('small', {}, PATH_TAG['off-map'])), PATH_TAG['off-map']),
    row(pathChip('span', {}, 'unknown', 'exit', '→ 3', h('small', {}, PATH_TAG.unknown)), PATH_TAG.unknown),
    row(h('span', { class: 'story-hidden' }, '다른 화면 2 숨김'), '경로 밖 화면'),
  ];
}

function storyPicker(st) {
  const list = pathStories();
  if (!list.length) return null;
  return h('span', { class: 'story-pick' },
    h('label', {}, '스토리 ', h('select', { onchange: (e) => pickStory(e.target.value) },
      h('option', { value: '', selected: !st }, '고르기'),
      list.map((s) => h('option', { value: s.id, selected: s.id === st?.id }, s.name)))),
    st ? h('button', { class: 'path-off', onclick: () => pickStory('') }, '경로 끄기') : null,
    legendInfo('path', '스토리 경로 읽는 법', pathLegend()));
}

function storyStrip(st, drawn) {
  const { ring } = state.storyPath;
  return h('ol', { class: 'story-strip', 'aria-label': '스토리 단계' }, st.steps.flatMap((s, i) => {
    const l = st.links[i - 1];
    return [
      l ? h('li', { class: `story-join l-${l.verdict}`, title: hopTitle(l, i - 1) },
        h('span', { class: 'arrow', 'aria-hidden': 'true' }),
        l.verdict !== 'off-map' && PATH_TAG[l.verdict] ? h('span', { class: 'jtag' }, PATH_TAG[l.verdict]) : null) : null,
      h('li', {}, h('button', { type: 'button', class: `story-step${s.onMap ? '' : ' off'}${ring === i ? ' current' : ''}`, title: s.screen, onclick: () => ringStep(i) },
        h('span', { class: 'story-badge' }, i + 1),
        h('span', { class: 'name' }, s.onMap ? screenLabel(s.screen) : s.screen),
        !s.onMap ? h('span', { class: 'note' }, '맵에 없는 화면') : drawn.has(s.screen) ? null : h('span', { class: 'note' }, '접힘'))),
    ];
  }));
}

function pickStory(id) {
  if (id) showStoryPath(id);
  else if (state.storyPath) leaveStoryPath();
  renderFlow();
  if (id) Object.assign(document.getElementById('flow'), { scrollTop: 0, scrollLeft: 0 });
  document.querySelector('.story-pick select')?.focus();
}

function ringStep(i) {
  const st = pathStoryOf();
  if (!st) return;
  state.storyPath.ring = i;
  const step = st.steps[i];
  if (step.onMap) {
    const { parentOf } = storyTrees(state.data.flow, st);
    for (let id = parentOf.get(step.screen); id != null; id = parentOf.get(id)) state.collapsed.delete(id);
  }
  renderFlow();
  if (step.onMap) showBox(step.screen);
}

// 위쪽 막대가 붙어 있어 상자가 그 밑에 가려지지 않도록, 옮긴 뒤 한 번 더 재어 맞춘다.
function showBox(key) {
  const flow = document.getElementById('flow');
  const box = flow.querySelector(`.box.screen[data-key="${CSS.escape(key)}"]`);
  if (!box) return;
  const bar = flow.querySelector('.flowbar');
  for (let pass = 0; pass < 2; pass += 1) {
    const view = flow.getBoundingClientRect();
    const r = box.getBoundingClientRect();
    const top = bar.getBoundingClientRect().bottom;
    if (r.top < top + 8 || r.bottom > view.bottom - 8) flow.scrollTop += r.top - top - 32;
    if (r.left < view.left + 8 || r.right > view.right - 8) flow.scrollLeft += r.left - view.left - 56;
  }
}

// 상자는 페이지에 붙은 뒤에야 잴 수 있으므로, 상자를 붙인 쪽이 measureWidths → fit → measureHeights → place 순서로 불러 위치를 정한다.
function canvas(roots, { group = false, story = null } = {}) {
  const shown = { collapsed: state.collapsed, openCalls: state.openCalls };
  const boxes = flowBoxes(roots, shown);
  const els = new Map(boxes.map((b) => [b.key, b.node.kind === 'screen' ? screenBox(b) : callBox(b)]));
  for (const [key, box] of els) {
    box.classList.add('measuring');
    box.dataset.key = key;
  }
  const path = story && storyMarks(story, boxes, els);
  const view = { ...shown, group, marks: path?.marks };
  const el = h('div', { class: story ? 'canvas story' : 'canvas' }, [...els.values()], path?.marks.map((m) => m.el));
  const sizes = {};
  let cols;
  return {
    el,
    measureWidths() {
      for (const [key, box] of els) sizes[key] = { width: Math.ceil(box.getBoundingClientRect().width) };
      for (const m of path?.marks ?? []) {
        const r = m.el.getBoundingClientRect();
        Object.assign(m, { width: Math.ceil(r.width), height: Math.ceil(r.height) });
      }
    },
    fit(width) {
      cols = flowColumns(roots, sizes, { ...view, width });
      for (const [key, box] of els) {
        box.classList.remove('measuring');
        box.classList.toggle('grouped', cols.grouped.has(key));
        box.style.width = `${cols.widths[key]}px`;
      }
    },
    measureHeights() {
      for (const [key, box] of els) sizes[key].height = box.getBoundingClientRect().height;
    },
    place() {
      const out = layoutFlow(roots, sizes, view, cols);
      for (const b of out.boxes) Object.assign(els.get(b.key).style, { left: `${b.x}px`, top: `${b.y}px` });
      const lines = svg('svg', { width: out.width, height: out.height });
      for (const e of out.edges) {
        const mx = e.ex === undefined ? (e.x1 + e.x2) / 2 : (e.ex + e.nx) / 2;
        const d = e.grouped ? `M${e.x1},${e.y1} V${e.y2} H${e.x2}`
          : e.ex === undefined ? `M${e.x1},${e.y1} C${mx},${e.y1} ${mx},${e.y2} ${e.x2},${e.y2}`
            : `M${e.x1},${e.y1} H${e.ex} C${mx},${e.y1} ${mx},${e.y2} ${e.nx},${e.y2} H${e.x2}`;
        const hop = path?.edges.get(`${e.from}\n${e.to}`);
        const cls = [e.guards.length ? 'guarded' : '', hop ? `story-edge l-${hop}` : ''].filter(Boolean).join(' ');
        lines.append(svg('path', { d, class: cls, 'data-from': e.from, 'data-to': e.to }));
      }
      el.prepend(lines);
      out.marks?.forEach(({ x, y }, i) => Object.assign(path.marks[i].el.style, { left: `${x}px`, top: `${y}px`, visibility: '' }));
      if (out.group) {
        const { x, y, height, count } = out.group;
        el.append(h('h2', { class: 'group-head', style: `left:${x}px;top:${y}px;height:${height}px` }, `더 뻗지 않는 진입 화면 ${count}`));
      }
      Object.assign(el.style, { width: `${out.width}px`, height: `${out.height}px` });
      return out.group && { count: out.group.count, cellW: cols.cellW, per: cols.per };
    },
  };
}

const flowInnerWidth = (flow) => {
  const pad = getComputedStyle(flow);
  return flow.clientWidth - parseFloat(pad.paddingLeft) - parseFloat(pad.paddingRight);
};
// 모아 놓은 진입 화면을 그린 칸 수 정보. 없으면 null 이고, 창 크기가 바뀌어도 다시 그리지 않는다.
// 폭은 한 줄에 놓이는 칸 수로만 배치에 들어가므로 그 수가 달라질 때만 다시 그린다.
let drawnGrid = null;

// 설명 상자가 열렸는지는 상태에 두고 상자 그림은 다시 그리지 않는다. 다시 그리면 단추의 초점이 사라진다.
// 마우스가 올라 있는 채로 닫으면, 마우스가 벗어났다가 다시 올라올 때까지 보이지 않는다.
const legendShown = (info) => {
  const legend = state.legends[info.dataset.legend];
  return legend.open || (!legend.dismissed && info.matches(':hover'));
};
function applyLegend(info) {
  const shown = legendShown(info);
  info.classList.toggle('shown', shown);
  info.querySelector('button').setAttribute('aria-expanded', String(shown));
}
function setLegend(info, open) {
  const legend = state.legends[info.dataset.legend];
  legend.open = open;
  legend.dismissed = !open && info.matches(':hover');
  applyLegend(info);
}
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape' || e.defaultPrevented || e.isComposing || document.getElementById('flow')?.hidden !== false) return;
  for (const info of document.querySelectorAll('#flow [data-legend]')) if (legendShown(info)) setLegend(info, false);
});

// key 는 'flow' 또는 'path' 로, 단추와 설명 상자의 이름에도 쓴다.
function legendInfo(key, label, items) {
  const info = h('span', {
    class: `${key}info`,
    'data-legend': key,
    onmouseenter: (e) => applyLegend(e.currentTarget),
    onmouseleave: (e) => { state.legends[key].dismissed = false; applyLegend(e.currentTarget); },
  },
    h('button', { class: `${key}info-button`, 'aria-label': label, 'aria-expanded': 'false', 'aria-controls': `${key}legend`, onclick: () => setLegend(info, !state.legends[key].open) }, 'i'),
    h('ul', { class: `${key}legend`, id: `${key}legend` }, items));
  return info;
}

const KEY_BORDERS = [...['pass', 'fail', 'pending'].map((s) => [`s-${s}`, TEST_STATUS[s]]), ['s-none', NO_TESTS]];

function flowKey() {
  return h('ul', { class: 'flowkey', 'aria-label': '흐름도 범례' },
    KEY_BORDERS.map(([status, label]) => h('li', {},
      h('span', { class: `swatch ${status}`, 'aria-hidden': 'true' }), h('span', { class: 'sr-only' }, '테두리 '), h('span', { class: 'key-label' }, label))),
    h('li', { class: 'apart' },
      svg('svg', { viewBox: '0 0 26 6', 'aria-hidden': 'true' }, svg('path', { class: 'guarded', d: 'M0 3H26' })), h('span', { class: 'key-label' }, '조건 걸린 링크')));
}

function renderFlow() {
  const flow = document.getElementById('flow');
  if (state.ended || flow.hidden) return;
  // 상자를 재는 동안 캔버스 높이가 0 이 되어 스크롤이 맨 위로 밀리므로 위치를 정한 뒤 되돌린다.
  const { scrollTop, scrollLeft } = flow;
  const canvases = [];
  const draw = (trees, options) => {
    const c = canvas(trees, options);
    canvases.push(c);
    return c.el;
  };
  const { roots, unreached, summary } = state.data.flow;
  const act = (fn) => () => { fn(flowTrees()); renderFlow(); };
  const focused = state.focus && screensIn(state.data.flow.roots.concat(unreached)).find((n) => n.id === state.focus.id);
  const st = pathStoryOf();
  if (st && state.storyPath.ring >= st.steps.length) state.storyPath.ring = null;
  const path = st && storyTrees(state.data.flow, st);
  const story = st && { st, hidden: path.hidden, ring: state.storyPath.ring };
  const drawn = st && new Set(flowBoxes([...path.roots, ...path.unreached], { collapsed: state.collapsed, openCalls: state.openCalls }).map((b) => b.key));
  fill(flow,
    h('div', { class: 'flowbar' },
      h('strong', { class: 'flowsummary' }, `테스트 있는 화면 ${summary.tested}/${summary.screens} · 실패 ${summary.failing} · 태그 없는 테스트만 있는 화면 ${summary.importedOnly}`),
      h('button', { onclick: act(expandAll) }, '모두 펼치기'),
      h('button', { onclick: act(collapseAll) }, '모두 접기'),
      h('button', { title: '테스트가 없거나 실패한 상자까지 가는 길만 펼치고 나머지는 접습니다', onclick: act(openGapsOnly) }, '빈틈만 펼치기'),
      st
        ? h('span', { class: 'story-only' }, '스토리 경로만 보는 중 ',
          h('button', { onclick: () => { leaveStoryPath({ whole: true }); renderFlow(); document.getElementById('flow').scrollTop = 0; } }, '전체 보기'))
        : state.focus
          ? h('span', { class: 'focusing' }, h('strong', {}, focused?.label ?? state.focus.id), ' 가지만 보는 중 ',
            h('button', { onclick: () => { state.focus = null; renderFlow(); document.getElementById('flow').scrollTop = 0; } }, '전체 보기'))
          : null,
      state.flowError ? h('span', { class: 'error' }, state.flowError) : null,
      storyPicker(st),
      h('div', { class: 'flowguide' }, flowKey(), legendInfo('flow', '흐름도 읽는 법', [
        h('li', {}, h('span', { class: 'sample' }, '→ /주소'), h('span', {}, '다른 가지에 이미 그린 화면으로 가는 링크')),
        h('li', {}, h('span', { class: 'sample' }, '불러옴 N · 지나감 N · 호출함 N'), h('span', {}, '태그 없이 이 화면을 불러오는 단위 테스트와, 도는 동안 이 화면을 열거나 이 호출을 보낸 브라우저 테스트', h('small', {}, '테두리와 테스트 수에는 넣지 않음'))),
      ])),
      st ? storyStrip(st, drawn) : null),
    st ? [
      path.roots.length ? draw(path.roots, { story }) : null,
      ...(path.unreached.length ? [h('h2', {}, `진입 화면에서 닿지 않는 화면 ${screensIn(path.unreached).length}`), draw(path.unreached, { story })] : []),
    ]
      : state.focus ? draw(state.focus.roots)
        : roots.length ? draw(roots, { group: true })
          : h('p', { class: 'muted' }, summary.screens ? '진입 화면을 찾지 못했습니다. 설정 파일의 entryPaths 에 적어 주세요.' : '화면이 없습니다.'),
    !st && !state.focus && unreached.length ? [h('h2', {}, `진입 화면에서 닿지 않는 화면 ${screensIn(unreached).length}`), draw(unreached)] : null);
  // 단계마다 모든 캔버스를 다 읽은 뒤에 쓰므로, 한 캔버스에 쓴 것 때문에 다음 캔버스를 읽다가 레이아웃을 다시 계산하지 않는다.
  const width = flowInnerWidth(flow);
  for (const c of canvases) c.measureWidths();
  for (const c of canvases) c.fit(width);
  for (const c of canvases) c.measureHeights();
  drawnGrid = canvases.map((c) => c.place()).find(Boolean) ?? null;
  Object.assign(flow, { scrollTop, scrollLeft });
  for (const info of flow.querySelectorAll('[data-legend]')) applyLegend(info);
  recordPlace();
}

function setView(view) {
  if (!state.data || state.failed) return;
  state.view = view;
  render();
}

// 데이터를 읽지 못한 페이지에서도 리뷰를 끝낼 수 있어야 하므로, 위쪽 단추의 잠금은 읽어 온 데이터 없이 맞춘다.
function syncHeaderLocks() {
  document.getElementById('view-list').disabled = state.bulkBusy;
  document.getElementById('view-flow').disabled = state.bulkBusy;
  document.getElementById('end-review').disabled = state.bulkBusy || state.ending;
}

function render() {
  if (state.ended || state.failed) return;
  renderHeader();
  const flow = state.view === 'flow';
  document.querySelector('main').hidden = flow;
  document.getElementById('flow').hidden = !flow;
  document.getElementById('view-list').className = flow ? '' : 'on';
  document.getElementById('view-flow').className = flow ? 'on' : '';
  syncHeaderLocks();
  if (flow) return renderFlow();
  renderLeft();
  renderCenter();
  renderRight();
  recordPlace();
}

const PLACE_TABS = ['screens', 'stories', 'untagged'];

function placeHash() {
  const p = new URLSearchParams();
  if (state.view === 'flow') {
    if (state.storyPath) p.set('story', state.storyPath.id);
    else if (state.focus) p.set('from', state.focus.id);
  } else if (state.side === 'stories') {
    if (state.composing) p.set('new', '1');
    else if (state.candidate !== null) p.set('candidate', state.candidate);
    else if (state.story !== null) p.set('story', state.story);
  } else if (state.side === 'untagged') {
    if (state.untaggedTest !== null) p.set('test', state.untaggedTest);
  } else if (state.selected !== null) {
    p.set('screen', state.selected);
  }
  return `#${state.view === 'flow' ? 'flow' : state.side}${p.size ? `?${p}` : ''}`;
}

let shownPlace = null;
let placeTurn = 0;
let applyingPlace = false;

// 주소가 아니라 앞서 그린 자리와 견주므로, 주소에 적힌 가지를 읽어 오는 동안 같은 자리를 다시 그려도 기록이 늘지 않는다.
function recordPlace() {
  const hash = placeHash();
  if (applyingPlace || shownPlace === null) {
    if (hash !== location.hash) history.replaceState(null, '', hash);
  } else if (hash !== shownPlace) {
    placeTurn += 1;
    if (hash !== location.hash) history.pushState(null, '', hash);
  }
  shownPlace = hash;
}

// 화면에서 그 자리를 누른 것과 같게 움직인다.
// 가지를 읽어 오는 동안 검토자가 다른 자리를 고르면 그쪽을 따른다.
async function applyPlace() {
  const turn = ++placeTurn;
  const [head, query] = location.hash.slice(1).split('?');
  const p = new URLSearchParams(query ?? '');
  let go = render;
  if (head === 'flow') {
    const from = p.get('from');
    const story = pathStories().some((st) => st.id === p.get('story')) ? p.get('story') : null;
    let focus = state.storyPath ? state.storyPath.saved.focus : state.focus;
    if (!story && from !== (focus?.id ?? null)) {
      const roots = from ? await branchRoots(from).catch(() => null) : null;
      if (turn !== placeTurn) return;
      focus = roots && { id: from, roots };
    }
    go = () => {
      if (story) {
        if (state.storyPath?.id !== story) showStoryPath(story);
      } else {
        if (state.storyPath) leaveStoryPath();
        state.focus = focus;
      }
      state.view = 'flow';
      render();
    };
  } else if (PLACE_TABS.includes(head)) {
    state.view = 'list';
    state.side = head;
    const screen = p.get('screen');
    const story = p.get('story');
    const candidate = p.get('candidate');
    const test = p.get('test');
    const storyKnown = state.data.stories.list.some((st) => st.id === story) || unlistedMarks().some((m) => m.target.story === story);
    state.composing = head === 'stories' && p.has('new') && !oldMap();
    if (state.composing) Object.assign(state, { compose: state.compose ?? newCompose(), candidate: null });
    if (head === 'screens' && screen !== state.selected && screenOf(screen)) go = () => select(screen);
    else if (head === 'stories' && candidate !== null) {
      if (candidate !== state.candidate && state.data.candidates.list.some((c) => c.source.record === candidate)) go = () => selectCandidate(candidate);
    } else if (head === 'stories' && state.candidate !== null) go = () => selectStory(storyKnown ? story : state.story);
    else if (head === 'stories' && story !== state.story && storyKnown) go = () => selectStory(story);
    else if (head === 'untagged' && test !== state.untaggedTest && untaggedTests().some((t) => untaggedKey(t) === test)) go = () => selectUntaggedTest(test);
  }
  applyingPlace = true;
  try {
    go();
  } finally {
    applyingPlace = false;
  }
}

// 한 번에 판단하는 동안에는 화면의 다른 자리도 잠겨 있으므로, 뒤로 가지 않고 지금 자리를 다시 적는다.
window.addEventListener('popstate', () => {
  if (!state.data || state.ended || state.failed) return;
  if (state.bulkBusy) return history.pushState(null, '', placeHash());
  applyPlace();
});

const unsaved = (target, d) => !!d && (d.status !== (markOf(target)?.current.status ?? null) || d.note.trim() !== '');

function hasUnsavedMark() {
  return unsaved(state.target, state.draft) || unsaved({ story: state.story }, state.storyDraft);
}

function showEnded(message) {
  state.ended = true;
  fill(document.body, h('header', {}, h('h1', {}, 'duru 리뷰')), h('p', { id: 'ended' }, message));
}

// 가운데 칸을 다시 그리면 그 안의 초점이 사라지므로, 한 번에 판단하는 단추만 그 자리에서 잠그거나 푼다.
function setEnding(ending) {
  state.ending = ending;
  syncHeaderLocks();
  for (const button of document.querySelectorAll('#center .bulk-bar button')) button.disabled = bulkButtonOff(state.bulk?.picked.size);
}

async function endReview() {
  if (state.compose?.screens.length && !confirm('저장하지 않은 새 스토리가 있습니다. 「스토리 저장」을 누르지 않으면 스토리 파일이 생기지 않습니다. 그래도 리뷰를 끝낼까요?')) return;
  if (hasUnsavedMark() && !confirm('「표시 남기기」를 누르지 않은 표시가 있습니다. 이 표시는 작업 목록에 들어가지 않습니다. 그래도 리뷰를 끝낼까요?')) return;
  const error = document.getElementById('end-error');
  error.textContent = '';
  setEnding(true);
  try {
    let res;
    try {
      res = await fetch('/api/end', { method: 'POST', headers: { 'content-type': 'application/json' }, body: '{}' });
    } catch {
      return showEnded('리뷰 페이지 서버가 이미 닫혔습니다. 다른 창에서 리뷰를 끝냈거나 터미널에서 멈춘 것입니다. 이 창은 닫아도 됩니다.');
    }
    if (res.ok) return showEnded('리뷰를 끝냈습니다. 작업 목록은 리뷰 페이지를 띄운 터미널로 넘어갔습니다. 이 창은 닫아도 됩니다.');
    error.textContent = `리뷰를 끝내지 못했습니다: ${await res.text()}`;
  } finally {
    if (!state.ended) setEnding(false);
  }
}

document.getElementById('end-review').addEventListener('click', endReview);
document.getElementById('view-list').addEventListener('click', () => setView('list'));
document.getElementById('view-flow').addEventListener('click', () => setView('flow'));
let resizeFrame = null;
window.addEventListener('resize', () => {
  if (resizeFrame !== null) return;
  resizeFrame = requestAnimationFrame(() => {
    resizeFrame = null;
    const flow = document.getElementById('flow');
    if (state.ended || flow.hidden || drawnGrid === null) return;
    if (cellsPerRow(drawnGrid.count, drawnGrid.cellW, flowInnerWidth(flow)) !== drawnGrid.per) renderFlow();
  });
});

// 리뷰를 끝낸 뒤에 늦게 실패한 읽기만 알리지 않고, 그리다 난 오류는 그대로 알린다.
load().then(() => {
  openGapsOnly(flowTrees());
  return applyPlace();
}, (err) => {
  if (!state.ended) throw err;
}).catch((err) => {
  state.failed = true;
  document.querySelector('main').hidden = true;
  document.getElementById('flow').hidden = true;
  const failed = document.getElementById('failed');
  failed.textContent = `페이지를 그리지 못했습니다: ${err.message}`;
  failed.hidden = false;
});
</script>
</body>
</html>
