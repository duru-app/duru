    h('div', {}, test.title, ' ', h('span', { class: 'muted mono' }, testPlace(test))),
    h('span', { class: 'label' }, ['화면', '호출'].filter((word) => ids.some((id) => nodeWord(id) === word)).join('과 ')),
    h('ul', { class: 'plain' }, ids.map((id) => h('li', {}, callOf(id) ? h('span', { class: 'mono' }, id) : [screenLabel(id), ' ', h('span', { class: 'muted' }, screenOf(id)?.component)]))));
  excludePart('textarea').readOnly = busy;
  excludePart('button.cancel').disabled = busy;
  excludePart('button.discard').textContent = many ? `제외 (${ids.length})` : '제외';
  syncExcludeConfirm();
  excludePart('.error').textContent = error ?? '';
  excludePart('.error').hidden = !error;
}

function askExclude(job) {
  excludeJob = { ...job, busy: false, error: null };
  excludePart('textarea').value = '';
  drawExclude();
  excludeDialog.showModal();
  excludePart('textarea').focus();
}

function closeExclude() {
  excludeJob = null;
  excludeDialog.close();
  // 창을 연 단추가 그사이 다시 그려졌으면 초점이 닫힌 창 안에 남는다.
  if (excludeDialog.contains(document.activeElement)) document.activeElement.blur();
}

async function confirmExclude() {
  const job = excludeJob;
  Object.assign(job, { busy: true, error: null });
  drawExclude();
  const error = await job.save(excludePart('textarea').value.trim());
  if (error) {
    Object.assign(job, { busy: false, error });
    drawExclude();
    return excludePart('textarea').focus();
  }
  closeExclude();
  job.done();
}

excludePart('textarea').addEventListener('input', syncExcludeConfirm);
excludePart('button.discard').addEventListener('click', confirmExclude);
excludePart('button.cancel').addEventListener('click', () => {
  const { refocus } = excludeJob;
  closeExclude();
  refocus();
});
// Ctrl+Enter 와 Escape 는 창의 단추를 대신 누르므로, 저장하는 동안에는 단추와 똑같이 막힌다.
excludeDialog.addEventListener('keydown', (e) => {
  const send = e.key === 'Enter' && (e.ctrlKey || e.metaKey);
  if (e.key !== 'Escape' && !send) return;
  e.preventDefault();
  if (e.isComposing || e.repeat) return;
  excludePart(send ? 'button.discard' : 'button.cancel').click();
});

function askExcludePair(t, node, key) {
  if (judgmentsInFlight.has(key)) return;
  askExclude({
    test: t,
    nodeIds: () => [node],
    save: async (reason) => {
      const { failure, reloadError } = await postAndReload({ test: t.ref, node, kind: 'discard', reason }, key);
      if (!failure) state.judgmentError = reloadError ? { key, message: reloadError } : null;
      return failure;
    },
    done: renderKeepingJudgeRowFocus,
    refocus: () => judgeRowControl(key, 'button.discard')?.focus(),
  });
}

function judgmentForm(t, node) {
  const key = judgmentKey(t, node);
  const word = nodeWord(node);
  return h('div', { class: 'judge-row', 'data-pair': key },
    h('button', { class: 'discard', title: `이 테스트와 이 ${word}의 짝을 다시 보이지 않게 합니다. 까닭을 적어야 합니다`, onclick: () => askExcludePair(t, node, key) }, '제외'),
    h('button', { class: 'hand-over', title: `이 ${word}의 테스트로 보고, 테스트에 이 ${word}의 태그를 달도록 작업 목록에 올립니다`, onclick: () => saveJudgment({ test: t.ref, node, kind: 'hand-over', reason: '' }, key) }, '포함'));
}

const judgmentMeta = (j, label) => h('div', { class: 'detail' },
  j.reason.trim() ? [`${label} `, h('span', { class: 'memo' }, j.reason)] : null,
  h('span', { class: 'muted' }, `${j.reason.trim() ? ' · ' : ''}${signedAt(j)}`));

const undoButton = (t, node) => h('button', { class: 'undo', onclick: () => saveJudgment({ test: t.ref, node, kind: 'undo' }, judgmentKey(t, node)) }, '되돌리기');

function detachedItem(t) {
  return h('div', { class: 'test' },
    h('span', { class: 'muted mono' }, t.ref.file), ' ', t.ref.title);
}

const PASS_LEVEL = { assert: '확인함', interact: '조작함', visit: '지나감', call: '호출함' };
const PASS_LEVEL_TITLE = { assert: '이 화면이 열려 있을 때 확인문을 실행했습니다', interact: '이 화면이 열려 있을 때 누르거나 입력했습니다', visit: '이 화면을 열기만 했습니다', call: '도는 동안 이 호출의 메서드와 경로에 맞는 요청을 보냈습니다' };

const UNCONFIRMED_TITLE = '이번 실행에서는 이 테스트의 trace 를 읽지 못해 이 짝을 다시 확인하지 못했습니다. 포함한 판단은 그대로입니다';

function passedItem(t) {
  return h('div', { class: 'test' },
    t.unconfirmed
      ? h('span', { class: 'chip level-visit', title: UNCONFIRMED_TITLE }, '확인 못 함')
      : h('span', { class: `chip level-${t.level}`, title: PASS_LEVEL_TITLE[t.level] }, PASS_LEVEL[t.level]), ' ',
    h('span', { class: `chip ${t.status}` }, TEST_STATUS[t.status]), ' ', t.title, ' ',
    h('span', { class: 'muted mono' }, filePlace(t.file, t.line)),
    t.project ? h('span', { class: 'muted' }, ` · ${t.project}`) : null,
    h('div', { class: 'detail' }, '결과 파일 ', h('span', { class: 'mono' }, t.source)));
}

const byTrace = (t) => Boolean(t.level || t.unconfirmed);
const pairTestItem = (t) => (byTrace(t) ? passedItem(t) : importerItem(t));
const pairKeys = (node) => [passedOf, importersOf, discardedOf, awaitingTagOf, detachedOf].flatMap((of) => of(node)).map((t) => judgmentKey(t, node));

// 화면의 짝은 가운데 칸에, 고른 호출의 짝은 오른쪽 칸에 있다.
function strayJudgmentError(s) {
  const call = state.target.node === s.id ? [] : pairKeys(state.target.node);
  const stray = state.judgmentError && ![...pairKeys(s.id), ...call].includes(state.judgmentError.key);
  return stray ? h('p', { class: 'error judgment-error' }, state.judgmentError.message) : null;
}

const PAIR_TEXT = {
  화면: {
    passed: (n) => `지나간 테스트 ${n}`,
    passedNote: '도는 동안 이 화면을 연 브라우저 테스트입니다. 이 화면의 태그가 없어서 이 화면의 테스트로 세지 않습니다.',
    detachedNote: '포함한 테스트를 결과에서 찾을 수 없습니다. 테스트의 파일이나 제목이 바뀌었거나, 이 화면의 파일을 더는 불러오지 않거나 이 화면을 더는 열지 않는 것으로 보입니다.',
  },
  호출: {
    passed: (n) => `호출한 테스트 ${n}`,
    passedNote: '도는 동안 이 호출을 보낸 브라우저 테스트입니다. 이 호출의 태그가 없어서 이 호출의 테스트로 세지 않습니다.',
    detachedNote: '포함한 테스트를 결과에서 찾을 수 없습니다. 테스트의 파일이나 제목이 바뀌었거나, 이 호출을 더는 보내지 않는 것으로 보입니다.',
  },
};

function untaggedPairs(node) {
  const text = PAIR_TEXT[nodeWord(node)];
  const order = Object.keys(PASS_LEVEL);
  const passed = [...passedOf(node)].sort((a, b) => order.indexOf(a.level) - order.indexOf(b.level));
  const importers = importersOf(node);
  const discarded = discardedOf(node);
  const awaiting = awaitingTagOf(node);
  const detached = detachedOf(node);
  const row = (t, ...rest) => h('div', { class: `pair-test ${byTrace(t) ? 'passer' : 'importer'}` }, ...rest, judgmentErrorOf(judgmentKey(t, node)));
  const openRow = (t) => row(t, pairTestItem(t), judgmentForm(t, node));
  const judgedRow = (item, t, label) => row(t, item, judgmentMeta(t.judgment, label), undoButton(t, node));
  return [
    passed.length ? h('div', { class: 'passed' },
      h('h2', {}, text.passed(passed.length)),
      h('p', { class: 'muted' }, text.passedNote),
      passed.map(openRow)) : null,
    importers.length ? h('div', { class: 'importers' },
      h('h2', {}, `불러오는 테스트 ${importers.length}`),
      h('p', { class: 'muted' }, '이 화면에 딸린 소스 파일을 불러오는 단위 테스트입니다. 이 화면의 태그가 없어서 이 화면의 테스트로 세지 않습니다.'),
      importers.map(openRow)) : null,
    awaiting.length ? h('div', { class: 'awaiting-tag' },
      h('h2', {}, `태그 대기 ${awaiting.length}`),
      awaiting.map((t) => judgedRow(pairTestItem(t), t, '메모'))) : null,
    detached.length ? h('div', { class: 'detached' },
      h('h2', {}, `떨어져 나감 ${detached.length}`),
      h('p', { class: 'muted' }, text.detachedNote),
      detached.map((t) => judgedRow(detachedItem(t), t, '메모'))) : null,
    discarded.length ? h('div', { class: 'discarded' },
      h('h2', {}, `제외한 짝 ${discarded.length}`),
      discarded.map((t) => judgedRow(pairTestItem(t), t, '까닭'))) : null,
  ];
}

function frameAccount(s) {
  const { app } = state.data;
  const account = { url: app.url, label: `${app.account} 로 로그인`, error: app.error };
  const asRole = (r) => ({ url: r.url, label: `${r.role} 역할 ${r.account} 로 로그인`, error: r.error, role: r.role });
  const wanted = s.access.roleValues;
  const unread = s.access.unreadableRoleGuards ?? [];
  const hint = wanted && unread.length ? `읽지 못한 역할 조건도 있습니다: ${unread.join(', ')}` : null;
  return { hint, ...pickAccount(account, asRole, wanted, unread) };
}

function pickAccount(account, asRole, wanted, unread) {
  const { app } = state.data;
  if (state.roleChoice === 'auto') {
    if (wanted === undefined) return { ...account, notes: [] };
    if (wanted === null) {
      return { ...account, notes: [`어느 역할이 조건을 채우는지 맵에서 정할 수 없습니다${unread.length ? `: ${unread.join(', ')}` : ''}`] };
    }
    const meets = app.roles.filter((r) => wanted.includes(r.role));
    const role = meets.find((r) => !r.error) ?? meets[0];
    return role ? { ...asRole(role), notes: [] } : { ...account, notes: [`조건을 채우는 역할(${wanted.join(', ')})에 계정이 없습니다`] };
  }
  const role = app.roles.find((r) => `role:${r.role}` === state.roleChoice);
  if (!role) return { ...account, notes: [] };
  return { ...asRole(role), notes: wanted && !wanted.includes(role.role) ? [`이 역할은 화면 조건(${wanted.join(', ')})을 채우지 못합니다`] : [] };
}

function rolePicker() {
  const { app, map } = state.data;
  const missing = [...new Set(map.screens.flatMap((s) => s.access.roleValues ?? []))].filter((v) => !app.roles.some((r) => r.role === v)).sort();
  const option = (value, label) => h('option', { value, selected: state.roleChoice === value }, label);
  return h('select', { class: 'role', title: '앱을 띄울 계정', onchange: (e) => { state.roleChoice = e.target.value; render(); } },
    option('auto', '자동'),
    option('account', `기본 계정 (${app.account})`),
    app.roles.map((r) => option(`role:${r.role}`, `${r.role} (${r.account})`)),
    missing.map((v) => h('option', { disabled: true }, `${v} — 계정 없음`)));
}

function filledPath(parts, values) {
  let out = '';
  for (const p of parts) {
    if (typeof p === 'string') out += p;
    else if (values[p.name]) out += p.prefix + (p.repeat || p.pattern === '.*' ? values[p.name].split('/').map(encodeURIComponent).join('/') : encodeURIComponent(values[p.name]));
    else if (!p.optional) return null;
  }
  return out || '/';
}

const pathValueKey = (id, role) => `${id}\n${role ?? ''}`;

async function loadPathValues(id, role) {
  const entry = { pending: true };
  state.pathValues.set(pathValueKey(id, role), entry);
  try {
    const res = await fetch(`/api/path-values?screen=${encodeURIComponent(id)}${role ? `&role=${encodeURIComponent(role)}` : ''}`);
    if (!res.ok) throw new Error(await res.text());
    Object.assign(entry, await res.json());
  } catch (err) {
    Object.assign(entry, { parts: null, values: {}, errors: [`경로 변수 값을 가져오지 못했습니다: ${err.message}`], fallback: null });
  }
  Object.assign(entry, { pending: false, draft: { ...entry.values }, opened: 0 });
  if (state.side === 'screens' && state.selected === id && state.view === 'list') renderCenterHead(state.data.map.screens.find((x) => x.id === id));
}

function pathValuesOf(s, role) {
  const key = pathValueKey(s.id, role);
  if (!state.pathValues.has(key)) loadPathValues(s.id, role);
  return state.pathValues.get(key);
}

function frameTarget(s, entry) {
  const { app, appLinks, map } = state.data;
  const at = (routePath, path) => (app.signedOutPaths.includes(routePath) ? app.signedOutUrl : app.url) + path;
  if (!entry) return { link: appLinks[s.id] };
  if (entry.pending) return {};
  const path = entry.parts && filledPath(entry.parts, entry.values);
  if (path) return { link: at(s.path, path) };
  if (entry.opened) return { fallback: false, missing: entry.parts.filter((p) => typeof p !== 'string' && !p.optional && !entry.values[p.name]).map((p) => p.name) };
  if (!entry.fallback) return { fallback: false };
  const opens = map.screens.find((x) => x.id === entry.fallback);
  return { link: at(opens.path, entry.fallbackPath), fallback: true, opens };
}

function pathValueBar(s, entry, fallback) {
  const variables = (entry.parts ?? []).filter((p) => typeof p !== 'string');
  if (!variables.length && !fallback && !entry.errors.length) return null;
  const reopen = () => {
    entry.values = { ...entry.draft };
    entry.opened += 1;
    renderCenterHead(s);
  };
  return h('div', { class: 'path-values' },
    variables.map((v) => h('label', { title: v.optional ? '비워 두면 이 자리를 빼고 엽니다' : null }, v.optional ? `${v.name}?` : v.name, ' ',
      h('input', {
        type: 'text', name: v.name, value: entry.draft[v.name] ?? '', placeholder: '값',
        oninput: (e) => { entry.draft[v.name] = e.target.value; },
        onkeydown: (e) => { if (e.key === 'Enter' && !e.isComposing) reopen(); },
      }))),
    variables.length ? h('button', { onclick: reopen }, '다시 띄우기') : null,
    fallback ? h('span', { class: 'fallback' }, '목록에서 골라 들어가세요') : null,
    entry.errors.map((e) => h('span', { class: 'error' }, e)));
}

function appFrame(s, { link, fallback, opens, missing }, entry) {
  const { app } = state.data;
  if (entry?.pending) return h('div', { class: 'frame-note muted' }, '경로 변수 값을 준비하고 있습니다.');
  const unknown = [
    app.unknownSignedOutPaths.length > 0 && h('span', { class: 'error' }, `맵에 없는 signedOutPaths: ${app.unknownSignedOutPaths.join(', ')}`),
    app.unknownPathValues.length > 0 && h('span', { class: 'error' }, `맵에 없는 pathValues: ${app.unknownPathValues.join(', ')}`),
  ];
  const values = entry && pathValueBar(s, entry, fallback);
  if (!link) {
    return [
      values && h('div', { class: 'frame-bar' }, unknown, values),
      h('div', { class: 'frame-note muted' }, missing ? `${missing.join(', ')} 값이 없어 이 화면을 띄울 수 없습니다.` : '주소에 값이 필요한 화면이라 앱을 띄우지 않았습니다.'),
    ];
  }
  const signedOut = Boolean(app.signedOutUrl) && link.startsWith(`${app.signedOutUrl}/`);
  const who = signedOut ? null : frameAccount(opens ?? s);
  const shown = who ? who.url + link.slice(app.url.length) : link;
  const opened = signedOut
    ? `${app.signedOutUrl}${app.signOutPath}?to=${encodeURIComponent(link.slice(app.signedOutUrl.length))}`
    : shown;
  return [
    h('div', { class: 'frame-bar' },
      h('span', { class: 'mono' }, shown),
      signedOut ? h('span', {}, '로그아웃 상태') : [
        rolePicker(),
        who.error ? h('span', { class: 'error' }, who.error) : h('span', {}, who.label),
        ...who.notes.map((n) => h('span', { class: 'error' }, n)),
        who.hint && h('span', { class: 'muted' }, who.hint),
      ],
      unknown,
      h('a', { href: opened, target: '_blank', rel: 'noopener' }, '새 창으로 열기 ↗'),
      values),
    h('div', { class: 'settings-bar', id: 'settings-bar', hidden: true }),
    h('iframe', { class: 'app', 'data-src': opened, title: '앱 화면' }),
  ];
}

// ---------- 프레임 위에 붙는 설정 줄 ----------

const samePlace = (o, path, item) => o.path.join('.') === path.join('.') && o.item === item;
const overrideIn = (list, path, item) => list.find((o) => samePlace(o, path, item));
const overrides = () => state.data.app?.settings?.overrides ?? [];
const quoted = (v) => JSON.stringify(v);
const sourceLabel = (source) => (source.from === 'route' ? '라우트' : source.inherited ? `${source.from} 에서 물려받음` : `${source.from} 에서 오는 링크`);
const valueAt = (v, keys) => keys.reduce((o, k) => (o !== null && typeof o === 'object' ? o[k] : undefined), v);

function fileDefines(section, key) {
  const values = state.data.app.settings?.file?.[section];
  return values !== null && typeof values === 'object' && Object.hasOwn(values, key);
}

function unchangedKnown(n) {
  const incomplete = state.data.map.settingsDefaultsIncomplete?.[n.root] ?? [];
  return !incomplete.some((p) => p.every((k, i) => k === n.path[i])) || fileDefines(n.path[0], n.path[1]);
}

function blockOf(n) {
  const settings = state.data.app.settings;
  if (!settings) return '설정 파일(app.settingsFile)을 적지 않아 바꿀 수 없습니다';
  if (n.root !== settings.root) return `${n.root} 로 읽는 설정이라 설정 파일로 바꿀 수 없습니다`;
  if (n.path.length < 2) return '섹션 전체는 바꿀 수 없습니다';
  const [section, key] = n.path;
  if (!settings.merged.includes(section)) return `앱이 설정 파일에서 ${section} 섹션을 읽지 않아 바꿀 수 없습니다`;
  if ((n.need === 'includes' || n.path.length > 2) && !unchangedKnown(n)) {
    return `${section}.${key} 기본값을 소스에서 다 읽지 못해, 설정 파일이 이 키를 정하지 않는 한 안쪽 값만 바꾸면 나머지가 사라질 수 있어 바꿀 수 없습니다`;
  }
  if (n.need === 'present') return '어떤 값이 있어야 하는지 몰라 넣을 수 없습니다';
  return null;
}

function unchangedOf(n) {
  const settings = state.data.app.settings;
  if (!settings || n.root !== settings.root || n.path.length < 2 || !settings.merged.includes(n.path[0])) return n.default;
  const [section, key, ...rest] = n.path;
  const top = fileDefines(section, key) ? settings.file[section][key] : state.data.map.settingsDefaults?.[n.root]?.[section]?.[key];
  return valueAt(top, rest);
}

const unchangedIncludes = (n) => {
  const list = unchangedOf(n);
  return Array.isArray(list) && list.includes(n.value);
};

function currentOf(n, list) {
  if (n.need === 'includes') return overrideIn(list, n.path, n.value)?.value ?? unchangedIncludes(n);
  const o = overrideIn(list, n.path);
  return o ? o.value : unchangedOf(n);
}

function satisfied(n, list) {
  const v = currentOf(n, list);
  return { on: Boolean(v), off: !v, equals: v === n.value, includes: v === true, present: Boolean(v) }[n.need];
}

const wantedOf = (n) => (n.need === 'includes' ? { path: n.path, item: n.value, value: true } : { path: n.path, value: n.need === 'equals' ? n.value : n.need === 'on' });

function withOverride(list, op, isDefault) {
  const rest = list.filter((o) => !samePlace(o, op.path, op.item));
  return isDefault ? rest : [...rest, op];
}

function autoOverrides(s, list) {
  const sources = s.access.settings ?? [];
  const fits = (n) => !blockOf(n) || satisfied(n, list);
  const link = sources.find((x) => x.from !== 'route' && x.needs.length && !x.unreadable.length && x.needs.every(fits));
  // 원래 값을 다 읽지 못한 설정은 조건을 채웠는지 알 수 없으므로 필요한 값을 직접 적는다.
  const written = (n) => overrideIn(list, n.path, n.need === 'includes' ? n.value : undefined);
  const needs = sources.filter((x) => x.from === 'route' || x === link).flatMap((x) => x.needs)
    .filter((n) => !blockOf(n) && (!satisfied(n, list) || (!unchangedKnown(n) && !written(n))));
  return needs.length ? needs.reduce((next, n) => withOverride(next, wantedOf(n), unchangedKnown(n) && satisfied(n, [])), list) : null;
}

// 한 단계가 실패해도 다음 단계는 돌고 프레임은 언제나 열린다.
let settingsQueue = Promise.resolve();
function updateSettings(change) {
  const frame = document.querySelector('#center iframe.app');
  settingsQueue = settingsQueue.then(async () => {
    state.settingsError = null;
    try {
      const next = change(overrides());
      if (next) {
        const res = await fetch('/api/settings', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ overrides: next }) });
        if (!res.ok) throw new Error(await res.text());
        state.data.app.settings.overrides = (await res.json()).overrides;
      }
    } catch (err) {
      state.settingsError = `설정을 바꾸지 못했습니다: ${err.message}`;
    }
    renderSettingsBar();
    if (frame?.isConnected) frame.src = frame.dataset.src;
  }).catch((err) => {
    state.settingsError = `설정 줄을 그리지 못했습니다: ${err.message}`;
  });
}

function settingRows(s) {
  const rows = new Map();
  for (const source of s.access.settings ?? []) {
    for (const n of source.needs) {
      const kind = ['includes', 'present'].includes(n.need) ? n.need : 'value';
      const key = quoted([n.root, n.path, kind, kind === 'includes' ? n.value : null]);
      if (!rows.has(key)) rows.set(key, { needs: [], from: new Set() });
      rows.get(key).needs.push(n);
      rows.get(key).from.add(sourceLabel(source));
    }
  }
  return [...rows.values()];
}

function settingControl(row, list) {
  const [n] = row.needs;
  const block = blockOf(n);
  const name = h('code', {}, n.path.join('.'));
  const title = [...row.from].join(' · ');
  if (n.need === 'present') {
    return satisfied(n, list)
      ? h('span', { class: 'setting', title }, name, h('span', { class: 'muted' }, '기본값에 있음'))
      : h('span', { class: 'setting blocked', title }, name, h('span', { class: 'reason' }, block));
  }
  const changed = Boolean(overrideIn(list, n.path, n.need === 'includes' ? n.value : undefined));
  const cls = `setting${changed ? ' changed' : ''}${block ? ' blocked' : ''}`;
  const reason = block ? h('span', { class: 'reason' }, block) : null;
  const disabled = Boolean(block);
  if (n.need === 'includes') {
    const inList = currentOf(n, list);
    const isDefault = (on) => on === unchangedIncludes(n);
    return h('label', { class: cls, title }, name, h('span', {}, `에 ${quoted(n.value)}`),
      h('input', { type: 'checkbox', checked: inList, disabled, onchange: (e) => {
        const on = e.target.checked;
        updateSettings((l) => withOverride(l, { path: n.path, item: n.value, value: on }, isDefault(on)));
      } }), '목록에 넣기', reason);
  }
  const values = [...new Map(row.needs.filter((x) => x.need === 'equals').map((x) => [quoted(x.value), x.value])).values()];
  if (values.length) {
    const current = overrideIn(list, n.path);
    const unchanged = unchangedKnown(n) ? unchangedOf(n) : undefined;
    return h('span', { class: cls, title }, name,
      h('select', { disabled, onchange: (e) => {
        const picked = e.target.value;
        const value = picked && JSON.parse(picked);
        updateSettings((l) => withOverride(l, { path: n.path, value }, picked === '' || (unchanged !== undefined && value === unchanged)));
      } },
        h('option', { value: '', selected: !current }, `바꾸지 않음${unchanged !== undefined ? ` (${quoted(unchanged)})` : ''}`),
        values.map((v) => h('option', { value: quoted(v), selected: current && quoted(current.value) === quoted(v) }, quoted(v)))),
      reason);
  }
  const on = Boolean(currentOf(n, list));
  const set = (value) => () => updateSettings((l) => withOverride(l, { path: n.path, value }, unchangedKnown(n) && value === Boolean(unchangedOf(n))));
  return h('span', { class: cls, title }, name,
    h('button', { class: on ? 'on' : '', disabled, onclick: set(true) }, '켜기'),
    h('button', { class: on ? '' : 'on', disabled, onclick: set(false) }, '끄기'),
    reason);
}

const overrideText = (o) => (o.item === undefined ? `${o.path.join('.')} = ${quoted(o.value)}` : `${o.path.join('.')} 에 ${quoted(o.item)} ${o.value ? '넣음' : '뺌'}`);

function renderSettingsBar() {
  const bar = document.getElementById('settings-bar');
  const s = state.data.map.screens.find((x) => x.id === state.frameScreen);
  if (!bar || !s) return;
  const list = overrides();
  const rows = settingRows(s);
  const unreadable = (s.access.settings ?? []).flatMap((x) => x.unreadable.map((u) => ({ ...u, source: x })));
  const others = list.filter((o) => !rows.some((r) => samePlace(o, r.needs[0].path, r.needs[0].need === 'includes' ? r.needs[0].value : undefined)));
  bar.hidden = !rows.length && !unreadable.length && !list.length && !state.settingsError;
  bar.classList.toggle('overridden', list.length > 0);
  fill(bar,
    h('span', { class: 'title' }, list.length ? `설정 ${list.length}개 바꿈` : '설정'),
    rows.map((r) => settingControl(r, list)),
    unreadable.map((u) => h('span', { class: 'setting blocked', title: sourceLabel(u.source) }, h('code', {}, u.guard), h('span', { class: 'reason' }, u.reason))),
    others.length ? h('span', { class: 'others' }, '다른 화면에서 바꾼 설정 ', others.map((o) => h('span', { class: 'setting changed' }, h('code', {}, overrideText(o))))) : null,
    list.length ? h('button', { class: 'reset', onclick: () => updateSettings(() => []) }, '기본값으로') : null,
    state.data.app.settings?.fileError ? h('span', { class: 'file-error' }, state.data.app.settings.fileError) : null,
    state.settingsError ? h('span', { class: 'error' }, state.settingsError) : null);
}

function renderCenterHead(s) {
  const head = document.getElementById('center-head');
  const { app, appLinks } = state.data;
  const entry = s && app && !appLinks[s.id] ? pathValuesOf(s, frameAccount(s).role) : null;
  const target = s && app ? frameTarget(s, entry) : null;
  // 앱을 조작하던 중에 표시를 남겨도 프레임이 다시 로드되지 않게, 고른 화면이나 띄울 주소가 바뀔 때만 다시 그린다.
  const key = s ? [s.id, app?.url, state.roleChoice, target?.link, entry?.pending, entry?.opened].join(' ') : '';
  if (head.dataset.key === key) return;
  head.dataset.key = key;
  if (!s) return fill(head);
  const link = appLinks[s.id];
  fill(head,
    h('div', { class: 'title-row' },
      h('h3', {}, s.path),
      h('span', { class: 'muted' }, s.component),
      app ? null
        : link ? h('a', { href: link, target: '_blank', rel: 'noopener' }, '실제 앱에서 열기 ↗')
          : state.data.appUrl ? h('span', { class: 'muted' }, '경로 변수가 있어 실제 앱 링크를 만들 수 없음') : null),
    h('div', { class: 'muted mono' }, s.id),
    app ? appFrame(s, target, entry) : null);
  // 값을 불러오는 동안이나 값이 비어 주소가 없을 때는 마지막으로 띄운 화면을 그대로 기억한다.
  if (!target?.link) return;
  const shownId = (target.opens ?? s).id;
  const moved = shownId !== state.frameScreen;
  state.frameScreen = shownId;
  if (moved) state.settingsError = null;
  renderSettingsBar();
  const shown = state.data.map.screens.find((x) => x.id === shownId);
  updateSettings(moved ? (list) => autoOverrides(shown, list) : () => null);
}

function stepItem(step, i, recordSteps) {
  const records = recordSteps ? h('span', { class: 'records muted', title: '방문 기록에서 이 화면에 머문 단계' }, stepsText(recordSteps)) : null;
  if (!step.onMap) {
    return h('div', { class: 'step off-map' },
      h('span', { class: 'no' }, i + 1),
      h('span', { class: 'name' }, h('div', { class: 'muted mono' }, step.screen)),
      records,
      h('span', { class: 'chip l-off-map' }, '맵에 없는 화면'));
  }
  const s = screenOf(step.screen);
  return h('div', { class: 'step on-map', title: '화면 목록에서 이 화면을 엽니다', onclick: () => openScreen(s.id) },
    h('span', { class: 'no' }, i + 1),
    h('span', { class: 'name' }, screenHead(s), stepTests(s.id)),
    records);
}

function stepTests(id) {
  const tests = testsOf(id);
  if (!tests.length) return h('div', { class: 'step-tests' }, h('span', { class: 'none' }, '화면 테스트 없음'));
  return h('div', { class: 'step-tests' }, state.data.depths.map((d) => {
    const at = tests.filter((t) => t.depth === d);
    return at.length ? h('span', { title: at.map((t) => `${TEST_STATUS[t.status]} ${t.title}`).join('\n') }, DEPTH_LABELS[d], ' ', countsOf(at)) : null;
  }));
}

const wayItem = (w, scope = null) => h('li', {}, h('code', {}, `${w.file}:${w.line}`),
  w.conditions.length ? w.conditions.map((g) => accessGuard(g, scope, state.storyOpen)) : h('span', { class: 'muted' }, ' 조건 없음'));

const unknownList = (links) => h('ul', { class: 'plain ways unknown-links' }, links.map((u) => h('li', {}, h('code', {}, `${u.file}:${u.line}`), ' → ', h('code', {}, u.to))));
const skippedLinks = (links) => [h('div', { class: 'muted skipped' }, '판정에서 뺀 링크'), unknownList(links)];

function linkItem(l) {
  return h('div', { class: `link l-${l.verdict}` },
    h('span', { class: `chip l-${l.verdict}`, title: LINK_VERDICT_TITLE[l.verdict] }, LINK_VERDICT[l.verdict]),
    l.verdict === 'off-map' ? h('span', { class: 'muted' }, ' 화면 없음') : null,
    l.verdict === 'configured' ? h('span', { class: 'muted' }, ` ${l.reasons.join(', ')}`) : null,
    l.verdict === 'unknown' ? [h('span', { class: 'muted' }, ' 주소 못 읽은 링크'), unknownList(l.unknownLinks)] : null,
    l.ways.length ? h('ul', { class: 'plain ways' }, l.ways.map((w) => wayItem(w))) : null,
    l.ways.length > 0 && l.unknownLinks ? skippedLinks(l.unknownLinks) : null);
}

function clearCenterHead() {
  const head = document.getElementById('center-head');
  head.dataset.key = '';
  fill(head);
}

const compareText = (a, b) => (a < b ? -1 : a > b ? 1 : 0);

const PAIR_STATES = [
  { list: 'importers', label: '불러옴', cls: 'config' },
  { list: 'passed', cls: 'config' },
  { list: 'awaitingTag', label: '태그 대기', cls: 'wait', noteLabel: '메모' },
  { list: 'detachedHandOvers', label: '떨어져 나감', cls: 'wait', noteLabel: '메모' },
  { list: 'discarded', label: '제외한 짝', cls: 'muted', noteLabel: '까닭' },
];

function pairsOf(t) {
  const ref = JSON.stringify(t.ref);
  const pairs = [];
  for (const { list, ...rest } of PAIR_STATES) {
    for (const [id, entries] of Object.entries(state.data.tests[list] ?? {})) {
      const entry = entries.find((e) => JSON.stringify(e.ref) === ref);
      if (entry) pairs.push({ id, entry, label: PASS_LEVEL[entry.level], ...rest });
    }
  }
  return pairs.sort((a, b) => compareText(screenLabel(a.id), screenLabel(b.id)) || compareText(a.id, b.id));
}

const opensOnPage = (id) => Boolean(screenOf(id) || callOf(id)?.screens.length);

function pairItem({ id, entry, label, cls, noteLabel }) {
  const s = screenOf(id);
  const call = !s && callOf(id);
  const body = h('span', { class: 'name' },
    s ? screenHead(s) : h('div', { class: call ? 'mono' : 'muted mono' }, id),
    entry.via ? viaRow(entry.via) : null,
    entry.judgment ? judgmentMeta(entry.judgment, noteLabel) : null);
  const stateChip = h('span', { class: `chip pair-state ${cls}` }, label);
  if (!s && !call) return h('div', { class: 'step off-map pair' }, body, h('span', { class: 'chip l-off-map', title: '맵에 없는 화면이나 호출입니다' }, '맵에 없음'), stateChip);
  if (!opensOnPage(id)) return h('div', { class: 'step off-map pair' }, body, stateChip);
  const open = s
    ? { title: '화면 목록에서 이 화면을 엽니다', onclick: () => openScreen(id) }
    : { title: '이 호출을 부르는 화면을 열고 이 호출을 고릅니다', onclick: () => openCall(id) };
  return h('div', { class: `step on-map pair${state.bulkBusy ? ' locked' : ''}`, title: state.bulkBusy ? null : open.title, onclick: open.onclick }, body, stateChip);
}

function noScreensText(t) {
  if (t.format === 'playwright') {
    if (t.unmatched) return '이 테스트는 도는 동안 맵에 있는 화면을 열지도, 맵에 있는 호출을 보내지도 않았습니다.';
    const notice = (state.data.tests.traceNotices ?? []).find((n) => n.test.title === t.title && n.test.file === t.file && n.test.line === t.line);
    if (notice) return `이 테스트의 trace 파일을 읽지 못해, 어느 화면을 열고 어느 호출을 보냈는지 알 수 없습니다. ${notice.reason}.`;
    if (t.status === 'pending') return '이 테스트는 건너뛰어 돌지 않았으므로, 어느 화면을 열고 어느 호출을 보내는지 알 수 없습니다.';
    return '이 테스트는 trace 파일 없이 돌아, 어느 화면을 열고 어느 호출을 보냈는지 알 수 없습니다. Playwright 의 trace 옵션을 켜고 다시 돌리면 보입니다.';
  }
  if (t.testFile) return '이 테스트가 불러오는 파일로 이어진 화면이 없습니다. 화면 넷 이상이 함께 쓰는 파일과 찾지 못한 파일로는 잇지 않습니다.';
  if (t.format !== 'vitest') return `이 결과 형식(${t.format})에는 테스트가 불러오는 파일이 적혀 있지 않아, 어느 화면에 이어지는지 읽지 못했습니다.`;
  const reason = (state.data.tests.importNotices ?? []).find((n) => n.file === t.file)?.reason;
  return `테스트가 불러오는 파일을 읽지 못했습니다.${reason ? ` ${reason}.` : ''}`;
}

const isPickable = (p) => !p.entry.judgment && opensOnPage(p.id);

function redrawBulk(focusSelector) {
  renderUntaggedCenter();
  document.querySelector(`#center ${focusSelector}`)?.focus();
}

// 고를 짝이 남지 않아 단추 줄이 사라지면 짝 묶음의 제목으로 간다.
function focusBulk(kind) {
  const pairs = document.querySelector('#center .test-pairs');
  const bar = pairs?.querySelector('.bulk-bar');
  (bar ? bar.querySelector(`button.${kind}:enabled`) ?? bar.querySelector('input') : pairs?.querySelector('h2'))?.focus();
}

// 찾기 칸처럼 다시 그려도 남는 칸의 초점은 단추로 가져오지 않는다. 가져오면 치던 Space 나 Enter 가 단추를 다시 누른다.
function showBulkResult(kind) {
  const focused = document.activeElement;
  render();
  if (!focused || focused === document.body || !focused.isConnected) focusBulk(kind);
}

function setPick(bulk, id, on) {
  if (on) bulk.picked.add(id); else bulk.picked.delete(id);
  redrawBulk(`input.pick[data-pair="${CSS.escape(id)}"]`);
}

const bulkButtonOff = (count) => state.bulkBusy || state.ending || !count;
const pickedPairs = (t, bulk) => pairsOf(t).filter((p) => isPickable(p) && bulk.picked.has(p.id));

function askExcludePicked(t, bulk) {
  askExclude({
    test: t,
    nodeIds: () => pickedPairs(t, bulk).map((p) => p.id),
    save: async (reason) => {
      const failure = await saveBulk(t, bulk, 'discard', reason);
      if (failure) render();
      return failure;
    },
    done: () => showBulkResult('discard'),
    refocus: () => document.querySelector('#center .bulk-bar button.discard')?.focus(),
  });
}

function bulkBar(t, pickable, bulk) {
  const count = pickable.filter((p) => bulk.picked.has(p.id)).length;
  const off = bulkButtonOff(count);
  return h('div', { class: 'bulk-bar' },
    h('label', {}, h('input', { type: 'checkbox', class: 'pick-all', checked: count === pickable.length, disabled: state.bulkBusy,
      onchange: (e) => { bulk.picked = new Set(e.target.checked ? pickable.map((p) => p.id) : []); redrawBulk('input.pick-all'); } }), ' 모두 고르기'),
    h('button', { class: 'discard', title: '고른 짝을 다시 보이지 않게 합니다. 까닭을 적어야 합니다', disabled: off, onclick: () => askExcludePicked(t, bulk) }, `제외 (${count})`),
    h('button', { class: 'hand-over', title: '고른 짝을 그 화면이나 호출의 테스트로 보고, 태그를 달도록 작업 목록에 올립니다', disabled: off, onclick: async () => { await saveBulk(t, bulk, 'hand-over', ''); showBulkResult('hand-over'); } }, `포함 (${count})`),
    bulk.error ? h('p', { class: 'error bulk-error' }, bulk.error) : null);
}

function renderUntaggedCenter() {
  clearCenterHead();
  const center = document.getElementById('center-body');
  if (untaggedListMissing()) return fill(center, h('p', { class: 'muted' }, '이 tests.json 에는 태그 없는 테스트 목록이 없습니다. duru rebuild 를 다시 실행하세요.'));
  const t = untaggedTests().find((x) => untaggedKey(x) === state.untaggedTest);
  if (!t) return fill(center, h('p', { class: 'muted' }, '태그 없는 테스트가 없습니다.'));
  const pairs = pairsOf(t);
  const pickable = pairs.filter(isPickable);
  const bulk = state.bulk;
  for (const id of bulk.picked) if (!pickable.some((p) => p.id === id)) bulk.picked.delete(id);
  const pickRow = (p) => h('div', { class: 'pair-row' },
    isPickable(p)
      ? h('input', { type: 'checkbox', class: 'pick', 'data-pair': p.id, checked: bulk.picked.has(p.id), disabled: state.bulkBusy, onchange: (e) => setPick(bulk, p.id, e.target.checked) })
      : h('span', { class: 'pick-space' }),
    pairItem(p));
  fill(center,
    h('div', { class: 'title-row' }, h('h3', {}, t.title), h('span', { class: `chip ${t.status}` }, TEST_STATUS[t.status])),
    h('div', { class: 'muted mono' }, testPlace(t)),
    h('div', { class: 'muted' }, `${t.format} · ${t.source}`),
    h('div', { class: 'test-pairs' },
      h('h2', { tabindex: '-1' }, `이 테스트와 화면·호출의 짝 ${pairs.length}`),
      pickable.length ? bulkBar(t, pickable, bulk) : null,
      pairs.length
        ? h('div', { class: 'story-path' }, pairs.map(pickRow))
        : h('p', { class: 'muted no-screens' }, noScreensText(t))),
    t.unmatched?.length ? h('div', { class: 'unmatched' },
      h('h2', {}, `맵에 맞는 화면이 없는 주소 ${t.unmatched.length}`),
      h('p', { class: 'muted' }, '이 테스트가 도는 동안 열었지만 맵의 어느 화면에도 맞지 않은 주소입니다. 맵을 만든 클라이언트와 테스트가 돈 클라이언트가 다르면 여기에 쌓입니다.'),
      h('ul', { class: 'plain' }, t.unmatched.map((url) => h('li', { class: 'mono' }, url)))) : null);
}

const storyPath = (st, stepRanges) => [
  h('h2', {}, `화면 순서 ${st.steps.length}`),
  h('div', { class: 'story-path' }, st.steps.flatMap((step, i) => [i > 0 ? linkItem(st.links[i - 1]) : null, stepItem(step, i, stepRanges?.[i])])),
];

function renderStoryCenter() {
  clearCenterHead();
  const center = document.getElementById('center-body');
  if (state.composing) return fill(center, composeCenter());
  const c = candidateOf();
  if (c) {
    return fill(center,
      h('div', { class: 'title-row' }, h('h3', {}, c.name), storyChips(c)),
      h('div', { class: 'muted mono source', title: '후보가 나온 방문 기록과 단계' }, sourceText(c.source)),
      storyPath(c, c.stepRanges));
  }
  const st = storyOf();
  if (!st && state.story) return fill(center, h('h3', {}, state.story), h('p', { class: 'muted', title: '스토리 파일을 읽지 못했거나 맵이 오래되어 경로를 맞춰 보지 못했습니다' }, '경로 판정 없음'));
  if (!st) return fill(center, h('p', { class: 'muted' }, '스토리가 없습니다.'));
  const storyTests = ownTests(state.data.tests.stories, st.id);
  fill(center,
    h('div', { class: 'title-row' }, h('h3', {}, st.name), statusChip(st), storyChips(st)),
    h('div', { class: 'muted mono' }, `${st.id} · ${st.file}`),
    st.source ? h('div', { class: 'muted mono source', title: '받은 후보가 나온 방문 기록과 단계' }, sourceText(st.source)) : null,
    h('div', { class: 'muted' }, `${st.author} · ${storyDate(st.date)}`),
    st.memo ? h('p', { class: 'memo' }, st.memo) : null,
    h('div', { class: 'story-tests' }, h('h2', {}, `스토리 테스트 ${storyTests.length}`),
      storyTests.length ? storyTests.map((t) => testItem(t, { depth: true })) : h('p', { class: 'muted' }, '없음')),
    storyPath(st));
}

const stepLabel = (r) => (r.kind === 'start' ? `첫 화면 ${screenLabel(r.screen)}`
  : r.kind === 'route' ? `${screenLabel(r.screen)} 라우트` : `${screenLabel(r.from)} → ${screenLabel(r.to)}`);

function reachItem(r, scope) {
  if (r.kind === 'start') {
    return [h('h3', {}, stepLabel(r)),
      h('div', {}, '열리려면 필요한 것 ', r.kinds.map(kindChip)),
      r.roleValues ? h('div', {}, `열 수 있는 역할 ${r.roleValues.join(', ')}`)
        : r.roleValues === null ? h('div', { class: 'muted' }, '역할 미확인') : null,
      h('div', { class: 'muted' }, '들어오는 링크: 화면 목록에서')];
  }
  if (r.kind === 'route') {
    return [h('h3', {}, stepLabel(r)), h('code', {}, `${state.data.routesFile}:${r.line}`), ...r.guards.map((g) => accessGuard(g, scope, state.storyOpen))];
  }
  return [h('h3', {}, stepLabel(r)),
    r.ways.length > 1 ? h('div', { class: 'muted' }, `링크 ${r.ways.length}개 중 하나`) : null,
    h('ul', { class: 'plain ways' }, r.ways.map((w, i) => wayItem(w, `${scope}\n${i}`))),
    ...(r.unknownLinks ? skippedLinks(r.unknownLinks) : [])];
}

function storyProblems(st) {
  const broken = st.links.filter((l) => l.verdict === 'broken').length;
  return [
    broken ? ['unreachable', `도달 불가 · 링크 없음 ${broken}곳`] : null,
    st.detached ? ['unjudged', '판정 못 함 · 화면 없음'] : null,
    st.unjudged ? ['unjudged', '판정 못 함 · 주소 못 읽은 링크'] : null,
  ].filter(Boolean);
}

function reachBlock(st, key) {
  return [
    storySummary(st.reach),
    h('details', { class: 'reach-raw', open: state.storyOpen.has(key), ontoggle: rememberOpen(state.storyOpen, key) },
      h('summary', {}, '조건식과 위치'),
      h('ul', { class: 'plain reach' }, st.reach.map((r, i) => h('li', { class: `reach-${r.kind}` }, reachItem(r, `${key}\n${i}`))))),
  ];
}

const STORY_ID = /^[a-z0-9_-]+$/;
const slugOf = (name) => name.toLowerCase().replace(/[^a-z0-9_-]+/g, '-').replace(/^-+|-+$/g, '');
const syncButton = (e, ready) => { e.target.closest('.story-form').querySelector('button').disabled = !ready(); };
const storyForm = (...children) => h('fieldset', { class: 'story-form', disabled: state.storyWriting }, ...children);
const field = (name, control, ...rest) => h('label', { class: 'field' }, h('span', {}, name), control, ...rest);
const storyErrorLine = () => (state.storyError ? h('p', { class: 'error story-error' }, state.storyError) : null);

function candidateActions(c) {
  const d = (state.candidateDraft ??= { reason: '' });
  const canDiscard = () => Boolean(d.reason.trim());
  return [
    h('h2', {}, '받기'),
    storyForm(h('div', { class: 'accepts' },
      h('button', { class: 'accept', title: '이 화면 순서로 스토리 파일을 씁니다.', onclick: acceptChosen }, '스토리로 받기'),
      h('button', { class: 'accept-edited', title: 'ID 와 이름을 고친 뒤에 받습니다.', onclick: () => askAccept(c, 'button.accept-edited', null) }, '고쳐서 받기'))),
    h('h2', {}, '버리기'),
    storyForm(
      field('까닭', h('input', { type: 'text', id: 'discard-reason', value: d.reason, oninput: (e) => { d.reason = e.target.value; syncButton(e, canDiscard); } })),
      h('button', { class: 'discard', disabled: !canDiscard(), title: '버린 후보 파일을 남기고, 같은 화면 순서는 다시 후보로 내지 않습니다.', onclick: discardChosen }, '버리기')),
    storyErrorLine(),
  ];
}

function storyEdit(st) {
  if (state.storyEdit?.id !== st.id) state.storyEdit = { id: st.id, name: st.name, memo: st.memo };
  const d = state.storyEdit;
  const canSave = () => Boolean(d.name.trim());
  return [
    h('h2', {}, '이름 · 메모'),
    storyForm(
      field('이름', h('input', { type: 'text', id: 'story-name', value: d.name, oninput: (e) => { d.name = e.target.value; syncButton(e, canSave); } })),
      field('메모', h('textarea', { id: 'story-memo', oninput: (e) => { d.memo = e.target.value; } }, d.memo)),
      h('button', { class: 'save-story', disabled: !canSave(), title: '스토리 파일의 이름과 메모를 고쳐 씁니다.', onclick: saveStoryEdit }, '저장')),
    storyErrorLine(),
  ];
}

async function writeStories(url, body) {
  state.storyError = null;
  state.storyWriting = true;
  renderRight();
  let written = false;
  try {
    const res = await fetch(url, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
    if (!res.ok) throw new Error(await res.text());
    written = true;
    await load();
  } catch (err) {
    state.storyError = written ? `저장했지만 다시 읽지 못했습니다: ${err.message}` : `저장하지 못했습니다: ${err.message}`;
  } finally {
    state.storyWriting = false;
  }
  if (!written) renderRight();
  return written;
}

const storyIdProblem = (id) => (state.data.stories.list.some((st) => st.id === id) ? '같은 ID 의 스토리가 이미 있습니다.' : STORY_ID.test(id) ? null : '영문 소문자, 숫자, -, _ 만 쓸 수 있습니다.');

async function acceptAs(c, id, name) {
  if (!(await writeStories('/api/candidates/accept', { record: c.source.record, id, name }))) return false;
  state.candidate = null;
  state.candidateDraft = null;
  state.story = id;
  state.storyDraft = null;
  state.error = null;
  render();
  return true;
}

function takeStoryError() {
  const refused = state.storyError;
  state.storyError = null;
  renderRight();
  return refused;
}

async function acceptChosen() {
  const c = candidateOf();
  if (!c) return;
  if (storyIdProblem(slugOf(c.name))) return askAccept(c, 'button.accept', null);
  if (await acceptAs(c, slugOf(c.name), c.name)) return;
  if (state.candidate === c.source.record) askAccept(c, 'button.accept', takeStoryError());
}

const acceptDialog = document.getElementById('accept-ask');
const acceptPart = (selector) => acceptDialog.querySelector(selector);
let acceptJob = null;

function drawAccept() {
  const { busy, error } = acceptJob;
  const problem = storyIdProblem(acceptPart('#accept-id').value);
  acceptPart('#accept-id').readOnly = busy;
  acceptPart('#accept-name').readOnly = busy;
  acceptPart('.invalid').textContent = problem ?? '';
  acceptPart('.invalid').hidden = !problem;
  acceptPart('button.cancel').disabled = busy;
  acceptPart('button.accept').disabled = busy || Boolean(problem) || !acceptPart('#accept-name').value.trim();
  acceptPart('.error').textContent = error ?? '';
  acceptPart('.error').hidden = !error;
}

function askAccept(candidate, opener, error) {
  acceptJob = { candidate, opener, busy: false, error };
  fill(acceptPart('.candidate'), h('span', { class: 'muted' }, '후보 '), candidate.name);
  acceptPart('#accept-id').value = slugOf(candidate.name);
  acceptPart('#accept-name').value = candidate.name;
  drawAccept();
  acceptDialog.showModal();
  acceptPart('#accept-id').select();
}

function closeAccept() {
  const { opener } = acceptJob;
  acceptJob = null;
  acceptDialog.close();
  document.querySelector(`#right ${opener}`)?.focus();
}

async function confirmAccept() {
  const job = acceptJob;
  Object.assign(job, { busy: true, error: null });
  drawAccept();
  if (await acceptAs(job.candidate, acceptPart('#accept-id').value, acceptPart('#accept-name').value.trim())) return closeAccept();
  Object.assign(job, { busy: false, error: takeStoryError() });
  drawAccept();
  acceptPart('#accept-id').focus();
}

acceptDialog.addEventListener('input', drawAccept);
acceptPart('button.accept').addEventListener('click', confirmAccept);
acceptPart('button.cancel').addEventListener('click', closeAccept);
acceptDialog.addEventListener('keydown', (e) => {
  const send = e.key === 'Enter' && e.target.matches('input');
  if ((e.key !== 'Escape' && !send) || e.isComposing) return;
  e.preventDefault();
  if (e.repeat) return;
  acceptPart(send ? 'button.accept' : 'button.cancel').click();
});

async function discardChosen() {
  const c = candidateOf();
  if (!c) return;
  const at = state.data.candidates.list.indexOf(c);
  if (!(await writeStories('/api/candidates/discard', { record: c.source.record, reason: state.candidateDraft.reason }))) return;
  const { list } = state.data.candidates;
  state.candidate = (list[at] ?? list[at - 1])?.source.record ?? null;
  state.candidateDraft = null;
  render();
}

async function saveStoryEdit() {
  const st = storyOf();
  if (!st || !(await writeStories('/api/stories/edit', { id: st.id, name: state.storyEdit.name, memo: state.storyEdit.memo }))) return;
  state.storyEdit = null;
  render();
}

function reachSection(st, key) {
  const problems = storyProblems(st);
  return [
    (problems.length ? problems : [['reachable', '도달 가능']]).map(([cls, text]) => h('p', { class: `verdict ${cls}` }, text)),
    st.links.some((l) => l.ways.length && l.unknownLinks) ? h('p', { class: 'muted skipped' }, '주소 못 읽은 링크 빼고 판정') : null,
    h('h2', {}, '사전 조건'),
    st.reach.length ? reachBlock(st, key) : h('p', { class: 'muted' }, problems.length ? '판정한 구간에 조건 없음' : '조건 없음'),
  ];
}

// 링크에 조건이 없는 예전 맵으로는 화면 순서를 대조하지 못한다.
const oldMap = () => state.data.map.screens.some((sc) => sc.links.some((l) => !Array.isArray(l.conditions)));
const newCompose = () => ({ screens: [], at: null, id: '', name: '', memo: '', checked: null, turn: 0, error: null, refused: null, query: '' });
const composeShown = () => state.composing && state.side === 'stories' && state.view === 'list';
const checkedCompose = (c) => (c.checked && c.checked.screens.join('\n') === c.screens.join('\n') ? c.checked : null);
const repeatedStep = (screens) => screens.some((id, i) => i > 0 && id === screens[i - 1]);

function startCompose() {
  state.compose ??= newCompose();
  state.composing = true;
  state.candidate = null;
  state.storyError = null;
  render();
}

function leaveCompose() {
  state.composing = false;
  state.storyError = null;
  render();
}

function dropCompose() {
  state.compose = null;
  leaveCompose();
}

const canSaveCompose = (c) => STORY_ID.test(c.id) && Boolean(c.name.trim()) && c.screens.length > 0 && !repeatedStep(c.screens);

function composeReach(c) {
  const checked = checkedCompose(c);
  return [
    ...(checked ? reachSection(checked, 'compose') : [h('p', { class: 'muted' }, c.screens.length ? '경로를 맞춰 보는 중입니다.' : '화면을 넣으면 여기에서 끝까지 갈 수 있는지와 사전 조건을 보입니다.')]),
    repeatedStep(c.screens) ? h('p', { class: 'error repeated' }, '같은 화면이 이어진 자리가 있어 저장할 수 없습니다.') : null,
  ];
}

// 이름을 치는 동안 판정이 도착해도 입력 칸은 다시 만들지 않는다. 다시 만들면 조합 중이던 한글이 끊긴다.
function renderCompose(focus) {
  if (!composeShown()) return;
  renderPickList();
  renderCenter();
  const reach = document.getElementById('compose-reach');
  if (reach) {
    fill(reach, ...composeReach(state.compose));
    document.querySelector('#right-info button.save-compose').disabled = !canSaveCompose(state.compose);
  } else renderRight();
  if (focus) (focus.map((selector) => document.querySelector(`#center ${selector}`)).find((el) => el && !el.disabled))?.focus();
}

async function checkCompose(focus) {
  const c = state.compose;
  const turn = ++c.turn;
  renderCompose(focus);
  if (!c.screens.length) return;
  let checked = null;
  let error = null;
  try {
    const res = await fetch('/api/stories/check', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ screens: c.screens }) });
    if (!res.ok) throw new Error(await res.text());
    checked = await res.json();
  } catch (err) {
    error = `경로를 맞춰 보지 못했습니다: ${err.message}`;
  }
  if (state.compose !== c || turn !== c.turn) return;
  Object.assign(c, { checked, error });
  const focused = document.activeElement;
  const step = focused?.closest?.('#center .compose-step');
  renderCompose(step ? [`.compose-step[data-step="${step.dataset.step}"] button.${focused.className}`] : focused?.matches?.('#center .story-path') ? ['.story-path'] : null);
}

function changeCompose(edit, focus) {
  const c = state.compose;
  Object.assign(c, { refused: null, error: null });
  edit(c);
  checkCompose(focus);
}

function addComposeScreen(id) {
  const c = state.compose;
  const at = c.at ?? c.screens.length;
  if (c.screens[at - 1] === id || c.screens[at] === id) {
    c.refused = '같은 화면을 이어서 넣을 수 없습니다.';
    return renderCompose();
  }
  changeCompose((d) => {
    d.screens.splice(at, 0, id);
    if (d.at !== null) d.at += 1;
  });
}

function moveComposeStep(from, to, focus) {
  changeCompose((d) => {
    const [id] = d.screens.splice(from, 1);
    d.screens.splice(to, 0, id);
    d.at = null;
  }, focus);
}

const STEP_DRAG = 'application/x-duru-step';

function composeStep(id, i, c) {
  const stepButtons = (step) => ['up', 'down'].map((cls) => `.compose-step[data-step="${step}"] button.${cls}`);
  const last = i === c.screens.length - 1;
  return h('div', {
    class: 'step compose-step',
    'data-step': i,
    draggable: 'true',
    ondragstart: (e) => { e.dataTransfer.setData(STEP_DRAG, String(i)); e.dataTransfer.effectAllowed = 'move'; },
    ondragover: (e) => e.preventDefault(),
    ondrop: (e) => {
      e.preventDefault();
      const dragged = e.dataTransfer.getData(STEP_DRAG);
      const from = Number(dragged);
      if (dragged !== '' && Number.isInteger(from) && from !== i && from >= 0 && from < c.screens.length) moveComposeStep(from, i);
    },
  },
    h('span', { class: 'grip', title: '끌어서 순서를 바꿉니다', 'aria-hidden': 'true' }, '⠿'),
    h('span', { class: 'no' }, i + 1),
    h('span', { class: 'name' }, screenHead(screenOf(id))),
    h('span', { class: 'step-acts' },
      h('button', { class: 'up', disabled: i === 0, title: '한 단계 위로 옮깁니다', onclick: () => moveComposeStep(i, i - 1, stepButtons(i - 1)) }, '위로'),
      h('button', { class: 'down', disabled: last, title: '한 단계 아래로 옮깁니다', onclick: () => moveComposeStep(i, i + 1, stepButtons(i + 1).reverse()) }, '아래로'),
      h('button', { class: 'insert-before', disabled: c.at === i, title: '다음에 고르는 화면을 이 단계 앞에 넣습니다', onclick: () => { c.at = i; renderCompose([`.compose-step[data-step="${i}"] button.up`, `.compose-step[data-step="${i}"] button.down`]); } }, '앞에 넣기'),
      h('button', { class: 'remove', title: '이 단계를 뺍니다', onclick: () => changeCompose((d) => { d.screens.splice(i, 1); d.at = null; }, ['.story-path']) }, '빼기')));
}

function composeCenter() {
  const c = state.compose;
  const checked = checkedCompose(c);
  const insertMark = h('div', { class: 'insert-mark' }, '다음에 고르는 화면이 여기 들어갑니다',
    h('button', { class: 'insert-at-end', onclick: () => { c.at = null; renderCompose(); } }, '끝에 넣기'));
  const pending = h('div', { class: 'link l-pending' }, c.error ? '판정 못 함' : '맞춰 보는 중');
  return [
    h('div', { class: 'title-row' }, h('h3', {}, c.name.trim() || '새 스토리'), checked ? storyChips(checked) : null),
    h('p', { class: 'muted' }, '왼쪽 목록에서 화면을 누르면 차례로 단계가 됩니다. 단계는 끌거나 「위로」·「아래로」로 옮깁니다. 순서를 바꿀 때마다 이웃한 화면 사이의 링크를 다시 맞춰 봅니다.'),
    c.refused ?? c.error ? h('p', { class: 'error compose-error' }, c.refused ?? c.error) : null,
    h('h2', {}, `화면 순서 ${c.screens.length}`),
    c.screens.length
      ? h('div', { class: 'story-path', tabindex: '-1' }, c.screens.flatMap((id, i) => [
          i > 0 ? (checked ? linkItem(checked.links[i - 1]) : pending.cloneNode(true)) : null,
          c.at === i ? insertMark : null,
          composeStep(id, i, c),
        ]))
      : h('p', { class: 'muted no-steps' }, '아직 넣은 화면이 없습니다.'),
  ];
}

function composeRight(info, dock) {
  const c = state.compose;
  const badId = () => Boolean(c.id) && !STORY_ID.test(c.id);
  const canSave = () => canSaveCompose(c);
  fill(dock);
  fill(info,
    h('div', { id: 'compose-reach' }, ...composeReach(c)),
    h('h2', {}, '새 스토리 저장'),
    storyForm(
      field('ID', h('input', { type: 'text', id: 'compose-id', value: c.id, oninput: (e) => {
        c.id = e.target.value;
        e.target.nextElementSibling.hidden = !badId();
        syncButton(e, canSave);
      } }), h('small', { class: 'invalid', hidden: !badId() }, '영문 소문자, 숫자, -, _ 만 쓸 수 있습니다.')),
      field('이름', h('input', { type: 'text', id: 'compose-name', value: c.name, oninput: (e) => { c.name = e.target.value; syncButton(e, canSave); } })),
      field('메모', h('textarea', { id: 'compose-memo', oninput: (e) => { c.memo = e.target.value; } }, c.memo)),
      h('button', { class: 'save-compose', disabled: !canSave(), title: '이 화면 순서로 스토리 파일을 씁니다.', onclick: saveCompose }, '스토리 저장'),
      h('button', { class: 'drop-draft', title: '쓰던 순서와 이름을 버리고 스토리 목록으로 돌아갑니다', onclick: dropCompose }, '쓰던 것 버리기')),
    storyErrorLine());
}

async function saveCompose() {
  const c = state.compose;
  if (!(await writeStories('/api/stories/add', { id: c.id, name: c.name, memo: c.memo, screens: c.screens }))) return;
  state.compose = null;
  state.composing = false;
  state.story = c.id;
  state.storyDraft = null;
  state.error = null;
  render();
}

function renderStoryRight(info, dock) {
  if (state.composing) return composeRight(info, dock);
  const c = candidateOf();
  if (c) {
    fill(dock);
    return fill(info, ...reachSection(c, `candidate\n${c.source.record}`), ...candidateActions(c));
  }
  const st = storyOf();
  if (!st) {
    fill(info, storyErrorLine());
    return fill(dock, state.story ? markForm({ story: state.story }, 'storyDraft', '스토리') : null);
  }
  fill(dock, markForm({ story: st.id }, 'storyDraft', '스토리'));
  fill(info, ...reachSection(st, `story\n${st.id}`), ...storyEdit(st));
}

function renderCenter() {
  if (state.side === 'stories') return renderStoryCenter();
  if (state.side === 'untagged') return renderUntaggedCenter();
  const center = document.getElementById('center-body');
  const s = state.data.map.screens.find((x) => x.id === state.selected);
  renderCenterHead(s);
  if (!s) return fill(center, h('p', { class: 'muted' }, '화면이 없습니다.'));
  const tests = testsOf(s.id);
  const rows = [{ label: '화면 전체', target: { node: s.id }, tests: [] }]
    .concat(state.data.depths.map((d) => ({ label: DEPTH_LABELS[d], target: { node: s.id, depth: d }, tests: tests.filter((t) => t.depth === d) })));
  fill(center,
    h('table', {},
      h('thead', {}, h('tr', {}, h('th', {}, '깊이'), h('th', {}, '테스트'), h('th', {}, '표시'))),
      h('tbody', {}, rows.map((r) => h('tr', {
        class: keyOf(r.target) === keyOf(state.target) ? 'selected' : '',
        onclick: () => selectTarget(r.target),
      },
        h('td', { class: 'depth' }, r.label),
        h('td', {}, r.target.depth ? (r.tests.length ? r.tests.map(testItem) : h('span', { class: 'muted' }, '없음')) : h('span', { class: 'muted' }, `테스트 ${tests.length}개`)),
        h('td', { class: 'mark' }, markChip(markOf(r.target)) ?? h('span', { class: 'muted' }, '—')))))),
    strayJudgmentError(s),
    untaggedPairs(s.id),
    callTable(s),
  );
}

const serverText = (server) => (server.status === 'match' && server.labels?.length
  ? `${SERVER_STATUS.match} (${server.labels.join(', ')})`
  : SERVER_STATUS[server.status] ?? server.status);

function verdictChip(server) {
  return h('span', { class: `chip v-${server.status}`, title: server.candidates ? `서버에는 ${server.candidates.join(' / ')}` : null }, serverText(server));
}

function callRows(s) {
  const rows = [];
  const seen = new Set();
  for (const c of s.apiCalls) {
    const site = `${c.fn} · ${c.file}:${c.line}`;
    if (!c.endpoints) {
      rows.push({ site, problem: 'API 함수를 찾지 못함' });
      continue;
    }
    for (const e of c.endpoints) {
      if (!e.callId) rows.push({ site, problem: `${e.method ?? '?'} ${e.url ?? '주소를 계산하지 못함'}`, server: e.server });
      else if (!seen.has(e.callId)) {
        seen.add(e.callId);
        rows.push({ call: callOf(e.callId) });
      }
    }
  }
  return rows;
}

function countsOf(tests) {
  const counts = { pass: 0, fail: 0, pending: 0 };
  for (const t of tests) counts[t.status] += 1;
  return tests.length ? countText(counts) : h('span', { class: 'muted' }, '—');
}

function cell(target, tests, empty) {
  return h('td', {
    class: `cell${keyOf(target) === keyOf(state.target) ? ' selected' : ''}`,
    onclick: () => selectTarget(target),
  },
    h('div', {}, !tests.length && empty ? h('span', { class: 'none' }, empty) : countsOf(tests)),
    markChip(markOf(target)));
}

// 「옵션 지정 없음」 줄은 표시 대상이 아니라서 칸을 눌러도 고를 수 없다.
function optionRows(s, call, depths) {
  const options = optionsOf(s, call.id);
  if (!options.length) return [];
  const tests = testsOf(call.id);
  const byDepth = (list) => depths.map((d) => list.filter((t) => t.depth === d));
  const rows = options.flatMap((o) => [true, false].map((value) => {
    const target = { node: call.id, option: { key: o.key, value } };
    const matching = hasOption(tests, o.key, value);
    const split = byDepth(matching);
    return h('tr', { class: `option${matching.length ? '' : ' gap'}` },
      h('td', { class: 'call' }, h('div', {}, optionLabel(target.option)),
        o.sources.includes('config') ? h('span', { class: 'chip config', title: '설정 bodyOptions 에 적은 옵션' }, '설정') : null),
      cell(target, matching, '테스트 없음'),
      depths.map((d, i) => cell({ ...target, depth: d }, split[i])));
  }));
  const unspecified = tests.filter((t) => !t.options?.length);
  rows.push(h('tr', { class: 'option' },
    h('td', { class: 'call', title: '옵션 태그를 달지 않은 테스트' }, h('div', {}, '옵션 지정 없음')),
    [unspecified, ...byDepth(unspecified)].map((list) => h('td', { class: 'count' }, h('div', {}, countsOf(list))))));
  return rows;
}

// 같은 빈자리를 옵션을 받는 호출의 옵션 칸에서 표시하므로, 여기서도 표시를 받으면 작업 목록에 두 번 오른다. 그래서 이 줄은 눌러도 고를 수 없다.
function resultOptionRows(call, depths) {
  const { callLinks = [], unknownCallLinks = [] } = state.data.map;
  return [...callLinks, ...unknownCallLinks].filter((l) => l.to === call.id).flatMap((l) => {
    const from = callOf(l.from);
    const fromId = opensOnPage(l.from)
      ? h('a', { href: '#', class: 'mono', title: '이 호출을 부르는 화면을 열고 이 호출을 고릅니다', onclick: (e) => { e.preventDefault(); openCall(l.from); } }, l.from)
      : h('span', { class: 'mono' }, l.from);
    const head = h('tr', { class: 'option result-head' },
      h('td', { class: 'call', colspan: depths.length + 2 },
        h('div', {}, h('span', { class: 'result-title' }, '이 결과를 바꾸는 옵션'), ' ', fromId, from ? null : h('span', { class: 'chip l-off-map' }, '맵에 없는 호출')),
        h('div', { class: 'muted' }, l.note)));
    if (!from) return [head];
    if (!from.options.length) return [head, h('tr', { class: 'option' }, h('td', { class: 'call' }, h('div', { class: 'muted' }, '옵션 없음')), h('td', { colspan: depths.length + 1 }))];
    const output = testsOf(l.from).filter((t) => t.depth === 'output');
    return [head, ...from.options.flatMap((o) => [true, false].map((value) => {
      const matching = hasOption(output, o.key, value);
      return h('tr', { class: `option${matching.length ? '' : ' gap'}` },
        h('td', { class: 'call' }, h('div', {}, optionLabel({ key: o.key, value }))),
        h('td', {}),
        depths.map((d) => (d === 'output'
          ? h('td', { class: 'count' }, h('div', {}, matching.length ? countsOf(matching) : h('span', { class: 'none' }, '테스트 없음')))
          : h('td', {}))));
    }))];
  });
}

function callTable(s) {
  const rows = callRows(s);
  if (!rows.length) return [h('h2', {}, 'API 호출'), h('p', { class: 'muted' }, '부르는 API 호출이 없습니다.')];
  const depths = state.data.depths;
  return [
    h('h2', {}, `API 호출 ${rows.length}`, listAbsentNote('서버 목록 없음')),
    h('table', { class: 'calls' },
      h('thead', {}, h('tr', {}, h('th', {}, '호출'), h('th', {}, '전체'), depths.map((d) => h('th', {}, DEPTH_LABELS[d])))),
      h('tbody', {}, rows.flatMap((r) => {
        if (!r.call) {
          return h('tr', {},
            h('td', { class: 'call' }, h('div', { class: 'mono' }, r.problem), r.server ? verdictChip(r.server) : null, h('div', { class: 'muted mono' }, r.site)),
            h('td', { class: 'muted', colspan: depths.length + 1 }, '호출 노드가 없어 테스트를 붙이거나 표시할 수 없습니다'));
        }

}

const inheritedText = (guard, via) => `${guard} (${via} 로 물려받음)`;

function guardList(item) {
  const own = item.guards.map((g) => h('code', { class: 'guard' }, g));
  const inherited = (item.inheritedGuards ?? []).flatMap((ig) => ig.guards.map((g) => h('code', { class: 'guard' }, inheritedText(g, ig.via))));
  return own.length || inherited.length ? [...own, ...inherited] : [h('span', { class: 'muted' }, '조건 없음')];
}

function renderRight() {
  const info = document.getElementById('right-info');
  const dock = document.getElementById('right-dock');
  if (state.side === 'untagged') {
    fill(info);
    return fill(dock);
  }
  const view = state.side !== 'stories' ? `${state.selected}\n${state.target?.node}` : state.composing ? 'compose' : state.candidate ? `candidate(${state.candidate})` : `story(${state.story})`;
  const shown = shownTarget();
  const dockKey = shown ? keyOf(shown) : null;
  if (dockKey !== state.dockKey) state.historyOpen = false;
  state.dockKey = dockKey;
  (state.side === 'stories' ? renderStoryRight : renderScreenRight)(info, dock);
  if (view !== state.rightView) {
    info.scrollTop = 0;
    document.getElementById('right').scrollTop = 0;
  }
  state.rightView = view;
}

function renderScreenRight(info, dock) {
  const s = state.data.map.screens.find((x) => x.id === state.selected);
  if (!s) {
    fill(info);
    return fill(dock);
  }
  const call = state.target.node === s.id ? null : callOf(state.target.node);
  const { option, depth } = state.target;
  const targetLabel = [option && optionLabel(option), depth && `${DEPTH_LABELS[depth]} 깊이`].filter(Boolean).join(' · ') || (call ? '호출 전체' : '화면 전체');
  fill(info,
    call ? null : openSummary(s),
    call ? h('div', { class: 'target-id' }, h('div', { class: 'mono' }, call.id), h('strong', {}, targetLabel)) : null,
    call ? callDetails(call, s) : screenDetails(s),

  fill(dock, markForm(state.target, 'draft', targetLabel));
}

function markForm(target, draftKey, label) {
  const mark = markOf(target);
  state[draftKey] ??= { status: mark?.current.status ?? null, note: '' };
  const draft = state[draftKey];
  const history = mark?.history.length ? mark.history : null;
  const historyList = history && h('ul', { class: 'plain history' }, history.map((m) => h('li', {},
    h('span', { class: `chip ${m.status}` }, MARK_STATUS[m.status]), ' ', h('span', { class: 'muted' }, signedAt(m)),
    m.note ? h('div', {}, m.note) : null)));

    state.historyOpen = !state.historyOpen;
    applyHistoryFold(historyToggle, historyList);
  } }, `이력 ${history.length}`);
  if (history) applyHistoryFold(historyToggle, historyList);
  const save = h('button', { class: 'save', disabled: !draft.status, onclick: () => saveMark(target, draftKey) }, '표시 남기기');

    h('h2', {}, '표시 — ', label),
    h('div', { class: 'statuses' }, statuses),
    h('textarea', { placeholder: '메모', oninput: (e) => { draft.note = e.target.value; } }, draft.note),
    state.error ? h('p', { class: 'error' }, state.error) : null,
    h('div', { class: 'save-row' }, save, historyToggle),
    historyList);
}

function applyHistoryFold(toggle, list) {
  toggle.setAttribute('aria-expanded', String(state.historyOpen));
