<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>duru 리뷰</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --line: #e2e1dc; --accent: #2f5fd0;
    --selected: #e8eefc; --pass: #1f7a3d; --fail: #c0392b; --pending: #a86a00;
    --more: #b3541e; --missing: #c0392b; --fine: #1f7a3d; --changed: #7c3aed; --changed-bg: #f3ecff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615; --panel: #1f1f1d; --text: #e9e8e4; --muted: #9a9993; --line: #34332f; --accent: #7fa2ff;
      --selected: #26304a; --pass: #5cc185; --fail: #ff7b6b; --pending: #e0b050;
      --more: #f0935a; --missing: #ff7b6b; --fine: #5cc185; --changed: #b18cff; --changed-bg: #2a2140;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; font: 14px/1.5 system-ui, -apple-system, "Segoe UI", "Noto Sans KR", sans-serif; background: var(--bg); color: var(--text); }
  header { position: relative; z-index: 10; display: flex; align-items: center; gap: 16px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 16px; margin: 0; }
  header .meta { color: var(--muted); font-size: 12px; }
  header .meta .state { background: none; font: inherit; line-height: 14px; color: var(--more); margin-left: 6px; cursor: help; }
  header .state-tip { display: none; position: absolute; top: 100%; margin-top: 6px; width: max-content; max-width: min(420px, calc(100vw - 32px)); padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); box-shadow: 0 4px 14px rgba(0, 0, 0, .18); font-size: 12px; color: var(--muted); }
  header .state:hover + .state-tip, header .state:focus + .state-tip { display: block; }
  .list-absent { font-weight: normal; margin-left: 2px; }
  header .author { margin-left: auto; font-size: 13px; }
  #end-review { padding: 4px 12px; border-radius: 6px; border: 1px solid var(--accent); background: var(--panel); color: var(--accent); font: inherit; font-weight: 600; cursor: pointer; }
  #end-review:disabled { opacity: .5; cursor: default; }
  #ended, #failed { padding: 16px; }
  main { display: grid; grid-template-columns: 300px minmax(0, 1fr) 360px; height: calc(100vh - 49px); }
  section { overflow: auto; padding: 12px 16px; }
  section + section { border-left: 1px solid var(--line); }
  h2 { font-size: 13px; color: var(--muted); font-weight: 600; margin: 16px 0 6px; }
  h2:first-child { margin-top: 0; }
  code, .mono { font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 12px; }
  .muted { color: var(--muted); }
  .filters label { display: flex; align-items: center; gap: 6px; }
  .filters fieldset { margin: 0 0 6px; padding: 0; border: 0; min-width: 0; }
  .filters legend { padding: 0; font-size: 12px; color: var(--muted); }
  .screens { list-style: none; margin: 8px 0 0; padding: 0; }
  .screens li { padding: 6px 8px; border-radius: 6px; cursor: pointer; display: flex; gap: 8px; align-items: baseline; }
  .screens li:hover { background: var(--bg); }
  .screens li.selected { background: var(--selected); }
  .screens .name { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  #screen-list li { flex-direction: column; align-items: stretch; gap: 2px; }
  #screen-list .name { overflow: clip; }
  #screen-list .component, #screen-list .seg { white-space: nowrap; }
  #screen-list .badges { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; }
  .screens .count { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .screens .count.none { color: var(--fail); }
  .chip { display: inline-block; padding: 0 6px; border-radius: 4px; font-size: 12px; border: 1px solid currentColor; white-space: nowrap; }
  .chip.pass { color: var(--pass); } .chip.fail { color: var(--fail); } .chip.pending { color: var(--pending); }
  .chip.partial { color: var(--more); } .chip.untested { color: var(--fail); border-style: dashed; }
  .chip.needs-more { color: var(--more); } .chip.missing { color: var(--missing); } .chip.fine { color: var(--fine); }
  .title-row { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .title-row h3 { margin: 0; font-size: 18px; }
  .frame-bar { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-top: 12px; padding: 6px 8px; border: 1px solid var(--line); border-bottom: 0; border-radius: 6px 6px 0 0; background: var(--bg); font-size: 13px; }
  .frame-bar .mono { flex: 1 1 24em; min-width: 0; overflow-wrap: anywhere; }
  .frame-bar .error { color: var(--fail); }
  .frame-bar select { max-width: 100%; font: inherit; padding: 1px 4px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); color: var(--text); }
  .frame-bar .path-values { flex-basis: 100%; display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; }
  .frame-bar .path-values input[type=text] { width: 12em; padding: 2px 6px; }
  .frame-bar .path-values button { padding: 2px 10px; border-radius: 6px; border: 1px solid var(--accent); background: var(--panel); color: var(--accent); font: inherit; cursor: pointer; }
  .frame-bar .fallback { font-weight: 600; }
  .frame-bar + .frame-note { margin-top: 0; border-radius: 0 0 6px 6px; }
  .settings-bar { display: flex; align-items: center; gap: 6px 10px; flex-wrap: wrap; padding: 6px 8px; border: 1px solid var(--line); border-bottom: 0; background: var(--bg); font-size: 13px; }
  .settings-bar.overridden { border-color: var(--changed); background: var(--changed-bg); }
  .settings-bar .title { font-weight: 600; }
  .setting { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; padding: 2px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }
  .setting.changed { border-color: var(--changed); color: var(--changed); }
  .setting.blocked { color: var(--muted); }
  .setting .reason { font-size: 12px; }
  .settings-bar .file-error { color: var(--pending); font-size: 12px; }
  .setting button, .settings-bar > button, .setting select { padding: 1px 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); color: var(--text); font: inherit; font-size: 12px; cursor: pointer; }
  .setting button.on { border-color: var(--accent); background: var(--selected); font-weight: 600; }
  .setting button:disabled, .setting select:disabled, .setting input:disabled { cursor: default; opacity: .6; }
  iframe.app { display: block; width: 100%; height: 60vh; border: 1px solid var(--line); border-radius: 0 0 6px 6px; background: #fff; }
  .frame-note { margin-top: 12px; padding: 12px; border: 1px dashed var(--line); border-radius: 6px; }
  table { width: 100%; border-collapse: collapse; margin-top: 12px; }
  th, td { text-align: left; vertical-align: top; padding: 8px; border-bottom: 1px solid var(--line); }
  th { font-size: 12px; color: var(--muted); font-weight: 600; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: var(--bg); }
  tbody tr.selected { background: var(--selected); }
  td.depth { width: 110px; font-weight: 600; }
  td.mark { width: 90px; }
  table.calls tbody tr { cursor: default; }
  table.calls td.cell { cursor: pointer; white-space: nowrap; font-size: 12px; }
  table.calls td.cell:hover { background: var(--selected); }
  table.calls td.cell.selected { background: var(--selected); box-shadow: inset 0 0 0 1.5px var(--accent); }
  table.calls td.cell .chip { margin-top: 2px; }
  table.calls td.call { overflow-wrap: anywhere; }
  table.calls tr.option td { padding-top: 4px; padding-bottom: 4px; }
  table.calls tr.option td.call { padding-left: 24px; font-size: 12px; }
  table.calls tr.option td.call .chip { margin-left: 6px; }
  table.calls td.count { white-space: nowrap; font-size: 12px; }
  table.calls tr.option.gap td.call > div:first-child, table.calls td.cell .none { color: var(--fail); font-weight: 600; }
  .chip.config { color: var(--accent); }
  .ok { color: var(--pass); } .ng { color: var(--fail); } .wait { color: var(--pending); }
  .chip.dead, .chip.v-none { color: var(--fail); } .chip.v-method-mismatch { color: var(--more); } .chip.v-match { color: var(--pass); } .chip.v-unresolved, .chip.v-unchecked { color: var(--muted); }
  .test { margin-bottom: 6px; }
  .test .detail { color: var(--muted); font-size: 12px; margin-left: 4px; }
  .importers p, .detached p { font-size: 12px; margin: 0 0 8px; }
  .importer .judge-row { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 10px; }
  .importer .judge-row input, .bulk-bar input.reason { flex: 1 1 140px; min-width: 0; padding: 2px 6px; font-size: 12px; }
  .importer button.discard, .importer button.hand-over, .importer button.undo, .bulk-bar button { padding: 2px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--text); font: inherit; font-size: 12px; cursor: pointer; white-space: nowrap; }
  .discarded .importer, .awaiting-tag .importer, .detached .importer { margin-bottom: 10px; font-size: 12px; }
  .guard { display: block; }
  .chip.kind-setting, .chip.kind-role, .chip.kind-mixed { color: var(--accent); margin-left: 4px; }
  .access > h2:first-child, .in-screen > h2:first-child { margin-top: 16px; }
  .open-needs h3 { font-size: 13px; margin: 10px 0 4px; }
  .open-needs .need, .reach-summary .need { display: flex; align-items: center; gap: 6px; font-weight: 600; }
  .open-needs .need .flag { color: var(--pending); font-weight: normal; }
  .open-needs .tips { font-size: 12px; margin-top: 4px; }
  #right { display: flex; flex-direction: column; padding: 0; overflow-x: hidden; overflow-y: auto; overflow-wrap: anywhere; }
  #right-info { flex: 1 1 auto; min-height: 120px; overflow: auto; padding: 12px 16px; }
  #right-dock { flex: none; padding: 10px 16px 12px; border-top: 1px solid var(--line); background: var(--panel); }
  #right-info:empty, #right-dock:empty { display: none; }
  #right .chip { white-space: normal; }
  .target-id { margin-bottom: 4px; }
  .link-group { margin-bottom: 6px; }
  .link-group > summary, .long-guard > summary { cursor: pointer; }
  .link-group > ul { margin: 6px 0 8px 16px; }
  .long-guard > summary::after { content: ' 펼치기'; color: var(--muted); font-size: 12px; }
  .long-guard[open] > summary::after { content: '접기'; }
  .long-guard[open] > summary .head { display: none; }
  ul.plain { list-style: none; padding: 0; margin: 0; }
  ul.plain li { margin-bottom: 6px; }
  .mark-form h2 { margin: 0; }
  .statuses { display: flex; gap: 6px; margin: 6px 0; }
  .statuses button { flex: 1; padding: 6px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--text); cursor: pointer; font: inherit; }
  .statuses button.on { border-color: var(--accent); background: var(--selected); font-weight: 600; }
  textarea, input[type=text], input[type=search] { width: 100%; font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--text); }
  textarea { min-height: 56px; resize: vertical; }
  .mark-form textarea { max-height: 20vh; }
  .mark-form .error { margin: 6px 0 0; }
  .save-row { display: flex; align-items: center; gap: 12px; margin-top: 6px; }
  button.save { padding: 6px 14px; border-radius: 6px; border: 0; background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
  button.save:disabled { opacity: .5; cursor: default; }
  .history li { font-size: 12px; }
  .history-toggle { padding: 0; border: 0; background: none; color: var(--muted); font: inherit; font-size: 12px; cursor: pointer; }
  .history-toggle::after { content: ' ▸'; }
  .history-toggle[aria-expanded=true]::after { content: ' ▾'; }
  .mark-form .history { max-height: min(160px, 15vh); overflow-y: auto; margin-top: 8px; }
  .error { color: var(--fail); }
  a { color: var(--accent); }
  .views { display: flex; gap: 4px; }
  .views button { padding: 4px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--text); font: inherit; cursor: pointer; }
  .views button.on { border-color: var(--accent); background: var(--selected); font-weight: 600; }
  .views button:disabled { cursor: default; opacity: .6; }
  /* 상자를 재는 순간에는 내용이 짧아 스크롤바가 없으므로, 그때 잰 폭이 다 그린 뒤와 같도록 스크롤바 자리를 늘 비워 둔다. */
  #flow { height: calc(100vh - 49px); overflow: auto; scrollbar-gutter: stable; padding: 16px; }
  #flow h2 { margin: 20px 0 8px; }
  .flowguide { align-self: stretch; display: flex; align-items: center; gap: 10px; margin-left: auto; max-width: 100%; }
  .flowkey { display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: center; gap: 2px 12px; margin: 0; padding: 0; list-style: none; font-size: 12px; color: var(--muted); }
  .flowkey li { display: flex; align-items: center; gap: 5px; white-space: nowrap; }
  .flowkey li.apart { padding-left: 12px; border-left: 1px solid var(--line); }
  .flowkey .swatch { width: 22px; height: 14px; border-radius: 4px; }
  .flowkey svg { width: 26px; height: 6px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .flowinfo { align-self: stretch; display: flex; align-items: center; }
  .flowbar .flowinfo-button { width: 20px; height: 20px; padding: 0; border-radius: 50%; font: italic bold 12px/1 Georgia, serif; color: var(--muted); }
  .flowbar .flowinfo-button:hover, .flowbar .flowinfo-button:focus-visible, .flowinfo.shown .flowinfo-button { border-color: var(--accent); color: var(--text); }
  .flowlegend { display: none; position: absolute; right: 16px; top: 100%; width: min(320px, calc(100% - 32px)); box-sizing: border-box; flex-direction: column; gap: 6px; margin: 0; padding: 10px 12px; list-style: none; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); box-shadow: 0 4px 14px rgba(0, 0, 0, .18); font-size: 12px; line-height: 1.5; color: var(--muted); }
  .flowinfo.shown .flowlegend { display: flex; }
  .flowlegend li { display: grid; grid-template-columns: max-content 1fr; column-gap: 8px; }
  .flowlegend .sample { color: var(--text); }
  .flowlegend small { display: block; font-size: 11px; }
  .flowlegend::before { content: ''; position: absolute; left: -1px; right: -1px; top: calc(-1 * var(--bar-pad) - 2px); height: calc(var(--bar-pad) + 8px); }
  .canvas { position: relative; }
  .canvas svg { position: absolute; inset: 0; overflow: visible; pointer-events: none; }
  .canvas svg path, .flowkey svg path { fill: none; stroke: var(--muted); stroke-width: 1.3; opacity: .7; }
  .canvas svg path.guarded, .flowkey svg path.guarded { stroke: var(--accent); stroke-dasharray: 5 4; opacity: .9; }
  #flow .canvas .group-head { position: absolute; margin: 0; line-height: 28px; white-space: nowrap; }
  .box, .flowkey .swatch { box-sizing: border-box; border: 1.5px solid var(--line); background: var(--panel); }
  .box { position: absolute; border-radius: 6px; padding: 4px 8px; font-size: 12px; line-height: 1.35; }
  .box.measuring { left: 0; top: 0; width: max-content; max-width: 360px; min-width: min-content; visibility: hidden; }
  .box.screen { cursor: pointer; }
  .box.screen:hover { border-color: var(--accent); }
  .box .seg, .box .component { white-space: nowrap; }
  .box.call.grouped { overflow-wrap: anywhere; }
  .box.call.grouped .seg { display: inline-block; max-width: 100%; white-space: normal; }
  .box .need .text, .box .l3 .text { overflow-wrap: anywhere; }
  .box .l1 { font-weight: 600; }
  .box .l2, .box .l3, .box .need { color: var(--muted); }
  .box .need { display: flex; align-items: baseline; gap: 6px; }
  .box .need .flag { flex: none; color: var(--pending); }
  .box .l3 { display: flex; align-items: flex-start; gap: 4px; }
  .box .text { flex: 1 1 auto; }
  .box.s-pass, .flowkey .s-pass { border-color: var(--pass); }
  .box.s-fail, .flowkey .s-fail { border-color: var(--fail); }
  .box.s-pending, .flowkey .s-pending { border-color: var(--pending); }
  .box.s-none, .flowkey .s-none { border-style: dashed; }
  .box.call { background: var(--bg); }
  .box .calls { flex: none; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); color: var(--muted); font: inherit; font-size: 11px; line-height: 1.1; padding: 0 5px; cursor: pointer; }
  .box .acts { display: flex; column-gap: 4px; margin-top: 3px; }
  .box .toggle { flex: none; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); color: var(--muted); font: inherit; font-size: 11px; font-weight: normal; line-height: 1.3; padding: 0 6px; white-space: nowrap; cursor: pointer; }
  .box .toggle:hover { border-color: var(--accent); color: var(--text); }
  .flowbar { position: sticky; top: -16px; left: -16px; z-index: 1; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; --bar-pad: 8px; margin: -16px -16px 10px; padding: 12px 16px var(--bar-pad); background: var(--bg); border-bottom: 1px solid var(--line); }
  .flowbar button { padding: 3px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--text); font: inherit; font-size: 12px; cursor: pointer; }
  .flowbar .focusing { margin-left: 8px; font-size: 12px; }
  .flowbar .flowsummary { flex-basis: 100%; font-size: 13px; }
  .views.side { margin-bottom: 10px; }
  .views.side button { flex: 1 1 auto; display: flex; align-items: center; justify-content: center; gap: 3px; min-width: 0; padding: 4px 1px; white-space: nowrap; }
  .views.side .tab-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .views.side .tab-count { flex: none; position: relative; top: .5px; padding: 0 4px; border-radius: 8px; background: var(--line); font-size: 11px; font-weight: 600; line-height: 16px; }
  .views.side button.on .tab-count { background: var(--accent); color: var(--panel); }
  .chip.l-open { color: var(--pass); } .chip.l-conditioned { color: var(--accent); } .chip.l-broken { color: var(--fail); } .chip.l-off-map, .chip.l-unknown { color: var(--more); }
  .story-path { margin-top: 8px; }
  .story-path .step { display: flex; gap: 10px; align-items: baseline; padding: 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }
  .story-path .step.on-map { cursor: pointer; }
  .story-path .step.on-map:hover { border-color: var(--accent); }
  .story-path .step.off-map { border-style: dashed; border-color: var(--more); }
  .story-path .step .no { flex: none; width: 1.6em; font-weight: 600; color: var(--muted); }
  .story-path .step .name { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  #story-list .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  #story-list .chips:not(:empty) { margin-top: 2px; }
  .step-tests { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 12px; }
  .step-tests .none { color: var(--fail); }
  #untagged-list li { align-items: flex-start; }
  #untagged-list .chip { flex: none; }
  .test-pairs .pair { margin-bottom: 6px; }
  .test-pairs .pair .detail { font-size: 12px; color: var(--muted); }
  .test-pairs .pair .chip { flex: none; }
  .test-pairs .no-screens { margin: 0; }
  .pair-row { display: flex; gap: 8px; align-items: flex-start; }
  .pair-row .pick, .pair-row .pick-space { flex: none; width: 16px; margin: 12px 0 0; }
  .pair-row .pair { flex: 1; min-width: 0; }
  .bulk-bar { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; margin: 8px 0; }
  .bulk-bar input.reason { flex-basis: 200px; }
  .bulk-bar button:disabled { cursor: default; opacity: .5; }
  .bulk-bar .bulk-error { flex: 1 1 100%; margin: 0; font-size: 12px; white-space: pre-line; }
  .screens li.locked, .story-path .step.on-map.locked { cursor: default; opacity: .6; }
  .screens li.locked:not(.selected):hover { background: none; }
  .story-path .step.on-map.locked:hover { border-color: var(--line); }
  .test .depth { font-size: 12px; font-weight: 600; color: var(--muted); margin-right: 4px; }
  .story-path .link { margin: 0 0 0 18px; padding: 6px 0 6px 18px; border-left: 2px solid var(--line); font-size: 13px; }
  .story-path .link.l-conditioned { border-left: 2px dashed var(--accent); }
  .story-path .link.l-broken { border-left: 2px dotted var(--fail); }
  .story-path .link.l-off-map, .story-path .link.l-unknown { border-left: 2px dotted var(--more); }
  .verdict { margin: 2px 0; } .verdict.unreachable { color: var(--fail); } .verdict.reachable { color: var(--pass); } .verdict.unjudged { color: var(--more); }
  .ways li { margin: 4px 0 0; }
  .memo { white-space: pre-wrap; }
  .reach > li { margin-bottom: 12px; }
  .reach h3 { font-size: 13px; margin: 0 0 4px; }
  .reach-summary .step-roles { margin: 2px 0 0 16px; }
  .reach-summary .left-out { margin-top: 6px; color: var(--more); }
  .reach-summary .left-out ul { margin: 2px 0 0 16px; }
  .reach-raw { margin: 8px 0 12px; }
  .reach-raw > summary { cursor: pointer; }
  .reach-raw > .reach { margin-top: 8px; }
</style>
</head>
<body>
<header>
  <h1>duru 리뷰</h1>
  <span class="views"><button id="view-list">목록</button><button id="view-flow">흐름</button></span>
  <span class="meta" id="meta"></span>
  <span class="author" id="author"></span>
  <span class="error" id="end-error"></span>
  <button id="end-review" title="표시를 다 남겼으면 눌러 주세요. 작업 목록이 리뷰 페이지를 띄운 터미널로 넘어갑니다">리뷰 끝</button>
</header>
<main>
  <section id="left"></section>
  <section id="center"><div id="center-head"></div><div id="center-body"></div></section>
  <section id="right"><div id="right-info"></div><div id="right-dock"></div></section>
</main>
<div id="flow" hidden></div>
<p id="failed" class="error" hidden></p>
<script>
const DEPTH_LABELS = { ui: 'UI/E2E', api: 'API', render: '렌더링만', code: '코드', data: '데이터', output: '산출물' };
const TEST_STATUS = { pass: '통과', fail: '실패', pending: '보류' };
const MARK_STATUS = { 'needs-more': '더 필요', missing: '없음', fine: '충분' };
const SERVER_STATUS = { match: '서버에 있음', 'method-mismatch': '메서드 불일치', none: '서버에 없음', unresolved: '판정 불가', unchecked: '대조 안 함' };
const SERVER_STATE_TIP = '서버 API 목록(serverEndpoints)이 없거나 비어 있어 API 호출을 서버와 견주지 않았습니다. 목록을 채우고 duru rebuild 를 다시 하면 견줍니다.';
const KIND_LABEL = { setting: '설정', role: '역할' };
const MIXED_KINDS = '링크마다 다름';
const VALUE_LABEL = { true: '켬', false: '끔' };
const SCREEN_FILTERS = [
  { key: 'no-tests', label: '테스트 없음만', keep: (s) => testsOf(s.id).length === 0 },
  { key: 'imported-only', label: '지나간 테스트만 있음', title: '화면 테스트는 없고, 이 화면의 소스 파일을 불러오는 테스트만 있는 화면. 태그 달기를 기다리는 짝은 세고, 버린 짝은 세지 않습니다', keep: (s) => testsOf(s.id).length === 0 && importersOf(s.id).length + awaitingTagOf(s.id).length > 0 },
  { key: 'dead', label: '죽은 화면', keep: (s) => s.dead, needsServerList: true },
  { key: 'setting', label: '특정 설정에서만 열림', keep: (s) => s.access.kinds.includes('setting') },
  { key: 'role', label: '특정 역할에서만 열림', keep: (s) => s.access.kinds.includes('role') },
  { key: 'mixed', label: MIXED_KINDS, keep: (s) => s.access.restricted && !s.access.kinds.length },
];

const STORY_STATUS = {
  pass: { label: '통과', title: '스토리 테스트가 모두 통과했습니다' },
  fail: { label: '실패', title: '실패한 스토리 테스트가 있습니다' },
  pending: { label: '보류', title: '실패한 스토리 테스트는 없고 보류한 것이 있습니다' },
  partial: { label: '일부 화면만 테스트', title: '스토리 테스트는 없고, 경로의 화면 가운데 테스트가 붙은 화면이 있습니다' },
  untested: { label: '테스트 없음', title: '스토리 테스트도, 경로의 화면에 붙은 테스트도 없습니다' },
};
// 상태는 고른 것 가운데 하나만 맞아도 남기고, 「링크 없음」은 그 결과를 한 번 더 거른다.
const STORY_FILTERS = [
  ...['untested', 'partial', 'fail'].map((key) => ({ key, ...STORY_STATUS[key], status: true, keep: (st) => st.status === key })),
  { key: 'broken', label: '링크 없음', title: '이웃한 두 화면을 잇는 링크가 맵에 없는 자리가 있는 스토리', keep: (st) => st.broken },
];
const state = { data: null, selected: null, target: null, filters: new Set(), query: '', draft: null, error: null, view: 'flow', collapsed: new Set(), openCalls: new Set(), focus: null, flowError: null, ended: false, failed: false, roleChoice: 'auto', pathValues: new Map(), settingsError: null, frameScreen: null, side: 'screens', story: null, storyFilters: new Set(), storyDraft: null, legendOpen: false, legendDismissed: false, openGroups: new Set(), openLong: new Set(), rightView: null, storyOpen: new Set(), dockKey: null, historyOpen: false, judgmentError: null, judgmentNotes: new Map(), untaggedTest: null, untaggedQuery: '', bulk: null, bulkBusy: false, ending: false };

function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs ?? {})) {
    if (v == null || v === false) continue;
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'class') el.className = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of children.flat()) if (c != null && c !== false) el.append(c instanceof Node ? c : String(c));
  return el;
}

function fill(el, ...children) {
  el.replaceChildren(...children.flat().filter((c) => c != null && c !== false));
}

const keyOf = (t) => (t.story !== undefined ? `story(${t.story})` : [t.node, t.option && `${t.option.key}=${t.option.value}`, t.depth].filter(Boolean).join(' '));
const optionLabel = (o) => `${o.key} ${VALUE_LABEL[o.value]}`;
const targetName = (t) => (t.story !== undefined
  ? `스토리 ${state.data.stories.list.find((st) => st.id === t.story)?.name ?? t.story}`
  : [t.node, t.option && optionLabel(t.option), t.depth && `${DEPTH_LABELS[t.depth]} 깊이`].filter(Boolean).join(' · '));
const ownTests = (byId, id) => (byId && Object.hasOwn(byId, id) ? byId[id] : []);
const testsOf = (id) => ownTests(state.data.tests.nodes, id);
const importersOf = (id) => ownTests(state.data.tests.importers, id);
const discardedOf = (id) => ownTests(state.data.tests.discarded, id);
const awaitingTagOf = (id) => ownTests(state.data.tests.awaitingTag, id);
const detachedOf = (id) => ownTests(state.data.tests.detachedHandOvers, id);
const untaggedTests = () => state.data.tests.untagged ?? [];
const untaggedListMissing = () => !state.data.tests.untagged && state.data.tests.untaggedCount > 0;
const untaggedCount = () => state.data.tests.untagged?.length ?? state.data.tests.untaggedCount ?? 0;
const untaggedKey = (t) => JSON.stringify([t.source, t.file, t.line, t.title]);
const markOf = (t) => state.data.marks.attached.find((m) => m.key === keyOf(t));
const fmtDate = (iso) => new Date(iso).toLocaleString('ko-KR', { dateStyle: 'short', timeStyle: 'short' });
const markChip = (m) => (m ? h('span', { class: `chip ${m.current.status}`, title: m.current.note || '' }, MARK_STATUS[m.current.status]) : null);
const callOf = (id) => state.data.map.calls.find((c) => c.id === id);
const callIdsOf = (s) => [...new Set(s.apiCalls.flatMap((c) => (c.endpoints ?? []).map((e) => e.callId)).filter(Boolean))];
const hasOption = (tests, key, value) => tests.filter((t) => t.options?.some((o) => o.key === key && o.value === value));
const optionsOf = (s, callId) => s.callOptions[callId] ?? [];

async function load() {
  const res = await fetch('/api/data');
  if (!res.ok) throw new Error(await res.text());
  state.data = await res.json();
  if (state.focus) {
    const { id } = state.focus;
    const roots = await branchRoots(id).catch(() => null);
    if (state.focus?.id === id) state.focus = roots && { id, roots };
  }
  const { screens } = state.data.map;
  const screen = screens.find((s) => s.id === state.selected) ?? screens[0];
  state.selected = screen?.id ?? null;
  const t = state.target;
  const targetKept = t && screen && (t.node === screen.id
    || (callIdsOf(screen).includes(t.node) && (!t.option || optionsOf(screen, t.node).some((o) => o.key === t.option.key))));
  if (!targetKept) {
    state.target = screen ? { node: screen.id } : null;
    state.draft = null;
  }
  if (!untaggedTests().some((t) => untaggedKey(t) === state.untaggedTest)) setUntaggedTest(untaggedTests().length ? untaggedKey(untaggedTests()[0]) : null);
  const stories = state.data.stories.list;
  if (!stories.some((st) => st.id === state.story) && !unlistedMarks().some((m) => m.target.story === state.story)) {
    state.story = stories[0]?.id ?? null;
    state.storyDraft = null;
  }
}

function select(id) {
  for (const [key, kept] of state.pathValues) {
    if (key.startsWith(`${id}\n`) && !kept.pending && kept.errors.length && !kept.opened) state.pathValues.delete(key);
  }
  if (id !== state.selected) {
    state.openGroups.clear();
    state.openLong.clear();
  }
  state.selected = id;
  state.target = { node: id };
  state.draft = null;
  state.error = null;
  state.judgmentError = null;
  render();
}

function selectStory(id) {
  if (id !== state.story) state.storyOpen.clear();
  state.story = id;
  state.storyDraft = null;
  state.error = null;
  state.judgmentError = null;
  render();
}

function setUntaggedTest(key) {
  state.untaggedTest = key;
  if (state.bulk?.testKey !== key) state.bulk = key === null ? null : { testKey: key, picked: new Set(), note: '', error: null };
}

function selectUntaggedTest(key) {
  if (state.bulkBusy) return;
  setUntaggedTest(key);
  state.error = null;
  state.judgmentError = null;
  render();
}

function setSide(side) {
  state.side = side;
  state.error = null;
  state.judgmentError = null;
  render();
}

function openScreen(id) {
  if (state.bulkBusy) return;
  state.side = 'screens';
  select(id);
}

function selectTarget(t) {
  state.target = t;
  state.draft = null;
  state.error = null;
  state.judgmentError = null;
  render();
}

function placeStateTip(e) {
  const tip = e.currentTarget.nextElementSibling;
  const origin = tip.offsetParent.getBoundingClientRect().left;
  const width = tip.getBoundingClientRect().width;
  const room = document.documentElement.clientWidth - 16 - width;
  tip.style.left = `${Math.max(16, Math.min(e.currentTarget.getBoundingClientRect().left, room)) - origin}px`;
}

function renderHeader() {
  const { map, tests } = state.data;
  const { screens, tested } = state.data.flow.summary;
  fill(document.getElementById('meta'),
    `화면 ${screens} · 테스트 있는 화면 ${tested} · 맵 ${fmtDate(map.meta.generatedAt)} · 테스트 연결 ${fmtDate(tests.meta.generatedAt)}`,
    map.serverNotCompared ? [
      h('button', { type: 'button', class: 'chip state', 'aria-describedby': 'server-state-tip', onmouseenter: placeStateTip, onfocus: placeStateTip }, '서버 대조 안 함'),
      h('span', { class: 'state-tip', id: 'server-state-tip', role: 'note' }, SERVER_STATE_TIP),
    ] : null);
  fill(document.getElementById('author'), '작성자 ', h('strong', {}, state.data.author));
}

const listAbsentNote = (text) => (state.data.map.serverNotCompared ? [' ', h('span', { class: 'list-absent' }, text)] : null);

const activeScreenFilters = () => SCREEN_FILTERS.filter((f) => !(f.needsServerList && state.data.map.serverNotCompared));

function visibleScreens() {
  const q = state.query.trim().toLowerCase();
  const filters = activeScreenFilters();
  return state.data.map.screens.filter((s) => filters.every((f) => !state.filters.has(f.key) || f.keep(s)) && (!q || s.id.toLowerCase().includes(q)));
}

const screenFilterBoxes = () => activeScreenFilters().map((f) => h('label', { title: f.title }, h('input', { type: 'checkbox', name: f.key, checked: state.filters.has(f.key), onchange: (e) => {
  if (e.target.checked) state.filters.add(f.key); else state.filters.delete(f.key);
  renderLeftList();
} }), f.label));

function renderLeft() {
  const { marks, map, stories } = state.data;
  const left = document.getElementById('left');
  const side = (key, name, count, title) => h('button', { class: state.side === key ? 'on' : '', title, disabled: state.bulkBusy, onclick: () => setSide(key) },
    h('span', { class: 'tab-name' }, name),
    // 화면에는 gap 이 띄우고, 이 빈칸은 탭의 글이 「화면 11」로 읽히게 한다.
    ' ', h('span', { class: 'tab-count' }, count));
  const tabs = h('div', { class: 'views side' },
    side('screens', '화면', map.screens.length),
    side('stories', '스토리', stories.list.length),
    side('untagged', '태그 없음', untaggedCount(), '노드 태그도 스토리 태그도 없는 테스트'));
  if (state.side === 'stories') return fill(left, tabs, storyList());
  if (state.side === 'untagged') {
    if (!keptLeftList(left, tabs, 'untagged-list')) {
      fill(left,
        tabs,
        h('div', { class: 'filters' },
          h('input', { type: 'search', placeholder: '테스트 찾기', value: state.untaggedQuery, oninput: (e) => { state.untaggedQuery = e.target.value; renderUntaggedList(); } })),
        h('ul', { class: 'screens', id: 'untagged-list' }));
    }
    return renderUntaggedList();
  }
  const detached = markList('떨어져 나감', 'detached', marks.detached.filter((m) => m.target.story === undefined), (m) => m.key, h('p', { class: 'muted' }, '맵에서 사라진 노드에 달린 표시가 여기 남습니다.'));
  const list = keptLeftList(left, tabs, 'screen-list');
  if (list) {
    const search = left.querySelector(':scope > .filters > input[type=search]');
    while (search.nextSibling) search.nextSibling.remove();
    search.after(...screenFilterBoxes());
    while (list.nextSibling) list.nextSibling.remove();
    list.after(...detached);
    return renderLeftList();
  }
  fill(left,
    tabs,
    h('div', { class: 'filters' },
      h('input', { type: 'search', placeholder: '화면 찾기', value: state.query, oninput: (e) => { state.query = e.target.value; renderLeftList(); } }),
      screenFilterBoxes(),
    ),
    h('ul', { class: 'screens', id: 'screen-list' }),
    detached,
  );
  renderLeftList();
}

// 찾기 칸을 새로 만들면 조합 중이던 한글이 끊기고 초점도 사라진다.
function keptLeftList(left, tabs, listId) {
  const list = left.querySelector(`:scope > ul#${listId}`);
  if (list) left.firstElementChild.replaceWith(tabs);
  return list;
}

function markList(title, cls, marks, label, empty, pick = null) {
  return [
    h('h2', {}, `${title} ${marks.length}`),
    marks.length
      ? h('ul', { class: `plain ${cls}` }, marks.map((m) => h('li', pick ? { class: label(m) === state.story ? 'selected' : '', onclick: () => pick(label(m)) } : {},
          markChip(m), ' ', h('code', {}, label(m)), h('br'),
          h('span', { class: 'muted' }, `${m.current.author} · ${fmtDate(m.current.date)}`), m.current.note ? h('div', {}, m.current.note) : null)))
      : empty,
  ];
}

const routeSegments = (path) => path.split(/(?=\/)/).flatMap((seg, i) => [i ? h('wbr') : null, h('span', { class: 'seg' }, seg)]);

function renderLeftList() {
  const visible = visibleScreens();
  const list = document.getElementById('screen-list');
  fill(list, ...visible.map((s) => {
    const n = testsOf(s.id).length;
    const waiting = awaitingTagOf(s.id).length;
    return h('li', { class: s.id === state.selected ? 'selected' : '', title: `${s.path} ${s.component}`, onclick: () => select(s.id) },
      h('span', { class: 'name' }, h('span', {}, routeSegments(s.path)), ' ', h('span', { class: 'muted component' }, s.component)),
      h('span', { class: 'badges' },
        s.dead ? h('span', { class: 'chip dead', title: '서버에 없는 호출이 있습니다' }, '죽은 화면') : null,
        markChip(markOf({ node: s.id })),
        h('span', { class: `count${n ? '' : ' none'}` }, n ? `테스트 ${n}` : '테스트 없음'),
        importersOf(s.id).length ? h('span', { class: 'count importer-count', title: '이 화면의 소스 파일을 불러오는 단위 테스트' }, `불러옴 ${importersOf(s.id).length}`) : null,
        waiting ? h('span', { class: 'count awaiting-count', title: '이 화면의 태그를 달도록 넘긴 테스트' }, `태그 대기 ${waiting}`) : null));
  }));
  if (!visible.length) list.append(h('li', { class: 'muted' }, '해당하는 화면이 없습니다.'));
}

function renderUntaggedList() {
  const list = document.getElementById('untagged-list');
  if (untaggedListMissing()) return fill(list, h('li', { class: 'muted' }, '목록이 없습니다.'));
  const q = state.untaggedQuery.trim().toLowerCase();
  const visible = untaggedTests().filter((t) => !q || t.title.toLowerCase().includes(q) || testPlace(t).toLowerCase().includes(q));
  fill(list, ...visible.map((t) => h('li', { class: `${untaggedKey(t) === state.untaggedTest ? 'selected' : ''}${state.bulkBusy ? ' locked' : ''}`, onclick: () => selectUntaggedTest(untaggedKey(t)) },
    h('span', { class: `chip ${t.status}` }, TEST_STATUS[t.status]),
    h('span', { class: 'name' }, h('span', { class: 'title' }, t.title), ' ', h('span', { class: 'muted mono' }, testPlace(t))))));
  if (!visible.length) list.append(h('li', { class: 'muted' }, '해당하는 테스트가 없습니다.'));
}

const LINK_VERDICT = { open: '이어짐', conditioned: '조건', broken: '링크 없음', 'off-map': '판정 못 함', unknown: '판정 못 함' };
const storyOf = () => state.data.stories.list.find((st) => st.id === state.story);
const unlistedMarks = () => state.data.marks.attached.filter((m) => m.target.story !== undefined && !state.data.stories.list.some((st) => st.id === m.target.story));
const screenOf = (id) => state.data.map.screens.find((s) => s.id === id);
const screenLabel = (id) => screenOf(id)?.path ?? id;
const statusChip = (st) => h('span', { class: `chip ${st.status}`, title: STORY_STATUS[st.status].title }, STORY_STATUS[st.status].label);
const storyChips = (st) => [
  st.broken ? h('span', { class: 'chip l-broken', title: '이웃한 두 화면을 잇는 링크가 맵에 없는 자리가 있습니다' }, '링크 없음') : null,
  st.detached ? h('span', { class: 'chip l-off-map', title: `맵에서 찾을 수 없는 화면: ${st.steps.filter((s) => !s.onMap).map((s) => s.screen).join(', ')}` }, '화면 없음') : null,
  st.unjudged ? h('span', { class: 'chip l-unknown', title: '주소를 읽지 못한 링크 때문에 판정하지 못한 자리가 있습니다' }, '판정 못 함') : null,
];

function visibleStories() {
  const on = STORY_FILTERS.filter((f) => state.storyFilters.has(f.key));
  const statuses = on.filter((f) => f.status);
  return state.data.stories.list.filter((st) => (!statuses.length || statuses.some((f) => f.keep(st))) && on.every((f) => f.status || f.keep(st)));
}

const storyFilterBox = (f) => h('label', { title: f.title }, h('input', { type: 'checkbox', name: f.key, checked: state.storyFilters.has(f.key), onchange: (e) => {
  if (e.target.checked) state.storyFilters.add(f.key); else state.storyFilters.delete(f.key);
  renderLeft();
} }), f.label);

function storyItems() {
  const visible = visibleStories();
  return [
    h('div', { class: 'filters' },
      h('fieldset', {}, h('legend', {}, '상태 · 하나라도 맞으면'), STORY_FILTERS.filter((f) => f.status).map(storyFilterBox)),
      h('fieldset', {}, h('legend', {}, '그리고'), STORY_FILTERS.filter((f) => !f.status).map(storyFilterBox))),
    h('ul', { class: 'screens', id: 'story-list' }, visible.length
      ? visible.map((st) => h('li', { class: st.id === state.story ? 'selected' : '', onclick: () => selectStory(st.id) },
          h('span', { class: 'name' }, h('span', {}, st.name), h('div', { class: 'muted mono' }, st.id),
            h('div', { class: 'chips' }, st.status === 'pass' ? null : statusChip(st), storyChips(st))),
          markChip(markOf({ story: st.id })),
          h('span', { class: 'count' }, `화면 ${st.steps.length}`)))
      : h('li', { class: 'muted' }, '해당하는 스토리가 없습니다.')),
  ];
}

function storyList() {
  const { list, notices, stale } = state.data.stories;
  return [
    ...(stale
      ? [h('p', { class: 'error' }, stale)]
      : list.length
      ? storyItems()
      : [h('p', { class: 'muted' }, '스토리 파일이 없습니다. 스토리 하나를 파일 하나로 ', h('code', {}, state.data.storiesDir), ' 에 둡니다.')]),
    ...markList('떨어져 나감', 'detached', state.data.marks.detached.filter((m) => m.target.story !== undefined), (m) => m.target.story,
      h('p', { class: 'muted', title: '스토리 파일이 사라진 스토리에 남긴 표시' }, '없음')),
    h('h2', {}, `읽지 못한 스토리 파일 ${notices.length}`),
    notices.length
      ? h('ul', { class: 'plain notices' }, notices.map((n) => h('li', {}, h('code', {}, n.file), h('div', { class: 'error' }, n.reason))))
      : h('p', { class: 'muted' }, '형식이 틀렸거나 ID 가 겹쳐 건너뛴 파일이 여기 남습니다.'),
    unlistedMarks().length
      ? h('div', { title: '파일을 읽지 못했거나 맵이 오래되어 목록에 없는 스토리에 남은 표시' },
          markList('목록 밖 스토리 표시', 'unread-marks', unlistedMarks(), (m) => m.target.story, null, selectStory))
      : null,
  ];
}

const filePlace = (file, line) => `${file}:${line ?? '?'}`;
const testPlace = (t) => filePlace(t.testFile ?? t.file, t.line);
const viaRow = (via) => h('div', { class: 'detail' }, '불러오는 파일 ', h('span', { class: 'mono via' }, via.join(', ')));
const screenHead = (s) => [h('span', { class: 'screen-path' }, s.path), ' ', h('span', { class: 'muted' }, s.component), h('div', { class: 'muted mono' }, s.id)];

function testItem(t, { depth = false } = {}) {

    depth ? h('span', { class: 'depth' }, DEPTH_LABELS[t.depth]) : null,
    h('span', { class: `chip ${t.status}` }, TEST_STATUS[t.status]), ' ', t.title, ' ',

function importerItem(t) {

const REASON_PLACEHOLDER = '까닭 (버릴 때는 꼭) · 메모 (넘길 때는 선택)';
const judgmentKey = (t, node) => JSON.stringify([t.ref, node]);
const judgmentErrorOf = (key) => (state.judgmentError?.key === key ? h('p', { class: 'error judgment-error' }, state.judgmentError.message) : null);

function judgmentForm(t, node) {
  const key = judgmentKey(t, node);
  const note = () => state.judgmentNotes.get(key) ?? '';
  return h('div', { class: 'judge-row' },

    h('button', { class: 'hand-over', title: '이 테스트에 이 화면의 태그를 달도록 작업 목록에 올립니다', onclick: () => saveJudgment({ test: t.ref, node, kind: 'hand-over', reason: note() }, key) }, '태그 달기로 넘기기'));
}

const judgmentMeta = (j, label) => h('div', { class: 'detail' },
  j.reason.trim() ? [`${label} `, j.reason] : null,
  h('span', { class: 'muted' }, `${j.reason.trim() ? ' · ' : ''}${j.author} · ${fmtDate(j.date)}`));

const undoButton = (t, node) => h('button', { class: 'undo', onclick: () => saveJudgment({ test: t.ref, node, kind: 'undo' }, judgmentKey(t, node)) }, '되돌리기');

function detachedItem(t) {

function importerTests(s) {
  const importers = importersOf(s.id);
  const discarded = discardedOf(s.id);
  const awaiting = awaitingTagOf(s.id);
  const detached = detachedOf(s.id);
  const rowKeys = [...importers, ...discarded, ...awaiting, ...detached].map((t) => judgmentKey(t, s.id));
  const stray = state.judgmentError && !rowKeys.includes(state.judgmentError.key);
  const pairRow = (item, t, label) => h('div', { class: 'importer' }, item, judgmentMeta(t.judgment, label), undoButton(t, s.id), judgmentErrorOf(judgmentKey(t, s.id)));
  return [
    stray ? h('p', { class: 'error judgment-error' }, state.judgmentError.message) : null,
    importers.length ? h('div', { class: 'importers' },
      h('h2', {}, `불러오는 테스트 ${importers.length}`),
      h('p', { class: 'muted' }, '이 화면에 딸린 소스 파일을 불러오는 단위 테스트입니다. 이 화면의 태그가 없어서 이 화면의 테스트로 세지 않습니다.'),
      importers.map((t) => h('div', { class: 'importer' }, importerItem(t), judgmentForm(t, s.id), judgmentErrorOf(judgmentKey(t, s.id))))) : null,
    awaiting.length ? h('div', { class: 'awaiting-tag' },
      h('h2', {}, `태그 달기 대기 ${awaiting.length}`),
      awaiting.map((t) => pairRow(importerItem(t), t, '메모'))) : null,
    detached.length ? h('div', { class: 'detached' },
      h('h2', {}, `떨어져 나감 ${detached.length}`),
      h('p', { class: 'muted' }, '넘긴 테스트를 결과에서 찾을 수 없습니다. 테스트의 파일이나 제목이 바뀌었거나, 이 화면의 파일을 더는 불러오지 않는 것으로 보입니다.'),
      detached.map((t) => pairRow(detachedItem(t), t, '메모'))) : null,
    discarded.length ? h('div', { class: 'discarded' },
      h('h2', {}, `버린 짝 ${discarded.length}`),
      discarded.map((t) => pairRow(importerItem(t), t, '까닭'))) : null,

function frameAccount(s) {
  const { app } = state.data;
  const account = { url: app.url, label: `${app.account} 로 로그인`, error: app.error };
  const asRole = (r) => ({ url: r.url, label: `${r.role} 역할 ${r.account} 로 로그인`, error: r.error, role: r.role });
  const wanted = s.access.roleValues;
  const unread = s.access.unreadableRoleGuards ?? [];
  const hint = wanted && unread.length ? `읽지 못한 역할 조건도 있습니다: ${unread.join(', ')}` : null;
  return { hint, ...pickAccount(account, asRole, wanted, unread) };
}

function pickAccount(account, asRole, wanted, unread) {
  const { app } = state.data;
  if (state.roleChoice === 'auto') {
    if (wanted === undefined) return { ...account, notes: [] };
    if (wanted === null) {
      return { ...account, notes: [`어느 역할이 조건을 채우는지 맵에서 정할 수 없습니다${unread.length ? `: ${unread.join(', ')}` : ''}`] };
    }
    const meets = app.roles.filter((r) => wanted.includes(r.role));
    const role = meets.find((r) => !r.error) ?? meets[0];
    return role ? { ...asRole(role), notes: [] } : { ...account, notes: [`조건을 채우는 역할(${wanted.join(', ')})에 계정이 없습니다`] };
  }
  const role = app.roles.find((r) => `role:${r.role}` === state.roleChoice);
  if (!role) return { ...account, notes: [] };
  return { ...asRole(role), notes: wanted && !wanted.includes(role.role) ? [`이 역할은 화면 조건(${wanted.join(', ')})을 채우지 못합니다`] : [] };
}

function rolePicker() {
  const { app, map } = state.data;
  const missing = [...new Set(map.screens.flatMap((s) => s.access.roleValues ?? []))].filter((v) => !app.roles.some((r) => r.role === v)).sort();
  const option = (value, label) => h('option', { value, selected: state.roleChoice === value }, label);
  return h('select', { class: 'role', title: '앱을 띄울 계정', onchange: (e) => { state.roleChoice = e.target.value; render(); } },
    option('auto', '자동'),
    option('account', `기본 계정 (${app.account})`),
    app.roles.map((r) => option(`role:${r.role}`, `${r.role} (${r.account})`)),
    missing.map((v) => h('option', { disabled: true }, `${v} — 계정 없음`)));
}

function filledPath(parts, values) {
  let out = '';
  for (const p of parts) {
    if (typeof p === 'string') out += p;
    else if (values[p.name]) out += p.prefix + (p.repeat || p.pattern === '.*' ? values[p.name].split('/').map(encodeURIComponent).join('/') : encodeURIComponent(values[p.name]));
    else if (!p.optional) return null;
  }
  return out || '/';
}

const pathValueKey = (id, role) => `${id}\n${role ?? ''}`;

async function loadPathValues(id, role) {
  const entry = { pending: true };
  state.pathValues.set(pathValueKey(id, role), entry);
  try {
    const res = await fetch(`/api/path-values?screen=${encodeURIComponent(id)}${role ? `&role=${encodeURIComponent(role)}` : ''}`);
    if (!res.ok) throw new Error(await res.text());
    Object.assign(entry, await res.json());
  } catch (err) {
    Object.assign(entry, { parts: null, values: {}, errors: [`경로 변수 값을 가져오지 못했습니다: ${err.message}`], fallback: null });
  }
  Object.assign(entry, { pending: false, draft: { ...entry.values }, opened: 0 });
  if (state.side === 'screens' && state.selected === id && state.view === 'list') renderCenterHead(state.data.map.screens.find((x) => x.id === id));
}

function pathValuesOf(s, role) {
  const key = pathValueKey(s.id, role);
  if (!state.pathValues.has(key)) loadPathValues(s.id, role);
  return state.pathValues.get(key);
}

function frameTarget(s, entry) {
  const { app, appLinks, map } = state.data;
  const at = (routePath, path) => (app.signedOutPaths.includes(routePath) ? app.signedOutUrl : app.url) + path;
  if (!entry) return { link: appLinks[s.id] };
  if (entry.pending) return {};
  const path = entry.parts && filledPath(entry.parts, entry.values);
  if (path) return { link: at(s.path, path) };
  if (entry.opened) return { fallback: false, missing: entry.parts.filter((p) => typeof p !== 'string' && !p.optional && !entry.values[p.name]).map((p) => p.name) };
  if (!entry.fallback) return { fallback: false };
  const opens = map.screens.find((x) => x.id === entry.fallback);
  return { link: at(opens.path, entry.fallbackPath), fallback: true, opens };
}

function pathValueBar(s, entry, fallback) {
  const variables = (entry.parts ?? []).filter((p) => typeof p !== 'string');
  if (!variables.length && !fallback && !entry.errors.length) return null;
  const reopen = () => {
    entry.values = { ...entry.draft };
    entry.opened += 1;
    renderCenterHead(s);
  };
  return h('div', { class: 'path-values' },
    variables.map((v) => h('label', { title: v.optional ? '비워 두면 이 자리를 빼고 엽니다' : null }, v.optional ? `${v.name}?` : v.name, ' ',
      h('input', {
        type: 'text', name: v.name, value: entry.draft[v.name] ?? '', placeholder: '값',
        oninput: (e) => { entry.draft[v.name] = e.target.value; },
        onkeydown: (e) => { if (e.key === 'Enter' && !e.isComposing) reopen(); },
      }))),
    variables.length ? h('button', { onclick: reopen }, '다시 띄우기') : null,
    fallback ? h('span', { class: 'fallback' }, '목록에서 골라 들어가세요') : null,
    entry.errors.map((e) => h('span', { class: 'error' }, e)));
}

function appFrame(s, { link, fallback, opens, missing }, entry) {
  const { app } = state.data;
  if (entry?.pending) return h('div', { class: 'frame-note muted' }, '경로 변수 값을 준비하고 있습니다.');
  const unknown = [
    app.unknownSignedOutPaths.length > 0 && h('span', { class: 'error' }, `맵에 없는 signedOutPaths: ${app.unknownSignedOutPaths.join(', ')}`),
    app.unknownPathValues.length > 0 && h('span', { class: 'error' }, `맵에 없는 pathValues: ${app.unknownPathValues.join(', ')}`),
  ];
  const values = entry && pathValueBar(s, entry, fallback);
  if (!link) {
    return [
      values && h('div', { class: 'frame-bar' }, unknown, values),
      h('div', { class: 'frame-note muted' }, missing ? `${missing.join(', ')} 값이 없어 이 화면을 띄울 수 없습니다.` : '주소에 값이 필요한 화면이라 앱을 띄우지 않았습니다.'),
    ];
  }
  const signedOut = Boolean(app.signedOutUrl) && link.startsWith(`${app.signedOutUrl}/`);
  const who = signedOut ? null : frameAccount(opens ?? s);
  const shown = who ? who.url + link.slice(app.url.length) : link;
  const opened = signedOut
    ? `${app.signedOutUrl}${app.signOutPath}?to=${encodeURIComponent(link.slice(app.signedOutUrl.length))}`
    : shown;
  return [
    h('div', { class: 'frame-bar' },
      h('span', { class: 'mono' }, shown),
      signedOut ? h('span', {}, '로그아웃 상태') : [
        rolePicker(),
        who.error ? h('span', { class: 'error' }, who.error) : h('span', {}, who.label),
        ...who.notes.map((n) => h('span', { class: 'error' }, n)),
        who.hint && h('span', { class: 'muted' }, who.hint),
      ],
      unknown,
      h('a', { href: opened, target: '_blank', rel: 'noopener' }, '새 창으로 열기 ↗'),
      values),
    h('div', { class: 'settings-bar', id: 'settings-bar', hidden: true }),
    h('iframe', { class: 'app', 'data-src': opened, title: '앱 화면' }),
  ];
}

// ---------- 프레임 위에 붙는 설정 줄 ----------

const samePlace = (o, path, item) => o.path.join('.') === path.join('.') && o.item === item;
const overrideIn = (list, path, item) => list.find((o) => samePlace(o, path, item));
const overrides = () => state.data.app?.settings?.overrides ?? [];
const quoted = (v) => JSON.stringify(v);
const sourceLabel = (source) => (source.from === 'route' ? '라우트' : source.inherited ? `${source.from} 에서 물려받음` : `${source.from} 에서 오는 링크`);
const valueAt = (v, keys) => keys.reduce((o, k) => (o !== null && typeof o === 'object' ? o[k] : undefined), v);

function fileDefines(section, key) {
  const values = state.data.app.settings?.file?.[section];
  return values !== null && typeof values === 'object' && Object.hasOwn(values, key);
}

function unchangedKnown(n) {
  const incomplete = state.data.map.settingsDefaultsIncomplete?.[n.root] ?? [];
  return !incomplete.some((p) => p.every((k, i) => k === n.path[i])) || fileDefines(n.path[0], n.path[1]);
}

function blockOf(n) {
  const settings = state.data.app.settings;
  if (!settings) return '설정 파일(app.settingsFile)을 적지 않아 바꿀 수 없습니다';
  if (n.root !== settings.root) return `${n.root} 로 읽는 설정이라 설정 파일로 바꿀 수 없습니다`;
  if (n.path.length < 2) return '섹션 전체는 바꿀 수 없습니다';
  const [section, key] = n.path;
  if (!settings.merged.includes(section)) return `앱이 설정 파일에서 ${section} 섹션을 읽지 않아 바꿀 수 없습니다`;
  if ((n.need === 'includes' || n.path.length > 2) && !unchangedKnown(n)) {
    return `${section}.${key} 기본값을 소스에서 다 읽지 못해, 설정 파일이 이 키를 정하지 않는 한 안쪽 값만 바꾸면 나머지가 사라질 수 있어 바꿀 수 없습니다`;
  }
  if (n.need === 'present') return '어떤 값이 있어야 하는지 몰라 넣을 수 없습니다';
  return null;
}

function unchangedOf(n) {
  const settings = state.data.app.settings;
  if (!settings || n.root !== settings.root || n.path.length < 2 || !settings.merged.includes(n.path[0])) return n.default;
  const [section, key, ...rest] = n.path;
  const top = fileDefines(section, key) ? settings.file[section][key] : state.data.map.settingsDefaults?.[n.root]?.[section]?.[key];
  return valueAt(top, rest);
}

const unchangedIncludes = (n) => {
  const list = unchangedOf(n);
  return Array.isArray(list) && list.includes(n.value);
};

function currentOf(n, list) {
  if (n.need === 'includes') return overrideIn(list, n.path, n.value)?.value ?? unchangedIncludes(n);
  const o = overrideIn(list, n.path);
  return o ? o.value : unchangedOf(n);
}

function satisfied(n, list) {
  const v = currentOf(n, list);
  return { on: Boolean(v), off: !v, equals: v === n.value, includes: v === true, present: Boolean(v) }[n.need];
}

const wantedOf = (n) => (n.need === 'includes' ? { path: n.path, item: n.value, value: true } : { path: n.path, value: n.need === 'equals' ? n.value : n.need === 'on' });

function withOverride(list, op, isDefault) {
  const rest = list.filter((o) => !samePlace(o, op.path, op.item));
  return isDefault ? rest : [...rest, op];
}

function autoOverrides(s, list) {
  const sources = s.access.settings ?? [];
  const fits = (n) => !blockOf(n) || satisfied(n, list);
  const link = sources.find((x) => x.from !== 'route' && x.needs.length && !x.unreadable.length && x.needs.every(fits));
  // 원래 값을 다 읽지 못한 설정은 조건을 채웠는지 알 수 없으므로 필요한 값을 직접 적는다.
  const written = (n) => overrideIn(list, n.path, n.need === 'includes' ? n.value : undefined);
  const needs = sources.filter((x) => x.from === 'route' || x === link).flatMap((x) => x.needs)
    .filter((n) => !blockOf(n) && (!satisfied(n, list) || (!unchangedKnown(n) && !written(n))));
  return needs.length ? needs.reduce((next, n) => withOverride(next, wantedOf(n), unchangedKnown(n) && satisfied(n, [])), list) : null;
}

// 한 단계가 실패해도 다음 단계는 돌고 프레임은 언제나 열린다.
let settingsQueue = Promise.resolve();
function updateSettings(change) {
  const frame = document.querySelector('#center iframe.app');
  settingsQueue = settingsQueue.then(async () => {
    state.settingsError = null;
    try {
      const next = change(overrides());
      if (next) {
        const res = await fetch('/api/settings', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ overrides: next }) });
        if (!res.ok) throw new Error(await res.text());
        state.data.app.settings.overrides = (await res.json()).overrides;
      }
    } catch (err) {
      state.settingsError = `설정을 바꾸지 못했습니다: ${err.message}`;
    }
    renderSettingsBar();
    if (frame?.isConnected) frame.src = frame.dataset.src;
  }).catch((err) => {
    state.settingsError = `설정 줄을 그리지 못했습니다: ${err.message}`;
  });
}

function settingRows(s) {
  const rows = new Map();
  for (const source of s.access.settings ?? []) {
    for (const n of source.needs) {
      const kind = ['includes', 'present'].includes(n.need) ? n.need : 'value';
      const key = quoted([n.root, n.path, kind, kind === 'includes' ? n.value : null]);
      if (!rows.has(key)) rows.set(key, { needs: [], from: new Set() });
      rows.get(key).needs.push(n);
      rows.get(key).from.add(sourceLabel(source));
    }
  }
  return [...rows.values()];
}

function settingControl(row, list) {
  const [n] = row.needs;
  const block = blockOf(n);
  const name = h('code', {}, n.path.join('.'));
  const title = [...row.from].join(' · ');
  if (n.need === 'present') {
    return satisfied(n, list)
      ? h('span', { class: 'setting', title }, name, h('span', { class: 'muted' }, '기본값에 있음'))
      : h('span', { class: 'setting blocked', title }, name, h('span', { class: 'reason' }, block));
  }
  const changed = Boolean(overrideIn(list, n.path, n.need === 'includes' ? n.value : undefined));
  const cls = `setting${changed ? ' changed' : ''}${block ? ' blocked' : ''}`;
  const reason = block ? h('span', { class: 'reason' }, block) : null;
  const disabled = Boolean(block);
  if (n.need === 'includes') {
    const inList = currentOf(n, list);
    const isDefault = (on) => on === unchangedIncludes(n);
    return h('label', { class: cls, title }, name, h('span', {}, `에 ${quoted(n.value)}`),
      h('input', { type: 'checkbox', checked: inList, disabled, onchange: (e) => {
        const on = e.target.checked;
        updateSettings((l) => withOverride(l, { path: n.path, item: n.value, value: on }, isDefault(on)));
      } }), '목록에 넣기', reason);
  }
  const values = [...new Map(row.needs.filter((x) => x.need === 'equals').map((x) => [quoted(x.value), x.value])).values()];
  if (values.length) {
    const current = overrideIn(list, n.path);
    const unchanged = unchangedKnown(n) ? unchangedOf(n) : undefined;
    return h('span', { class: cls, title }, name,
      h('select', { disabled, onchange: (e) => {
        const picked = e.target.value;
        const value = picked && JSON.parse(picked);
        updateSettings((l) => withOverride(l, { path: n.path, value }, picked === '' || (unchanged !== undefined && value === unchanged)));
      } },
        h('option', { value: '', selected: !current }, `바꾸지 않음${unchanged !== undefined ? ` (${quoted(unchanged)})` : ''}`),
        values.map((v) => h('option', { value: quoted(v), selected: current && quoted(current.value) === quoted(v) }, quoted(v)))),
      reason);
  }
  const on = Boolean(currentOf(n, list));
  const set = (value) => () => updateSettings((l) => withOverride(l, { path: n.path, value }, unchangedKnown(n) && value === Boolean(unchangedOf(n))));
  return h('span', { class: cls, title }, name,
    h('button', { class: on ? 'on' : '', disabled, onclick: set(true) }, '켜기'),
    h('button', { class: on ? '' : 'on', disabled, onclick: set(false) }, '끄기'),
    reason);
}

const overrideText = (o) => (o.item === undefined ? `${o.path.join('.')} = ${quoted(o.value)}` : `${o.path.join('.')} 에 ${quoted(o.item)} ${o.value ? '넣음' : '뺌'}`);

function renderSettingsBar() {
  const bar = document.getElementById('settings-bar');
  const s = state.data.map.screens.find((x) => x.id === state.frameScreen);
  if (!bar || !s) return;
  const list = overrides();
  const rows = settingRows(s);
  const unreadable = (s.access.settings ?? []).flatMap((x) => x.unreadable.map((u) => ({ ...u, source: x })));
  const others = list.filter((o) => !rows.some((r) => samePlace(o, r.needs[0].path, r.needs[0].need === 'includes' ? r.needs[0].value : undefined)));
  bar.hidden = !rows.length && !unreadable.length && !list.length && !state.settingsError;
  bar.classList.toggle('overridden', list.length > 0);
  fill(bar,
    h('span', { class: 'title' }, list.length ? `설정 ${list.length}개 바꿈` : '설정'),
    rows.map((r) => settingControl(r, list)),
    unreadable.map((u) => h('span', { class: 'setting blocked', title: sourceLabel(u.source) }, h('code', {}, u.guard), h('span', { class: 'reason' }, u.reason))),
    others.length ? h('span', { class: 'others' }, '다른 화면에서 바꾼 설정 ', others.map((o) => h('span', { class: 'setting changed' }, h('code', {}, overrideText(o))))) : null,
    list.length ? h('button', { class: 'reset', onclick: () => updateSettings(() => []) }, '기본값으로') : null,
    state.data.app.settings?.fileError ? h('span', { class: 'file-error' }, state.data.app.settings.fileError) : null,
    state.settingsError ? h('span', { class: 'error' }, state.settingsError) : null);
}

function renderCenterHead(s) {
  const head = document.getElementById('center-head');
  const { app, appLinks } = state.data;
  const entry = s && app && !appLinks[s.id] ? pathValuesOf(s, frameAccount(s).role) : null;
  const target = s && app ? frameTarget(s, entry) : null;
  // 앱을 조작하던 중에 표시를 남겨도 프레임이 다시 로드되지 않게, 고른 화면이나 띄울 주소가 바뀔 때만 다시 그린다.
  const key = s ? [s.id, app?.url, state.roleChoice, target?.link, entry?.pending, entry?.opened].join(' ') : '';
  if (head.dataset.key === key) return;
  head.dataset.key = key;
  if (!s) return fill(head);
  const link = appLinks[s.id];
  fill(head,
    h('div', { class: 'title-row' },
      h('h3', {}, s.path),
      h('span', { class: 'muted' }, s.component),
      app ? null
        : link ? h('a', { href: link, target: '_blank', rel: 'noopener' }, '실제 앱에서 열기 ↗')
          : state.data.appUrl ? h('span', { class: 'muted' }, '경로 변수가 있어 실제 앱 링크를 만들 수 없음') : null),
    h('div', { class: 'muted mono' }, s.id),
    app ? appFrame(s, target, entry) : null);
  // 값을 불러오는 동안이나 값이 비어 주소가 없을 때는 마지막으로 띄운 화면을 그대로 기억한다.
  if (!target?.link) return;
  const shownId = (target.opens ?? s).id;
  const moved = shownId !== state.frameScreen;
  state.frameScreen = shownId;
  if (moved) state.settingsError = null;
  renderSettingsBar();
  const shown = state.data.map.screens.find((x) => x.id === shownId);
  updateSettings(moved ? (list) => autoOverrides(shown, list) : () => null);
}

function stepItem(step, i) {
  if (!step.onMap) {
    return h('div', { class: 'step off-map' },
      h('span', { class: 'no' }, i + 1),
      h('span', { class: 'name' }, h('div', { class: 'muted mono' }, step.screen)),
      h('span', { class: 'chip l-off-map' }, '맵에 없는 화면'));
  }
  const s = screenOf(step.screen);
  return h('div', { class: 'step on-map', title: '화면 목록에서 이 화면을 엽니다', onclick: () => openScreen(s.id) },
    h('span', { class: 'no' }, i + 1),
    h('span', { class: 'name' }, screenHead(s), stepTests(s.id)));
}

function stepTests(id) {
  const tests = testsOf(id);
  if (!tests.length) return h('div', { class: 'step-tests' }, h('span', { class: 'none' }, '화면 테스트 없음'));
  return h('div', { class: 'step-tests' }, state.data.depths.map((d) => {
    const at = tests.filter((t) => t.depth === d);
    return at.length ? h('span', { title: at.map((t) => `${TEST_STATUS[t.status]} ${t.title}`).join('\n') }, DEPTH_LABELS[d], ' ', countsOf(at)) : null;
  }));
}

const wayItem = (w, scope = null) => h('li', {}, h('code', {}, `${w.file}:${w.line}`),
  w.conditions.length ? w.conditions.map((g) => accessGuard(g, scope, state.storyOpen)) : h('span', { class: 'muted' }, ' 조건 없음'));

const unknownList = (links) => h('ul', { class: 'plain ways unknown-links' }, links.map((u) => h('li', {}, h('code', {}, `${u.file}:${u.line}`), ' → ', h('code', {}, u.to))));
const skippedLinks = (links) => [h('div', { class: 'muted skipped' }, '판정에서 뺀 링크'), unknownList(links)];

function linkItem(l) {
  return h('div', { class: `link l-${l.verdict}` },
    h('span', { class: `chip l-${l.verdict}` }, LINK_VERDICT[l.verdict]),
    l.verdict === 'off-map' ? h('span', { class: 'muted' }, ' 화면 없음') : null,
    l.verdict === 'unknown' ? [h('span', { class: 'muted' }, ' 주소 못 읽은 링크'), unknownList(l.unknownLinks)] : null,
    l.ways.length ? h('ul', { class: 'plain ways' }, l.ways.map((w) => wayItem(w))) : null,
    l.ways.length > 0 && l.unknownLinks ? skippedLinks(l.unknownLinks) : null);
}

function clearCenterHead() {
  const head = document.getElementById('center-head');
  head.dataset.key = '';
  fill(head);
}

const compareText = (a, b) => (a < b ? -1 : a > b ? 1 : 0);

const PAIR_STATES = [
  { list: 'importers', label: '불러옴', cls: 'config' },
  { list: 'awaitingTag', label: '태그 달기 대기', cls: 'wait', noteLabel: '메모' },
  { list: 'detachedHandOvers', label: '떨어져 나감', cls: 'wait', noteLabel: '메모' },
  { list: 'discarded', label: '버린 짝', cls: 'muted', noteLabel: '까닭' },
];

function pairsOf(t) {
  const ref = JSON.stringify(t.ref);
  const pairs = [];
  for (const { list, ...rest } of PAIR_STATES) {
    for (const [id, entries] of Object.entries(state.data.tests[list] ?? {})) {
      const entry = entries.find((e) => JSON.stringify(e.ref) === ref);
      if (entry) pairs.push({ id, entry, ...rest });
    }
  }
  return pairs.sort((a, b) => compareText(screenLabel(a.id), screenLabel(b.id)) || compareText(a.id, b.id));
}

function pairItem({ id, entry, label, cls, noteLabel }) {
  const s = screenOf(id);
  const body = h('span', { class: 'name' },
    s ? screenHead(s) : h('div', { class: 'muted mono' }, id),
    entry.via ? viaRow(entry.via) : null,
    entry.judgment ? judgmentMeta(entry.judgment, noteLabel) : null);
  const stateChip = h('span', { class: `chip pair-state ${cls}` }, label);
  if (!s) return h('div', { class: 'step off-map pair' }, body, h('span', { class: 'chip l-off-map' }, '맵에 없는 화면'), stateChip);
  return h('div', { class: `step on-map pair${state.bulkBusy ? ' locked' : ''}`, title: state.bulkBusy ? null : '화면 목록에서 이 화면을 엽니다', onclick: () => openScreen(id) }, body, stateChip);
}

function noScreensText(t) {
  if (t.testFile) return '이 테스트가 불러오는 파일로 이어진 화면이 없습니다. 화면 넷 이상이 함께 쓰는 파일과 찾지 못한 파일로는 잇지 않습니다.';
  if (t.format !== 'vitest') return `이 결과 형식(${t.format})에는 테스트가 불러오는 파일이 적혀 있지 않아, 어느 화면에 이어지는지 읽지 못했습니다.`;
  const reason = (state.data.tests.importNotices ?? []).find((n) => n.file === t.file)?.reason;
  return `테스트가 불러오는 파일을 읽지 못했습니다.${reason ? ` ${reason}.` : ''}`;
}

// 맵에 없는 화면의 짝은 판단해도 되돌릴 곳이 없어 고르지 못하게 한다.
const isPickable = (p) => !p.entry.judgment && Boolean(screenOf(p.id));

function redrawBulk(focusSelector) {
  renderUntaggedCenter();
  document.querySelector(`#center ${focusSelector}`)?.focus();
}

// 고를 짝이 남지 않아 단추 줄이 사라지면 짝 묶음의 제목으로 간다.
function focusBulk(kind) {
  const pairs = document.querySelector('#center .test-pairs');
  const bar = pairs?.querySelector('.bulk-bar');
  (bar ? bar.querySelector(`button.${kind}:enabled`) ?? bar.querySelector('input') : pairs?.querySelector('h2'))?.focus();
}

// 찾기 칸처럼 다시 그려도 남는 칸의 초점은 단추로 가져오지 않는다. 가져오면 치던 Space 나 Enter 가 단추를 다시 누른다.
function showBulkResult(kind) {
  const focused = document.activeElement;
  render();
  if (!focused || focused === document.body || !focused.isConnected) focusBulk(kind);
}

function setPick(bulk, id, on) {
  if (on) bulk.picked.add(id); else bulk.picked.delete(id);
  redrawBulk(`input.pick[data-pair="${CSS.escape(id)}"]`);
}

const bulkButtonOff = (count) => state.bulkBusy || state.ending || !count;

function bulkBar(t, pickable, bulk) {
  const count = pickable.filter((p) => bulk.picked.has(p.id)).length;
  const button = (kind, cls, title, text) => h('button', { class: cls, title, disabled: bulkButtonOff(count), onclick: () => saveBulk(t, bulk, kind) }, `${text} (${count})`);
  return h('div', { class: 'bulk-bar' },
    h('label', {}, h('input', { type: 'checkbox', class: 'pick-all', checked: count === pickable.length, disabled: state.bulkBusy,
      onchange: (e) => { bulk.picked = new Set(e.target.checked ? pickable.map((p) => p.id) : []); redrawBulk('input.pick-all'); } }), ' 모두 고르기'),
    h('input', { type: 'text', class: 'reason', placeholder: REASON_PLACEHOLDER, value: bulk.note, disabled: state.bulkBusy, oninput: (e) => { bulk.note = e.target.value; } }),
    button('discard', 'discard', '고른 짝을 다시 보이지 않게 합니다', '버리기'),
    button('hand-over', 'hand-over', '고른 짝에 태그를 달도록 작업 목록에 올립니다', '태그 달기로 넘기기'),
    bulk.error ? h('p', { class: 'error bulk-error' }, bulk.error) : null);
}

function renderUntaggedCenter() {
  clearCenterHead();
  const center = document.getElementById('center-body');
  if (untaggedListMissing()) return fill(center, h('p', { class: 'muted' }, '이 tests.json 에는 태그 없는 테스트 목록이 없습니다. duru rebuild 를 다시 실행하세요.'));
  const t = untaggedTests().find((x) => untaggedKey(x) === state.untaggedTest);
  if (!t) return fill(center, h('p', { class: 'muted' }, '태그 없는 테스트가 없습니다.'));
  const pairs = pairsOf(t);
  const pickable = pairs.filter(isPickable);
  const bulk = state.bulk;
  for (const id of bulk.picked) if (!pickable.some((p) => p.id === id)) bulk.picked.delete(id);
  const pickRow = (p) => h('div', { class: 'pair-row' },
    isPickable(p)
      ? h('input', { type: 'checkbox', class: 'pick', 'data-pair': p.id, checked: bulk.picked.has(p.id), disabled: state.bulkBusy, onchange: (e) => setPick(bulk, p.id, e.target.checked) })
      : h('span', { class: 'pick-space' }),
    pairItem(p));
  fill(center,
    h('div', { class: 'title-row' }, h('h3', {}, t.title), h('span', { class: `chip ${t.status}` }, TEST_STATUS[t.status])),
    h('div', { class: 'muted mono' }, testPlace(t)),
    h('div', { class: 'muted' }, `${t.format} · ${t.source}`),
    h('div', { class: 'test-pairs' },
      h('h2', { tabindex: '-1' }, `이 테스트와 화면의 짝 ${pairs.length}`),
      pickable.length ? bulkBar(t, pickable, bulk) : null,
      pairs.length
        ? h('div', { class: 'story-path' }, pairs.map(pickRow))
        : h('p', { class: 'muted no-screens' }, noScreensText(t))));
}

function renderStoryCenter() {
  clearCenterHead();
  const center = document.getElementById('center-body');
  const st = storyOf();
  if (!st && state.story) return fill(center, h('h3', {}, state.story), h('p', { class: 'muted', title: '스토리 파일을 읽지 못했거나 맵이 오래되어 경로를 맞춰 보지 못했습니다' }, '경로 판정 없음'));
  if (!st) return fill(center, h('p', { class: 'muted' }, '스토리가 없습니다.'));
  const storyTests = ownTests(state.data.tests.stories, st.id);
  fill(center,
    h('div', { class: 'title-row' }, h('h3', {}, st.name), statusChip(st), storyChips(st)),
    h('div', { class: 'muted mono' }, `${st.id} · ${st.file}`),
    h('div', { class: 'muted' }, `${st.author} · ${st.date}`),
    st.memo ? h('p', { class: 'memo' }, st.memo) : null,
    h('div', { class: 'story-tests' }, h('h2', {}, `스토리 테스트 ${storyTests.length}`),
      storyTests.length ? storyTests.map((t) => testItem(t, { depth: true })) : h('p', { class: 'muted' }, '없음')),
    h('h2', {}, `화면 순서 ${st.steps.length}`),
    h('div', { class: 'story-path' }, st.steps.flatMap((step, i) => [i > 0 ? linkItem(st.links[i - 1]) : null, stepItem(step, i)])));
}

const stepLabel = (r) => (r.kind === 'start' ? `첫 화면 ${screenLabel(r.screen)}`
  : r.kind === 'route' ? `${screenLabel(r.screen)} 라우트` : `${screenLabel(r.from)} → ${screenLabel(r.to)}`);

function reachItem(r, scope) {
  if (r.kind === 'start') {
    return [h('h3', {}, stepLabel(r)),
      h('div', {}, '열리려면 필요한 것 ', r.kinds.map(kindChip)),
      r.roleValues ? h('div', {}, `열 수 있는 역할 ${r.roleValues.join(', ')}`)
        : r.roleValues === null ? h('div', { class: 'muted' }, '역할 미확인') : null,
      h('div', { class: 'muted' }, '들어오는 링크: 화면 목록에서')];
  }
  if (r.kind === 'route') {
    return [h('h3', {}, stepLabel(r)), h('code', {}, `${state.data.routesFile}:${r.line}`), ...r.guards.map((g) => accessGuard(g, scope, state.storyOpen))];
  }
  return [h('h3', {}, stepLabel(r)),
    r.ways.length > 1 ? h('div', { class: 'muted' }, `링크 ${r.ways.length}개 중 하나`) : null,
    h('ul', { class: 'plain ways' }, r.ways.map((w, i) => wayItem(w, `${scope}\n${i}`))),
    ...(r.unknownLinks ? skippedLinks(r.unknownLinks) : [])];
}

function storyProblems(st) {
  const broken = st.links.filter((l) => l.verdict === 'broken').length;
  return [
    broken ? ['unreachable', `도달 불가 · 링크 없음 ${broken}곳`] : null,
    st.detached ? ['unjudged', '판정 못 함 · 화면 없음'] : null,
    st.unjudged ? ['unjudged', '판정 못 함 · 주소 못 읽은 링크'] : null,
  ].filter(Boolean);
}

function reachBlock(st) {
  const key = `story\n${st.id}`;
  return [
    storySummary(st.reach),
    h('details', { class: 'reach-raw', open: state.storyOpen.has(key), ontoggle: rememberOpen(state.storyOpen, key) },
      h('summary', {}, '조건식과 위치'),
      h('ul', { class: 'plain reach' }, st.reach.map((r, i) => h('li', { class: `reach-${r.kind}` }, reachItem(r, `${key}\n${i}`))))),
  ];
}

function renderStoryRight(info, dock) {
  const st = storyOf();
  if (!st) {
    fill(info);
    return fill(dock, state.story ? markForm({ story: state.story }, 'storyDraft', '스토리') : null);
  }
  const problems = storyProblems(st);
  fill(dock, markForm({ story: st.id }, 'storyDraft', '스토리'));
  fill(info,
    (problems.length ? problems : [['reachable', '도달 가능']]).map(([cls, text]) => h('p', { class: `verdict ${cls}` }, text)),
    st.links.some((l) => l.ways.length && l.unknownLinks) ? h('p', { class: 'muted skipped' }, '주소 못 읽은 링크 빼고 판정') : null,
    h('h2', {}, '사전 조건'),
    st.reach.length ? reachBlock(st) : h('p', { class: 'muted' }, problems.length ? '판정한 구간에 조건 없음' : '조건 없음'));
}

function renderCenter() {
  if (state.side === 'stories') return renderStoryCenter();
  if (state.side === 'untagged') return renderUntaggedCenter();
  const center = document.getElementById('center-body');
  const s = state.data.map.screens.find((x) => x.id === state.selected);
  renderCenterHead(s);
  if (!s) return fill(center, h('p', { class: 'muted' }, '화면이 없습니다.'));
  const tests = testsOf(s.id);
  const rows = [{ label: '화면 전체', target: { node: s.id }, tests: [] }]
    .concat(state.data.depths.map((d) => ({ label: DEPTH_LABELS[d], target: { node: s.id, depth: d }, tests: tests.filter((t) => t.depth === d) })));
  fill(center,
    h('table', {},
      h('thead', {}, h('tr', {}, h('th', {}, '깊이'), h('th', {}, '테스트'), h('th', {}, '표시'))),
      h('tbody', {}, rows.map((r) => h('tr', {
        class: keyOf(r.target) === keyOf(state.target) ? 'selected' : '',
        onclick: () => selectTarget(r.target),
      },
        h('td', { class: 'depth' }, r.label),
        h('td', {}, r.target.depth ? (r.tests.length ? r.tests.map(testItem) : h('span', { class: 'muted' }, '없음')) : h('span', { class: 'muted' }, `테스트 ${tests.length}개`)),
        h('td', { class: 'mark' }, markChip(markOf(r.target)) ?? h('span', { class: 'muted' }, '—')))))),
    importerTests(s),
    callTable(s),
  );
}

const serverText = (server) => (server.status === 'match' && server.labels?.length
  ? `${SERVER_STATUS.match} (${server.labels.join(', ')})`
  : SERVER_STATUS[server.status] ?? server.status);

function verdictChip(server) {
  return h('span', { class: `chip v-${server.status}`, title: server.candidates ? `서버에는 ${server.candidates.join(' / ')}` : null }, serverText(server));
}

function callRows(s) {
  const rows = [];
  const seen = new Set();
  for (const c of s.apiCalls) {
    const site = `${c.fn} · ${c.file}:${c.line}`;
    if (!c.endpoints) {
      rows.push({ site, problem: 'API 함수를 찾지 못함' });
      continue;
    }
    for (const e of c.endpoints) {
      if (!e.callId) rows.push({ site, problem: `${e.method ?? '?'} ${e.url ?? '주소를 계산하지 못함'}`, server: e.server });
      else if (!seen.has(e.callId)) {
        seen.add(e.callId);
        rows.push({ call: callOf(e.callId) });
      }
    }
  }
  return rows;
}

function countsOf(tests) {
  const counts = { pass: 0, fail: 0, pending: 0 };
  for (const t of tests) counts[t.status] += 1;
  return tests.length ? countText(counts) : h('span', { class: 'muted' }, '—');
}

function cell(target, tests, empty) {
  return h('td', {
    class: `cell${keyOf(target) === keyOf(state.target) ? ' selected' : ''}`,
    onclick: () => selectTarget(target),
  },
    h('div', {}, !tests.length && empty ? h('span', { class: 'none' }, empty) : countsOf(tests)),
    markChip(markOf(target)));
}

// 「옵션 지정 없음」 줄은 표시 대상이 아니라서 칸을 눌러도 고를 수 없다.
function optionRows(s, call, depths) {
  const options = optionsOf(s, call.id);
  if (!options.length) return [];
  const tests = testsOf(call.id);
  const byDepth = (list) => depths.map((d) => list.filter((t) => t.depth === d));
  const rows = options.flatMap((o) => [true, false].map((value) => {
    const target = { node: call.id, option: { key: o.key, value } };
    const matching = hasOption(tests, o.key, value);
    const split = byDepth(matching);
    return h('tr', { class: `option${matching.length ? '' : ' gap'}` },
      h('td', { class: 'call' }, h('div', {}, optionLabel(target.option)),
        o.sources.includes('config') ? h('span', { class: 'chip config', title: '설정 bodyOptions 에 적은 옵션' }, '설정') : null),
      cell(target, matching, '테스트 없음'),
      depths.map((d, i) => cell({ ...target, depth: d }, split[i])));
  }));
  const unspecified = tests.filter((t) => !t.options?.length);
  rows.push(h('tr', { class: 'option' },
    h('td', { class: 'call', title: '옵션 태그를 달지 않은 테스트' }, h('div', {}, '옵션 지정 없음')),

const shownTarget = () => (state.side === 'stories' ? { story: state.story } : state.target);

  return !!shown && keyOf(shown) === keyOf(target);
};

function showSaveError(reason, target) {
  state.error = isShown(target) ? `저장하지 못했습니다: ${reason}` : `「${targetName(target)}」 표시를 저장하지 못했습니다: ${reason}`;
  if (!state.ended) renderRight();
}

async function saveMark(target, draftKey) {
  state.error = null;
  const draft = state[draftKey];
  try {
    const res = await fetch('/api/marks', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ target, status: draft.status, note: draft.note }),
    });
    if (!res.ok) throw new Error(await res.text());
  } catch (err) {
    return showSaveError(err.message, target);
  }
  const owner = draftKey === 'storyDraft' ? { story: state.story } : state.target;
  const untouched = !!owner && keyOf(owner) === keyOf(target) && !unsaved(target, state[draftKey]);
  if (state[draftKey] === draft || untouched) state[draftKey] = null;
  try {
    await load();
  } catch (err) {
    state.error = isShown(target) ? `저장했지만 다시 읽지 못했습니다: ${err.message}` : `「${targetName(target)}」 표시는 저장했지만 다시 읽지 못했습니다: ${err.message}`;
  }
  render();
}

function judgmentProblem(kind, reason) {
  if (kind === 'discard' && !reason.trim()) return '버리는 까닭을 적어 주세요.';
  return null;
}

async function postJudgment(judgment) {
  try {
    const res = await fetch('/api/judgments', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(judgment) });
    if (!res.ok) throw new Error(await res.text());
  } catch (err) {
    return `저장하지 못했습니다: ${err.message}`;
  }
  return null;
}

async function saveJudgment(judgment, key) {
  const fail = (message) => {
    state.judgmentError = { key, message };
    render();
  };
  state.judgmentError = null;
  const problem = judgmentProblem(judgment.kind, judgment.reason) ?? await postJudgment(judgment);
  if (problem) return fail(problem);
  state.judgmentNotes.delete(key);
  try {
    await load();
  } catch (err) {
    state.judgmentError = { key, message: `저장했지만 다시 읽지 못했습니다: ${err.message}` };
  }
  render();
}

async function saveBulk(t, bulk, kind) {
  const chosen = pairsOf(t).filter((p) => isPickable(p) && bulk.picked.has(p.id));
  const reason = bulk.note;
  bulk.error = null;
  const problem = judgmentProblem(kind, reason);
  if (problem) {
    bulk.error = problem;
    return showBulkResult(kind);
  }
  state.bulkBusy = true;
  render();
  const names = (list) => list.map((p) => screenLabel(p.id)).join(', ');
  const saved = [];
  let failure = null;
  for (const p of chosen) {
    failure = await postJudgment({ test: t.ref, node: p.id, kind, reason });
    if (failure) break;
    saved.push(p);
    bulk.picked.delete(p.id);
  }
  let reloadError = null;
  try {
    await load();
  } catch (err) {
    reloadError = `${saved.length ? '저장했지만 ' : ''}다시 읽지 못했습니다: ${err.message}`;
  }
  state.bulkBusy = false;
  if (failure) {
    bulk.error = [failure, `저장한 짝 ${saved.length}: ${names(saved) || '없음'}. 저장하지 못한 짝 ${chosen.length - saved.length}: ${names(chosen.slice(saved.length))}.`, reloadError].filter(Boolean).join('\n');
  } else {
    bulk.note = '';
    bulk.error = reloadError;
  }
  showBulkResult(kind);
}

const GAP = 12, COL_GAP = 50, CELL_GAP = 24, CALL_INDENT = 16, GROUP_SPACE = 24, GROUP_HEAD_H = 28;

const screensIn = (roots) => roots.flatMap((n) => [n, ...screensIn(n.children)]);

// 접힌 상자는 하위 상자까지 합친 결과로 색이 정해져 자기 빈틈이 가려지므로, 자기와 하위 어디에도 빈틈이 없는 가지만 접는다.

function openGapsOnly(roots) {
  const walk = (n) => {
    const below = n.children.map(walk).some(Boolean);
    const callGap = n.calls.some((c) => isGap(c.counts));
    const any = below || callGap || isGap(n.counts);
    if (any) state.collapsed.delete(n.id); else if (n.children.length) state.collapsed.add(n.id);
    if (callGap) state.openCalls.add(n.id); else state.openCalls.delete(n.id);

const flowTrees = () => (state.focus ? state.focus.roots : [...state.data.flow.roots, ...state.data.flow.unreached]);

let focusRequest = null;
async function branchRoots(id) {
  const res = await fetch(`/api/flow?from=${encodeURIComponent(id)}`);
  if (!res.ok) throw new Error(await res.text());
  return (await res.json()).roots;
}

async function focusOn(id) {
  focusRequest = id;

  } catch (err) {
