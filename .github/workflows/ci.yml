name: CI

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.18', '24']
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Changes other than CLAUDE.md
        id: scope
        run: |
          if git diff --name-only HEAD^1 HEAD | grep -qvx 'CLAUDE.md'; then
            echo "test=true" >> "$GITHUB_OUTPUT"
          else
            echo "test=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v7
        if: steps.scope.outputs.test == 'true'
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - if: steps.scope.outputs.test == 'true'
        run: npm ci
      - name: Chromium for the browser tests
        if: steps.scope.outputs.test == 'true'
        run: npx playwright-core install --with-deps chromium
      - if: steps.scope.outputs.test == 'true'
        run: npm test
      - name: Maps of the example apps
        if: steps.scope.outputs.test == 'true'
        run: |
          npm run extract -- test/fixtures/app/config.json
          npm run extract -- test/fixtures/ts-app/config.json
